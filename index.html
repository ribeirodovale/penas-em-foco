<script>/* questions/m5.js */
window.PENA = window.PENA || { modules: [], questions: [], widgets: {}, css: [] };
PENA.questions.push(
  { id: 'm5-01', modulo: 'm5', tema: 'Requisitos objetivos', tipo: 'vf', nivel: 1,
    enunciado: 'Condenado por furto simples a exatamente 4 anos de reclusão, primário e com circunstâncias judiciais favoráveis, tem direito à substituição da pena por restritiva de direitos.',
    correta: true,
    explicacao: 'Verdadeiro. O art. 44, I, fala em pena “não superior a quatro anos”, o que inclui os 4 anos. O STJ reconheceu a substituição num caso de 4 anos (AgRg no AREsp 2.858.967/SP, 2025).',
    fonte: 'CP, art. 44, I; STJ, AgRg no AREsp 2.858.967/SP' },
  { id: 'm5-02', modulo: 'm5', tema: 'Requisitos objetivos', tipo: 'vf', nivel: 1,
    enunciado: 'Em crime ambiental doloso, sem violência, com pena aplicada de 4 anos, aplica-se a mesma regra do Código Penal e a substituição é possível.',
    correta: false,
    explicacao: 'Falso. A Lei 9.605/98, art. 7º, I, exige crime culposo ou pena INFERIOR a 4 anos. Exatamente 4 anos cabe no CP, mas não na Lei Ambiental.',
    fonte: 'Lei 9.605/98, art. 7º, I' },
  { id: 'm5-03', modulo: 'm5', tema: 'Crimes de trânsito', tipo: 'mc', nivel: 2,
    enunciado: 'Quanto ao homicídio culposo na direção de veículo sob influência de álcool (CTB, art. 302, § 3º), é correto afirmar:',
    opcoes: [
      'Cabe substituição, pois nos crimes culposos não há limite de pena.',
      'Cabe substituição se a pena aplicada não superar 4 anos.',
      'É vedada a substituição, qualquer que seja a pena, por força do art. 312-B do CTB.',
      'Cabe substituição, mas apenas por prestação de serviços à comunidade (art. 312-A do CTB).'
    ],
    correta: 2,
    explicacao: 'A Lei 14.071/2020 incluiu o art. 312-B no CTB, afastando o art. 44, I, do CP para o art. 302, § 3º e o art. 303, § 2º. A regra “culposo admite qualquer pena” (A) tem justamente essa exceção. O art. 312-A (D) só define a modalidade quando a substituição é cabível.',
    fonte: 'CTB, arts. 302, § 3º, 312-A e 312-B' },
  { id: 'm5-04', modulo: 'm5', tema: 'Violência doméstica', tipo: 'vf', nivel: 1,
    enunciado: 'A Súmula 588 do STJ alcança também a contravenção penal, como as vias de fato, praticada com violência contra a mulher no ambiente doméstico, impedindo a substituição.',
    correta: true,
    explicacao: 'Verdadeiro. A súmula fala em “crime ou contravenção penal”. O raciocínio do “crime anão” do HC 180.353/MS (2010), que admitia a substituição em vias de fato, está superado nesse contexto.',
    fonte: 'STJ, Súmula 588; HC 180.353/MS' },
  { id: 'm5-05', modulo: 'm5', tema: 'Reincidência', tipo: 'mc', nivel: 1,
    enunciado: 'O réu reincidente em crime doloso pode ter a pena privativa de liberdade substituída por restritiva de direitos?',
    opcoes: [
      'Nunca, pois a reincidência em crime doloso é impedimento absoluto.',
      'Sim, se a medida for socialmente recomendável e a reincidência não se der no mesmo crime.',
      'Sim, sempre que a pena aplicada for inferior a 2 anos.',
      'Sim, desde que a reincidência seja específica.'
    ],
    correta: 1,
    explicacao: 'É a exceção do art. 44, § 3º: cabe se a medida for socialmente recomendável e a reincidência NÃO for específica. A alternativa D inverte a regra: o reincidente específico nunca obtém a substituição.',
    fonte: 'CP, art. 44, II e § 3º' },
  { id: 'm5-06', modulo: 'm5', tema: 'Quantidade de penas', tipo: 'mc', nivel: 1,
    enunciado: 'Condenação a 10 meses de detenção, com todos os requisitos do art. 44 preenchidos. A substituição pode ser feita por:',
    opcoes: [
      'Duas penas restritivas de direitos.',
      'Uma pena restritiva de direitos e multa.',
      'Apenas prestação de serviços à comunidade, pois a pena supera 6 meses.',
      'Multa ou uma pena restritiva de direitos.'
    ],
    correta: 3,
    explicacao: 'Pena até 1 ano: multa OU uma restritiva (art. 44, § 2º, 1ª parte). As alternativas A e B descrevem a regra para pena acima de 1 ano. A PSC é cabível (pena superior a 6 meses), mas não é a única opção.',
    fonte: 'CP, art. 44, § 2º' },
  { id: 'm5-07', modulo: 'm5', tema: 'PSC', tipo: 'vf', nivel: 1,
    enunciado: 'Condenado a exatamente 6 meses de detenção, com os requisitos do art. 44 presentes, pode ter a pena substituída por prestação de serviços à comunidade.',
    correta: false,
    explicacao: 'Falso. A PSC só cabe para condenações SUPERIORES a 6 meses (art. 46, caput). Com 6 meses, o juiz pode usar outra restritiva ou multa.',
    fonte: 'CP, art. 46, caput' },
  { id: 'm5-08', modulo: 'm5', tema: 'Prestação pecuniária', tipo: 'mc', nivel: 2,
    enunciado: 'Sobre a prestação pecuniária, assinale a alternativa correta.',
    opcoes: [
      'Varia de 1 a 360 salários mínimos e, se o condenado solvente não pagar, pode ser reconvertida em pena privativa de liberdade.',
      'É fixada em dias-multa e destina-se ao Fundo Penitenciário.',
      'Pode ter como beneficiário o Ministério Público, por sua destinação social.',
      'O valor pago não pode ser deduzido de eventual condenação em ação de reparação civil.'
    ],
    correta: 0,
    explicacao: 'Art. 45, § 1º e art. 44, § 4º (STF, HC 122.563/MG). A alternativa B descreve a multa. Judiciário e MP não podem ser beneficiários, pois não são “entidades”. E o valor pago é deduzido da reparação civil se os beneficiários coincidirem.',
    fonte: 'CP, arts. 44, § 4º e 45, § 1º; STF, HC 122.563/MG' },
  { id: 'm5-09', modulo: 'm5', tema: 'Perda de bens', tipo: 'mc', nivel: 2,
    enunciado: 'Sobre a perda de bens e valores como pena restritiva de direitos, assinale a correta.',
    opcoes: [
      'Recai sobre o produto e os instrumentos do crime.',
      'Tem como teto o menor valor entre o prejuízo causado e o proveito obtido.',
      'Recai sobre o patrimônio lícito do condenado e destina-se, em regra, ao FUNPEN.',
      'É cabível tanto em crimes quanto em contravenções penais.'
    ],
    correta: 2,
    explicacao: 'Art. 45, § 3º. Produto e instrumentos (A) são objeto do confisco, efeito da condenação. O teto é o MAIOR valor (B). A perda não cabe em contravenção (D).',
    fonte: 'CP, art. 45, § 3º; Masson, p. 605' },
  { id: 'm5-10', modulo: 'm5', tema: 'Interdição temporária', tipo: 'vf', nivel: 2,
    enunciado: 'A suspensão de habilitação para dirigir (art. 47, III) aplica-se aos crimes culposos de trânsito, e o STF considera constitucional aplicá-la ao motorista profissional condenado por homicídio culposo no trânsito.',
    correta: true,
    explicacao: 'Verdadeiro. É interdição específica (art. 57), e o Tema 486 de Repercussão Geral do STF afirma a constitucionalidade em relação ao motorista profissional.',
    fonte: 'CP, arts. 47, III e 57; STF, Tema 486 RG' },
  { id: 'm5-11', modulo: 'm5', tema: 'Reconversão', tipo: 'calc', nivel: 2,
    enunciado: 'Pena de 1 ano substituída por prestação pecuniária de R$ 1.000,00. O condenado pagou R$ 500,00 e deixou de pagar o restante sem justificativa. Na reconversão, quanto de pena privativa de liberdade ele deverá cumprir?',
    opcoes: ['6 meses.', '1 ano.', '30 dias.', 'Nada: o saldo vira dívida de valor.'],
    correta: 0,
    explicacao: 'Nas penas reais não há tempo a abater, então se desconta o percentual pago: R$ 500 de R$ 1.000 = 50%. 1 ano × (1 − 0,5) = 6 meses. A alternativa D descreve a multa, não a prestação pecuniária, que reconverte.',
    fonte: 'CP, art. 44, § 4º; exemplo do material' },
  { id: 'm5-12', modulo: 'm5', tema: 'Reconversão', tipo: 'calc', nivel: 3,
    enunciado: 'Pena de 1 ano (365 dias) substituída por PSC. O condenado cumpriu 350 horas de tarefa e abandonou o serviço sem justificativa. Quanto de pena privativa de liberdade resta cumprir?',
    opcoes: ['15 dias.', 'Nada, pois cumpriu mais de 90% da pena.', '1 ano, pois o descumprimento faz perder o tempo cumprido.', '30 dias.'],
    correta: 3,
    explicacao: 'PSC: 1 hora de tarefa = 1 dia de pena. 365 − 350 = 15 dias de saldo. Mas o art. 44, § 4º exige saldo mínimo de 30 dias de detenção ou reclusão. Resposta: 30 dias. O tempo cumprido é deduzido, não perdido (C).',
    fonte: 'CP, arts. 44, § 4º e 46, § 3º' },
  { id: 'm5-13', modulo: 'm5', tema: 'PSC', tipo: 'calc', nivel: 2,
    enunciado: 'Pena de 2 anos substituída por PSC. O condenado quer terminar o quanto antes. Qual o prazo mínimo em que ele pode cumprir a pena substitutiva?',
    opcoes: [
      '6 meses, pois o juiz pode fixar qualquer prazo.',
      '1 ano, pois nunca pode ser inferior à metade da pena substituída.',
      '1 ano e 6 meses, pois o desconto máximo é de 1/4.',
      '2 anos, pois a PSC sempre tem a mesma duração da pena substituída.'
    ],
    correta: 1,
    explicacao: 'Art. 46, § 4º: pena superior a 1 ano permite cumprir em menor tempo, por faculdade do condenado, nunca abaixo da metade. 2 anos ÷ 2 = 1 ano. As cerca de 730 horas de tarefa (1 hora por dia) seriam concentradas em 1 ano. A alternativa D ignora a ressalva do art. 55.',
    fonte: 'CP, arts. 46, §§ 3º e 4º, e 55' },
  { id: 'm5-14', modulo: 'm5', tema: 'Conversão', tipo: 'vf', nivel: 2,
    enunciado: 'O condenado que ainda não começou a cumprir a restritiva de direitos pode pedir sua conversão em pena privativa de liberdade em regime aberto, por considerá-la mais cômoda.',
    correta: false,
    explicacao: 'Falso. A reconversão depende de descumprimento; o condenado não escolhe a sanção que lhe pareça mais cômoda (STJ, REsp 1.524.484/PE).',
    fonte: 'STJ, REsp 1.524.484/PE' },
  { id: 'm5-15', modulo: 'm5', tema: 'Execução', tipo: 'mc', nivel: 2,
    enunciado: 'Após o trânsito em julgado da condenação a PSC, o juiz da execução:',
    opcoes: [
      'Pode trocar a PSC por prestação pecuniária, se o condenado preferir.',
      'Pode ajustar a forma de cumprimento da PSC às condições pessoais do condenado e às características da entidade.',
      'Pode iniciar a execução da restritiva antes do trânsito em julgado, por ser pena mais branda.',
      'Pode criar pena restritiva não prevista no art. 43, para melhor individualizar.'
    ],
    correta: 1,
    explicacao: 'LEP, art. 148: ajusta a FORMA da PSC e da limitação. Trocar a ESPÉCIE é vedado (STJ, AgRg no AREsp 2.783.936/SP, Info 841). A Súmula 643 exige o trânsito em julgado, e o rol do art. 43 é taxativo.',
    fonte: 'LEP, art. 148; STJ, Súmula 643; Info 841' },
  { id: 'm5-16', modulo: 'm5', tema: 'Características', tipo: 'vf', nivel: 1,
    enunciado: 'O juiz pode fixar a prestação de serviços à comunidade como condição especial do regime aberto.',
    correta: false,
    explicacao: 'Falso. Súmula 493 do STJ: é inadmissível fixar pena substitutiva como condição especial ao regime aberto, por causa da autonomia das restritivas.',
    fonte: 'STJ, Súmula 493' },
  { id: 'm5-17', modulo: 'm5', tema: 'Conversão', tipo: 'vf', nivel: 2,
    enunciado: 'Sobrevindo condenação a pena privativa de liberdade por outro crime, o juiz da execução pode deixar de converter a restritiva se for possível ao condenado cumprir a pena substitutiva anterior.',
    correta: true,
    explicacao: 'Verdadeiro. É a conversão facultativa do art. 44, § 5º. Não confundir com o § 4º (descumprimento injustificado), em que a conversão é obrigatória.',
    fonte: 'CP, art. 44, §§ 4º e 5º' },
  { id: 'm5-18', modulo: 'm5', tema: 'Cabimento', tipo: 'classificar', nivel: 2,
    enunciado: 'Cabe ou não a substituição por restritiva de direitos? Considere o réu primário e as circunstâncias judiciais favoráveis.',
    categorias: ['Cabe substituição', 'Não cabe substituição'],
    itens: [
      { texto: 'Furto simples, pena de 4 anos.', cat: 0 },
      { texto: 'Crime culposo, fora das hipóteses de embriaguez do CTB, com pena de 5 anos.', cat: 0 },
      { texto: 'Lesão corporal culposa grave na direção sob efeito de álcool (CTB, art. 303, § 2º), pena de 2 anos.', cat: 1 },
      { texto: 'Ameaça contra a companheira no ambiente doméstico, pena de 2 meses.', cat: 1 },
      { texto: 'Crime ambiental doloso sem violência, pena de exatamente 4 anos.', cat: 1 },
      { texto: 'Tráfico privilegiado, pena de 1 ano e 8 meses, sem vetores negativos.', cat: 0 }
    ],
    explicacao: 'Furto com 4 anos: cabe (até 4, inclusive). Culposo: qualquer pena. CTB, art. 303, § 2º: vedado pelo art. 312-B. Ameaça doméstica: Súmula 588 (e art. 41 da Lei 11.340/06 afasta a Lei 9.099). Ambiental: exige pena inferior a 4 anos. Tráfico privilegiado sem vetores negativos: substituição impositiva (SV 59).',
    fonte: 'CP, art. 44; CTB, art. 312-B; Lei 9.605/98, art. 7º; Súmula 588 STJ; SV 59' },
  { id: 'm5-19', modulo: 'm5', tema: 'Classificações', tipo: 'classificar', nivel: 1,
    enunciado: 'Classifique cada pena restritiva quanto ao conteúdo.',
    categorias: ['Pena real', 'Pena pessoal'],
    itens: [
      { texto: 'Prestação pecuniária.', cat: 0 },
      { texto: 'Prestação de serviços à comunidade.', cat: 1 },
      { texto: 'Perda de bens e valores.', cat: 0 },
      { texto: 'Proibição de frequentar determinados lugares.', cat: 1 },
      { texto: 'Limitação de fim de semana.', cat: 1 },
      { texto: 'Suspensão de habilitação para dirigir.', cat: 1 }
    ],
    explicacao: 'Reais (patrimoniais, “bolso”): prestação pecuniária e perda de bens. Pessoais (“agenda”): PSC, interdição temporária (todas as do art. 47, como frequentar lugares e suspensão da habilitação) e limitação de fim de semana.',
    fonte: 'Arquivo B, classificações; CP, arts. 43 e 47' },
  { id: 'm5-20', modulo: 'm5', tema: 'Classificações', tipo: 'classificar', nivel: 2,
    enunciado: 'Classifique cada pena quanto ao alcance: genérica (substitui em qualquer crime) ou específica (só em crimes determinados).',
    categorias: ['Genérica', 'Específica'],
    itens: [
      { texto: 'Proibição de frequentar determinados lugares (art. 47, IV).', cat: 0 },
      { texto: 'Proibição do exercício de cargo, função ou atividade pública (art. 47, I).', cat: 1 },
      { texto: 'Proibição de inscrever-se em concurso, avaliação ou exame públicos (art. 47, V).', cat: 0 },
      { texto: 'Suspensão de habilitação para dirigir veículo (art. 47, III).', cat: 1 },
      { texto: 'Prestação de serviços à comunidade.', cat: 0 },
      { texto: 'Proibição de profissão que dependa de habilitação do poder público (art. 47, II).', cat: 1 }
    ],
    explicacao: 'As interdições I, II e III são específicas (arts. 56 e 57: cargo com violação de deveres, profissão, crime culposo de trânsito). IV e V são genéricas, como as demais espécies (prestação pecuniária, perda de bens, PSC, limitação). Macete: 1-2-3 específicas, 4-5 genéricas.',
    fonte: 'CP, arts. 47, 56 e 57; arquivo B' },
  { id: 'm5-21', modulo: 'm5', tema: 'Violência doméstica', tipo: 'caso', nivel: 2,
    enunciado: 'João, primário, foi condenado por lesão corporal leve praticada em 2019 contra a companheira, no ambiente doméstico (CP, art. 129, § 9º, na redação da época), a 3 meses de detenção. A defesa pede a substituição por entrega de cestas básicas ou, alternativamente, por multa isolada, argumentando que a lesão leve é infração de menor potencial ofensivo. O pedido deve ser:',
    opcoes: [
      'Deferido: a lesão leve é de menor potencial ofensivo e a doutrina admite a substituição apesar da violência.',
      'Deferido apenas quanto à multa isolada, já que a pena não supera 6 meses (art. 60, § 2º).',
      'Deferido, pois o HC 180.353/MS admitiu a substituição em violência doméstica de menor gravidade.',
      'Indeferido: a Súmula 588 do STJ veda a substituição, a Lei Maria da Penha (art. 17) proíbe cesta básica, prestação pecuniária e multa isolada, e o art. 41 afasta a Lei 9.099/95.'
    ],
    correta: 3,
    explicacao: 'O argumento do menor potencial ofensivo (A) não vale na violência doméstica, porque o art. 41 da Lei 11.340/06 afasta a Lei 9.099/95. A multa isolada (B) é vedada pelo art. 17. O HC 180.353/MS (C), de 2010, está superado pela Súmula 588 (2017).',
    fonte: 'STJ, Súmula 588; Lei 11.340/06, arts. 17 e 41' },
  { id: 'm5-22', modulo: 'm5', tema: 'Reincidência', tipo: 'caso', nivel: 3,
    enunciado: 'Carla foi condenada por estelionato a 2 anos de reclusão. É reincidente por uma condenação anterior por furto. Não tem maus antecedentes e as circunstâncias judiciais são favoráveis. O juiz negou a substituição com uma única frase: “réu reincidente não tem direito ao benefício”. A decisão:',
    opcoes: [
      'É inadequada: a reincidência não é específica, e o juiz deve avaliar, com motivação concreta, se a substituição é socialmente recomendável (art. 44, § 3º).',
      'É correta: reincidente em crime doloso nunca obtém substituição.',
      'É correta, pois a pena de 2 anos só admite sursis.',
      'É inadequada, porque a substituição é obrigatória até para o reincidente específico, por ser direito público subjetivo.'
    ],
    correta: 0,
    explicacao: 'Estelionato e furto são crimes diferentes: reincidência não específica, que admite a exceção do § 3º. A negativa exige dados concretos. O STJ (AgRg no AREsp 3.087.441/SP, 2026) admite negar quando a reincidência se soma a maus antecedentes ou circunstâncias negativas, o que não é o caso. Para o reincidente específico (D), não há exceção.',
    fonte: 'CP, art. 44, II, III e § 3º; STJ, AgRg no AREsp 3.087.441/SP' },
  { id: 'm5-23', modulo: 'm5', tema: 'Crimes de trânsito', tipo: 'caso', nivel: 3,

          var on = fracTxt(f) === fracTxt(st.frac);
          var isSug = sug && fracTxt(f) === fracTxt(sug);
          return '<button type="button" class="chip' + (on ? " on" : "") + (isSug ? " sug" : "") + '" data-frac="' + f[0] + '/' + f[1] + '" aria-pressed="' + on + '"' + (isSug ? ' aria-describedby="' + uid + 's"' : "") + '>' + fracRot(f) + '</button>';
        }).join("") + (sug ? '<span id="' + uid + 's" class="cc-mult cc-leg">ponto amarelo = sugerida</span>' : "");
        var ins = el.querySelectorAll(".cc-outra input");
        ins[0].value = st.frac[0];
        ins[1].value = st.frac[1];
        statusFrac();
      }

      function statusFrac() {
        var T = TIPOS[st.tipo];
        if (!T.exasp) return;
        $(".cc-outra .cc-mult").textContent = "pena-base " + multTxt(st.frac);
        el.querySelectorAll(".cc-fracs .chip").forEach(function (c) {
          var p = c.getAttribute("data-frac").split("/");
          var on = fracTxt([+p[0], +p[1]]) === fracTxt(st.frac);
          c.classList.toggle("on", on);
          c.setAttribute("aria-pressed", on);
        });
        $(".cc-fwarn").innerHTML = noIntervalo(st.tipo, st.frac) ? "" :
          '<div class="warn-box">A fração <b class="art">' + fracTxt(st.frac) + '</b> está fora do intervalo legal do ' + T.nome.toLowerCase() + ' (' + T.faixa + '). O cálculo segue só para comparação.</div>';
      }

      function rotCrime(i) {
        var nm = (st.crimes[i].nome || "").trim();
        return "Crime " + (i + 1) + (nm ? " (" + nm + ")" : "");
      }

      function renderOut() {
        var T = TIPOS[st.tipo];
        var r = calcular(st.crimes, st.tipo, st.frac);
        var misto = r.porEsp.R > 0 && r.porEsp.D > 0;

        el.querySelectorAll(".cc-row").forEach(function (row, i) {
          var isBase = T.exasp && i === r.baseIdx;
          row.classList.toggle("base", isBase);
          var tag = r.dias[i] === 0 ? '<span class="cc-tag zero">pena zerada</span>' : isBase ? '<span class="cc-tag">pena-base</span>' : "";
          row.querySelector(".cc-foot").innerHTML = '<span>= ' + milhar(r.dias[i]) + ' dias · ' + fmtCurto(r.dias[i]) + '</span>' + tag;
        });

        var somaTxt = misto ? fmtCurto(r.porEsp.R) + " reclusão + " + fmtCurto(r.porEsp.D) + " detenção" : fmtCurto(r.soma);
        var somaFormula = r.dias.map(fmtCurto).join(" + ");
        var h = "";
        var finalTxt, longTxt, why;
        if (!T.exasp) {
          finalTxt = fmtCurto(r.soma);
          longTxt = misto ? fmtLongo(r.porEsp.R) + " de reclusão + " + fmtLongo(r.porEsp.D) + " de detenção" : fmtLongo(r.soma);
          why = T.regra;
        } else if (r.aplica === "soma") {
          finalTxt = fmtCurto(r.soma);
          longTxt = misto ? fmtLongo(r.porEsp.R) + " de reclusão + " + fmtLongo(r.porEsp.D) + " de detenção" : fmtLongo(r.soma);
          why = "A exasperação (" + fmtCurto(r.exasp) + ") passou da soma: aplica-se a soma, pelo cúmulo material benéfico (art. 70, parágrafo único" + (st.tipo.indexOf("cont") === 0 ? ", aplicado ao continuado" : "") + ").";
        } else {
          finalTxt = fmtCurto(r.exasp);
          longTxt = fmtLongo(r.exasp) + (misto ? " de " + (st.crimes[r.baseIdx].esp === "D" ? "detenção" : "reclusão") : "");
          why = r.exasp === r.soma ? "Exasperação e soma empatam: o resultado é o mesmo." : "A exasperação (" + fmtCurto(r.exasp) + ") é menor que a soma (" + fmtCurto(r.soma) + "): aplica-se a exasperação (CP, " + T.art + ").";
        }
        h += '<div class="cc-final"><span class="eyebrow">Pena final · ' + T.nome.toLowerCase() + '</span><span class="cc-big num">' + finalTxt + '</span>' +
          '<span class="cc-long">' + longTxt + '</span><span class="cc-why">' + why + '</span></div>';

        var vExasp = T.exasp && r.aplica === "exasp";
        var cardE = T.exasp
          ? '<div class="cc-card ' + (vExasp ? "vale" : "fora") + '"><div class="cc-card-head"><span class="eyebrow">Exasperação</span><span class="cc-badge ' + (vExasp ? "vale" : "fora") + '">' + (vExasp ? "vale" : "descartada") + '</span></div>' +
            '<span class="cc-val num">' + fmtCurto(r.exasp) + '</span><small>' + fmtCurto(r.base) + (simplif(r.frac)[1] === 1 ? " " + multTxt(r.frac) : " + " + fracTxt(r.frac)) + ' (aumento de ' + fmtCurto(r.aumento) + ')</small></div>'
          : '<div class="cc-card fora"><div class="cc-card-head"><span class="eyebrow">Exasperação</span><span class="cc-badge fora">não se aplica</span></div>' +
            '<span class="cc-val nada">—</span><small>Este tipo de concurso manda somar.</small></div>';
        var cardS = '<div class="cc-card ' + (!vExasp ? "vale" : "fora") + '"><div class="cc-card-head"><span class="eyebrow">Soma (cúmulo material)</span><span class="cc-badge ' + (!vExasp ? "vale" : "fora") + '">' + (!vExasp ? "vale" : "descartada") + '</span></div>' +
          '<span class="cc-val num">' + fmtCurto(r.soma) + '</span><small>' + somaFormula + (misto ? "<br>" + somaTxt : "") + '</small></div>';
        h += '<div class="cc-cmp">' + cardE + cardS + '</div>';

        if (T.exasp) {
          var mx = Math.max(r.exasp, r.soma, 1);
          h += '<div class="cc-bars" aria-hidden="true">' +
            '<div class="cc-bar"><span>Exasperação</span><div class="cc-track"><div class="cc-fill' + (vExasp ? " vale" : "") + '" style="width:' + (100 * r.exasp / mx).toFixed(2) + '%"></div></div></div>' +
            '<div class="cc-bar"><span>Soma</span><div class="cc-track"><div class="cc-fill' + (!vExasp ? " vale" : "") + '" style="width:' + (100 * r.soma / mx).toFixed(2) + '%"></div></div></div></div>';
        }

        var p = [];
        p.push("Converter cada pena em dias: " + r.dias.map(function (d, i) {
          var c = st.crimes[i];
          return rotCrime(i) + ' <span class="m">' + (c.a || 0) + '×360 + ' + (c.m || 0) + '×30 + ' + (c.d || 0) + ' = ' + milhar(d) + ' dias</span>';
        }).join("; ") + ".");
        if (T.exasp) {
          p.push("Pena-base: " + (r.empate ? "as maiores penas são idênticas, usa-se uma delas: " : "a mais grave, ") + rotCrime(r.baseIdx) + ', <span class="m">' + milhar(r.base) + ' dias = ' + fmtCurto(r.base) + '</span>.');
          var exato = Math.abs(r.aumentoBruto - r.aumento) < 1e-9;
          var fs = simplif(r.frac);
          p.push((fs[1] === 1 ? "Aumento de " + fs[0] + "× a pena-base (pena " + multTxt(fs) + (fs[0] === 2 ? ", o triplo" : fs[0] === 1 ? ", o dobro" : "") + ")" : "Aumento de " + fracTxt(fs) + " (pena-base " + multTxt(fs) + ")") + ': <span class="m">' + milhar(r.base) + ' × ' + r.frac[0] + '/' + r.frac[1] + ' = ' + (exato ? milhar(r.aumento) : r.aumentoBruto.toFixed(2).replace(".", ",") + ' → ' + milhar(r.aumento)) + ' dias = ' + fmtCurto(r.aumento) + '</span>' + (exato ? "" : " (fração de dia desprezada)") + ".");
          p.push('Exasperação: <span class="m">' + milhar(r.base) + ' + ' + milhar(r.aumento) + ' = ' + milhar(r.exasp) + ' dias = ' + fmtCurto(r.exasp) + '</span>.');
        }
        p.push('Soma de todas as penas: <span class="m">' + r.dias.map(milhar).join(" + ") + ' = ' + milhar(r.soma) + ' dias = ' + fmtCurto(r.soma) + '</span>' + (misto ? " (" + somaTxt + ": reclusão e detenção não se fundem; executa-se primeiro a reclusão, art. 76)" : "") + ".");
        if (T.exasp) {
          p.push("Cúmulo material benéfico: " + (r.exasp > r.soma
            ? '<span class="m">' + milhar(r.exasp) + ' &gt; ' + milhar(r.soma) + '</span>, a exasperação piora a situação. <mark>Aplica-se a soma</mark>.'
            : '<span class="m">' + milhar(r.exasp) + (r.exasp === r.soma ? " = " : " &lt; ") + milhar(r.soma) + '</span>, a exasperação não passa da soma. <mark>Aplica-se a exasperação</mark>.'));
        } else {
          p.push("Sem fração de aumento: " + T.regra);
        }
        if (r.final > 40 * DIAS_ANO) p.push("A pena aplicada passa de 40 anos; o limite de 40 anos do art. 75 vale para o cumprimento, não para a pena da sentença <small class=\"comp\">complemento</small>.");

        h += '<details class="cc-passos" open><summary>Conta passo a passo</summary><ol class="cc-steps">' +
          p.map(function (x) { return "<li>" + x + "</li>"; }).join("") + '</ol></details>';
        $(".cc-out").innerHTML = h;
      }

      function tudo() { renderEx(); renderLista(); renderTipos(); renderFrac(); renderOut(); }

      function marcarVisto(k) {
        vistos[k] = true;
        if (!concluido && Object.keys(vistos).length === Object.keys(EXEMPLOS).length) {
          concluido = true;
          api.award(10, "Explorou os três exemplos da calculadora");
          api.done();
        }
      }

      function editou() {
        if (exAtual) { exAtual = null; renderEx(); }
      }

      function onClick(ev) {
        var b = ev.target.closest("button");
        if (!b || !el.contains(b) || b.disabled) return;
        var row = b.closest(".cc-row");
        var i = row ? parseInt(row.getAttribute("data-i"), 10) : -1;
        var act = b.getAttribute("data-act");
        if (b.hasAttribute("data-ex")) {
          var k = b.getAttribute("data-ex");
          carregar(k);
          tudo();
          marcarVisto(k);
          api.toast("Exemplo carregado: " + EXEMPLOS[k].rot);
          return;
        }
        if (b.hasAttribute("data-tipo")) {
          var t = b.getAttribute("data-tipo");
          if (t === st.tipo) return;
          st.tipo = t;
          var sug = sugerida(t, st.crimes.length);
          if (sug) { st.frac = sug; st.manual = false; }
          else if (TIPOS[t].exasp && !noIntervalo(t, st.frac)) { st.frac = [1, 6]; st.manual = true; }
          else st.manual = true;
          editou(); renderTipos(); renderFrac(); renderOut();
          return;
        }
        if (b.hasAttribute("data-frac")) {
          var p = b.getAttribute("data-frac").split("/");
          st.frac = [+p[0], +p[1]];
          var s2 = sugerida(st.tipo, st.crimes.length);
          st.manual = !s2 || fracTxt(s2) !== fracTxt(st.frac);
          editou(); renderFrac(); renderOut();
          return;
        }
        if (act === "sug") {
          st.frac = sugerida(st.tipo, st.crimes.length); st.manual = false;
          renderFrac(); renderOut();
        } else if (act === "add" && st.crimes.length < 10) {
          var ult = st.crimes[st.crimes.length - 1];
          st.crimes.push({ nome: "", a: ult.a, m: ult.m, d: ult.d, esp: ult.esp });
          aposMudarN();
          var novo = el.querySelectorAll(".cc-nome");
          if (novo.length) try { novo[novo.length - 1].focus({ preventScroll: false }); } catch (e) { }
        } else if (act === "rm" && st.crimes.length > 2) {
          st.crimes.splice(i, 1);
          aposMudarN();
        } else if (act === "esp") {
          st.crimes[i].esp = st.crimes[i].esp === "D" ? "R" : "D";
          b.innerHTML = "<small>pena</small>" + (st.crimes[i].esp === "D" ? "Detenção" : "Reclusão");
          b.setAttribute("aria-label", "Espécie da pena do crime " + (i + 1) + ": " + (st.crimes[i].esp === "D" ? "detenção" : "reclusão") + ". Toque para trocar.");
          editou(); renderOut();
        }
      }

      function aposMudarN() {
        var sug = sugerida(st.tipo, st.crimes.length);
        if (sug && !st.manual) st.frac = sug;
        editou(); renderLista(); renderFrac(); renderOut();
      }

      function onInput(ev) {
        var inp = ev.target;
        if (!el.contains(inp)) return;
        var row = inp.closest(".cc-row");
        if (row) {
          var i = parseInt(row.getAttribute("data-i"), 10);
          var k = inp.getAttribute("data-k");
          if (k === "nome") { st.crimes[i].nome = inp.value; editou(); renderOut(); return; }
          var v = parseInt(inp.value, 10);
          st.crimes[i][k] = isFinite(v) && v > 0 ? Math.min(v, k === "d" ? 9999 : 999) : 0;
          editou(); renderOut();
          return;
        }
        if (inp.hasAttribute("data-f")) {
          var ins = el.querySelectorAll(".cc-outra input");
          var n = parseInt(ins[0].value, 10), d = parseInt(ins[1].value, 10);
          if (n > 0 && d > 0 && n <= 99 && d <= 99) {
            st.frac = [n, d];
            var s3 = sugerida(st.tipo, st.crimes.length);
            st.manual = !s3 || fracTxt(s3) !== fracTxt(st.frac);
            editou();
            statusFrac(); renderOut();
            var sugBtn = $(".cc-sug [data-act=sug]");
            if (st.manual && s3 && !sugBtn) renderFracTextoSug();
          }
        }
      }

      function renderFracTextoSug() {
        var T = TIPOS[st.tipo], n = st.crimes.length, sug = sugerida(st.tipo, n);
        if (!sug) return;
        $(".cc-sug").innerHTML = 'Sugerida para <b>' + n + ' crimes</b>: <b class="art">' + fracTxt(sug) + '</b> (intervalo legal ' + T.faixa + '). Você pode mudar. <button type="button" class="btn ghost small" data-act="sug">Usar a sugerida</button>';
      }

      function onBlur(ev) {
        var inp = ev.target;
        if (inp.matches && inp.matches(".cc-amd input")) {
          var row = inp.closest(".cc-row");
          var i = parseInt(row.getAttribute("data-i"), 10);
          inp.value = st.crimes[i][inp.getAttribute("data-k")];
        }
      }

      el.addEventListener("click", onClick);
      el.addEventListener("input", onInput);
      el.addEventListener("focusout", onBlur);
      carregar("livro");
      tudo();
      return function () {
        el.removeEventListener("click", onClick);
        el.removeEventListener("input", onInput);
        el.removeEventListener("focusout", onBlur);
      };
    }
  };
})();

</script>

            concluido = true;
            api.award(5, "Distinguiu conduta e ato");

      function tocar() {

        for (var i = 1; i <= total; i++) {

        }

      }

      function onClick(ev) {
        var b = ev.target.closest("button");

        limpar();
        if (io) io.disconnect();
        el.removeEventListener("click", onClick);
      };
    }
  };

          var q = atual(trilha);
          if (q.indexOf("R:") === 0) return;
          trilha.push({ q: q, r: b.getAttribute("data-r") === "1" });
          if (modo === "caso" && atual(trilha).indexOf("R:") === 0) avaliar();
          render(true);
        } else if (b.hasAttribute("data-ir")) {
          trilha = trilha.slice(0, parseInt(b.getAttribute("data-ir"), 10));
          render(true);
        } else if (b.hasAttribute("data-modo")) {
          var m = b.getAttribute("data-modo");
          if (m !== modo) { modo = m; trilha = []; render(false); }
        } else if (b.hasAttribute("data-caso")) {
          casoIdx = parseInt(b.getAttribute("data-caso"), 10);
          trilha = [];
          render(false);
        } else {
          var act = b.getAttribute("data-act");
          if (act === "voltar") { trilha.pop(); render(true); }
          else if (act === "reiniciar") { trilha = []; render(true); }
          else if (act === "proximo") { casoIdx = (casoIdx + 1) % CASOS.length; trilha = []; render(true); }
        }
      }

      el.addEventListener("click", onClick);
      render(false);
      return function () { el.removeEventListener("click", onClick); };
    }
  };
})();

      meta: [["Crimes", "Três roubos com grave ameaça"], ["Vítimas", "Três motoristas diferentes"]],
      sigilo: false,
      crimes: "Três roubos",
      narrativa: [
        "Em <b>duas noites seguidas</b>, B., com <b>a mesma faca e a mesma abordagem</b>, rende motoristas parados <b>no mesmo semáforo</b> de uma avenida e exige o celular, sob ameaça. São três vítimas, em três abordagens separadas.",
        "Ficou provado um <b>plano único desde o início</b>: conseguir um número certo de aparelhos para pagar uma dívida."
      ],
      pedido: "Concurso material ou continuidade? Se continuidade, de qual tipo?",
      gab: { especie: true, tempo: true, lugar: true, modo: true, designio: true },
      just: {
        especie: "Três roubos.",
        tempo: "Duas noites seguidas.",
        lugar: "Mesmo semáforo, mesma avenida.",
        modo: "Mesma faca, mesma abordagem.",
        designio: "Plano único provado desde o início."
      },
      aceitas: ["especifica"],
      quase: { simples: "Há continuidade, mas são crimes <b>dolosos</b>, contra <b>vítimas diferentes</b>, com <b>grave ameaça</b>: o regime é o do parágrafo único." },
      stj: "Gabarito: continuidade específica (art. 71, parágrafo único).",
      notaDec: "Aumento da pena mais grave <b>até o triplo</b>, considerando culpabilidade, antecedentes, conduta social, personalidade, motivos e circunstâncias, observados o <span class=\"art\">art. 70, par. único</span> e o <span class=\"art\">art. 75</span>. Em crimes violentos, a aplicação é excepcional (Ac. 3).",
      tese: "Dolo, vítimas diferentes e grave ameaça, com os requisitos objetivos e subjetivo presentes: <mark>continuidade específica</mark>. O aumento vai até o triplo e não é automático.",
      penas: null,
      penasTexto: "Sem penas no enunciado. Limite: o resultado não pode passar da soma das penas (cúmulo material benéfico), como no 18 &gt; 17 do Ac. 3.",
      resultado: "Caso criado para fixação, sem acórdão."
    }
  ];

  PENA.widgets["m2-juiz"] = {
    titulo: "Você é o juiz",
    descricao: "Leia os autos, avalie cada requisito do art. 71, decida e compare com o que o STJ julgou.",
    mount(el, api) {
      el.classList.add("w-m2-juiz");
      const reduz = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const est = CASOS.map(() => ({ marks: {}, dec: null, julgado: false, premiado: false, acertou: false }));
      let atual = 0;
      let concluido = false;

      el.innerHTML = `
        <div class="jz-top">
          <div class="jz-tabs" role="tablist" aria-label="Casos"></div>
          <div class="jz-placar" aria-live="polite"></div>
        </div>
        <div class="jz-caso"></div>`;
      const tabsEl = el.querySelector(".jz-tabs");
      const placarEl = el.querySelector(".jz-placar");
      const casoEl = el.querySelector(".jz-caso");

      function placar() {
        const julgados = est.filter(s => s.julgado).length;
        const certos = est.filter(s => s.acertou).length;
        placarEl.innerHTML = `Julgados <b class="num">${julgados}/${CASOS.length}</b> · decisões certas <b class="num">${certos}</b>`;
      }

      function renderTabs() {
        tabsEl.innerHTML = CASOS.map((c, i) => {
          const s = est[i];
          const cls = s.julgado ? (s.acertou ? "ok" : "err") : "";
          return `<button type="button" role="tab" class="chip jz-tab ${cls} ${i === atual ? "on" : ""}" data-i="${i}" aria-selected="${i === atual}"><span class="dot" aria-hidden="true"></span>${i + 1} · ${c.curto}</button>`;
        }).join("");
        placar();
      }

      function capaHTML(c, s) {
        const meta = c.meta.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
        return `
          <div class="autos ${c.hipo ? "hipo" : ""}">
            <div class="rotulo">
              <span class="eyebrow">${c.hipo ? "Caso hipotético · para fixação" : "Autos do processo"}</span>
              ${c.sigilo ? '<span class="tag">segredo de justiça</span>' : ""}
            </div>
            <div class="numero">${c.numero}</div>
            <div class="classe">${c.classe}</div>
            <dl>${meta}<dt>Crimes</dt><dd>${c.crimes}</dd></dl>
            <div class="stamp ${s.julgado ? "" : "off"}" aria-hidden="${!s.julgado}">DECISÃO<small>${c.hipo ? "gabarito" : "STJ · 5ª Turma"}</small></div>
          </div>`;
      }

      function reqHTML(r, s) {
        const v = s.marks[r.k];
        return `
          <div class="req ${s.julgado ? "locked" : ""}" data-k="${r.k}">
            <div class="nome"><b>${r.nome}</b><span>${r.dica}</span></div>
            <div class="opts" role="group" aria-label="${r.nome}">
              <button type="button" class="btn mk sim" data-k="${r.k}" data-v="1" aria-pressed="${v === true}" ${s.julgado ? "disabled" : ""}>${IC_SIM} presente</button>
              <button type="button" class="btn mk nao" data-k="${r.k}" data-v="0" aria-pressed="${v === false}" ${s.julgado ? "disabled" : ""}>${IC_NAO} ausente</button>
            </div>
          </div>`;
      }

      function decsHTML(c, s) {
        const completo = REQS.every(r => typeof s.marks[r.k] === "boolean");
        return Object.keys(DECS).map(k => {
          const d = DECS[k];
          const esc = s.dec === k ? "escolhida" : "";
          const certa = s.julgado && c.aceitas.includes(k) ? "certa" : "";
          return `<button type="button" class="btn dec ${esc} ${certa}" data-dec="${k}" ${(!completo || s.julgado) ? "disabled" : ""}>${d.rot}<small>${d.sub}</small></button>`;
        }).join("");
      }

      function revealHTML(c, s) {
        const certosReq = REQS.filter(r => s.marks[r.k] === c.gab[r.k]).length;
        const okDec = c.aceitas.includes(s.dec);
        const faltam = REQS.filter(r => !c.gab[r.k]).map(r => r.nome.toLowerCase());
        let motivo = "";
        if (!okDec) {
          if (c.quase && c.quase[s.dec]) motivo = c.quase[s.dec];
          else if (s.dec === "material") motivo = "Todos os requisitos estavam presentes; manter o concurso material seria ignorar o art. 71.";
          else motivo = "Para haver continuidade, todos os requisitos precisam estar presentes. Faltou: <b>" + faltam.join(", ") + "</b>.";
        }
        const linhas = REQS.map(r => {
          const voce = s.marks[r.k], g = c.gab[r.k], ok = voce === g;
          return `
            <div class="cmp-row ${ok ? "ok" : "err"}">
              <span class="ic" aria-label="${ok ? "acertou" : "errou"}">${ok ? IC_SIM : IC_NAO}</span>
              <div class="linha"><b>${r.nome}</b>
                <span class="v">você: <b>${voce ? "presente" : "ausente"}</b></span>
                <span class="v">${c.hipo ? "gabarito" : "STJ"}: <b>${g ? "presente" : "ausente"}</b></span></div>
              <div class="just">${c.just[r.k]}</div>
            </div>`;
        }).join("");
        let penas = "";
        if (c.penas) {
          const max = Math.max.apply(null, c.penas.map(p => p.val));
          penas = `<div class="penas">` + c.penas.map(p => `
            <div class="pbar ${p.cls}">
              <div class="cap"><span>${p.rot}</span><span class="n num">${p.val} anos</span></div>
              <div class="track"><div class="fill" data-w="${(p.val / max * 100).toFixed(1)}"></div></div>
              <div class="conta">${p.conta}</div>
            </div>`).join("") + `</div>`;
        } else {
          penas = `<p class="muted">${c.penasTexto}</p>`;
        }
        return `
          <div class="reveal panel anim-pop" tabindex="-1">
            <div class="${okDec ? "ok-box" : "err-box"}">
              <b class="${okDec ? "ok-text" : "err-text"}">${okDec ? "Decisão certa" : "Decisão diferente"}</b>.
              Você: <b>${DECS[s.dec].rot}</b>. ${c.stj}
              ${motivo ? `<br>${motivo}` : ""}
              <br><span class="num">Placar do caso: checklist ${certosReq}/5 · decisão ${okDec ? "certa (+15 XP)" : "errada"}</span>
            </div>
            <div><h4>${c.hipo ? "Requisito por requisito (gabarito)" : "O que o STJ disse, requisito por requisito"}</h4></div>
            <div class="cmp">${linhas}</div>
            <p>${c.notaDec}</p>
            <div class="tese"><span class="eyebrow">Tese para prova</span><p>${c.tese}</p></div>
            <div><h4>Penas</h4></div>
            ${penas}
            <p class="muted">${c.resultado}</p>
            <div class="btn-row">
              ${atual < CASOS.length - 1 ? '<button type="button" class="btn primary" data-act="prox">Próximo caso</button>' : ""}
              <button type="button" class="btn" data-act="refazer">Julgar de novo</button>
            </div>
          </div>`;
      }

      function fimHTML() {
        const certos = est.filter(s => s.acertou).length;
        return `<div class="panel soft fim">
          <h4>Pauta encerrada</h4>
          <p><b class="num">${certos} de ${CASOS.length}</b> decisões certas. Regra de ouro dos três acórdãos: o STJ exige os requisitos objetivos <b>e</b> a unidade de desígnios, cumulativamente.</p>
        </div>`;
      }

      function renderCaso(animarCarimbo) {
        const c = CASOS[atual], s = est[atual];
        casoEl.innerHTML = `
          <div class="stack">
            ${capaHTML(c, s)}
            <div class="folha">
              <span class="fls">fls. ${atual + 2}</span>
              <h4>Relatório</h4>
              ${c.narrativa.map(p => `<p>${p}</p>`).join("")}
              <p class="pedido">${c.pedido}</p>
            </div>
            <div class="check">
              <h4>Checklist do juiz <span class="eyebrow">art. 71 · toque para avaliar</span></h4>
              ${REQS.map(r => reqHTML(r, s)).join("")}
            </div>
            <div class="stack">
              <h4>Sua decisão</h4>
              <p class="muted jz-hint">${s.julgado ? "Decisão registrada." : "Marque os 5 requisitos para liberar a decisão."}</p>
              <div class="decs">${decsHTML(c, s)}</div>
            </div>
            ${s.julgado ? revealHTML(c, s) : ""}
            ${concluido && s.julgado ? fimHTML() : ""}
          </div>`;
        if (s.julgado) {
          const st = casoEl.querySelector(".stamp");
          if (animarCarimbo && st && !reduz) st.classList.add("on");
          const fills = casoEl.querySelectorAll(".pbar .fill");
          const setW = () => fills.forEach(f => { f.style.width = f.dataset.w + "%"; });
          if (reduz) setW(); else requestAnimationFrame(() => requestAnimationFrame(setW));
        }
      }

      function atualizaMarks() {
        const s = est[atual];
        casoEl.querySelectorAll(".mk").forEach(b => {
          const v = s.marks[b.dataset.k];
          b.setAttribute("aria-pressed", String(b.dataset.v === "1" ? v === true : v === false));
        });
        const completo = REQS.every(r => typeof s.marks[r.k] === "boolean");
        casoEl.querySelectorAll(".dec").forEach(b => { b.disabled = !completo; });
        const faltam = REQS.filter(r => typeof s.marks[r.k] !== "boolean").length;
        const hint = casoEl.querySelector(".jz-hint");
        if (hint) hint.textContent = completo ? "Agora decida." : `Faltam ${faltam} requisito${faltam > 1 ? "s" : ""} para liberar a decisão.`;
      }

      function decidir(k) {
        const c = CASOS[atual], s = est[atual];
        s.dec = k;
        s.julgado = true;
        s.acertou = c.aceitas.includes(k);
        if (s.acertou && !s.premiado) {
          s.premiado = true;
          api.award(15, "Decisão correta: " + c.numero);
        }
        if (!s.acertou && api.toast) api.toast("Veja onde o raciocínio divergiu.");
        if (!concluido && est.every(x => x.julgado)) {
          concluido = true;
          api.done();
        }
        renderTabs();
        renderCaso(true);
        const rv = casoEl.querySelector(".reveal");
        if (rv && rv.scrollIntoView) rv.scrollIntoView({ behavior: reduz ? "auto" : "smooth", block: "nearest" });
      }

      function onClick(ev) {
        const t = ev.target.closest("button");
        if (!t || !el.contains(t)) return;
        if (t.classList.contains("jz-tab")) {
          atual = +t.dataset.i; renderTabs(); renderCaso(false); return;
        }
        const s = est[atual];
        if (t.classList.contains("mk")) {
          if (s.julgado) return;
          s.marks[t.dataset.k] = t.dataset.v === "1";
          atualizaMarks(); return;
        }
        if (t.classList.contains("dec")) {
          if (s.julgado || t.disabled) return;
          decidir(t.dataset.dec); return;
        }
        if (t.dataset.act === "prox") {
          atual = Math.min(CASOS.length - 1, atual + 1); renderTabs(); renderCaso(false);
          const top = el.querySelector(".autos");
          if (top && top.scrollIntoView) top.scrollIntoView({ behavior: reduz ? "auto" : "smooth", block: "nearest" });
          return;
        }
        if (t.dataset.act === "refazer") {
          s.marks = {}; s.dec = null; s.julgado = false; s.acertou = false;
          renderTabs(); renderCaso(false); return;
        }
      }
      el.addEventListener("click", onClick);

      renderTabs();
      renderCaso(false);
      return () => { el.removeEventListener("click", onClick); };
    }
  };
})();

</script>
<script>/* widgets/m3-escada.js */

(function () {
  /* Convenção de contagem: 1 ano = 12 meses; 1 mês = 30 dias (ano de 360 dias).
     Cada operação despreza a fração de dia (arredonda para baixo), como no art. 11 do CP.
     Com essa convenção, 6a 8m -> -1/6 -> +2/3 -> +1/5 fecha exatamente em 11a 1m 9d (3.999 dias). */
  const DA = 360, DM = 30;
  const dias = (a, m, d) => a * DA + m * DM + (d || 0);
  function fmt(t) {
    const a = Math.floor(t / DA), m = Math.floor((t % DA) / DM), d = t % DM;
    const p = [];
    if (a) p.push(a + "a");
    if (m) p.push(m + "m");
    if (d) p.push(d + "d");
    return p.length ? p.join(" ") : "0d";
  }
  const milhar = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  const dec = x => (Math.round(x * 100) / 100).toString().replace(".", ",");

  function calcular() {
    const base = dias(6, 8, 0);
    const red = Math.floor(base / 6), f2 = base - red;
    const inc3x = f2 * 2 / 3, inc3 = Math.floor(inc3x), f3 = f2 + inc3;
    const inc4x = f3 / 5, inc4 = Math.floor(inc4x), f4 = f3 + inc4;
    return { base, red, f2, inc3x, inc3, f3, inc4x, inc4, f4, exato: Math.round(base * 5 / 3) };
  }
  const C = calcular();

  const COMP = '<small class="comp">complemento</small>';
  const FASES = [
    {
      fase: "1ª fase", nome: "Pena-base", r1: "1ª fase", r2: "base", art: "art. 59", frac: null, v: C.base,
      eq: `6a 8m = 6 × 360 + 8 × 30 = <b>${milhar(C.base)} dias</b>`,
      txt: "Pena-base acima do mínimo. <b>Circunstâncias</b> gravíssimas: roubo em transporte coletivo (van) <b>lotado</b>, arma apontada para a cabeça, ameaças constantes, ousadia. Só quanto à vítima M. de J. dos S., também as <b>consequências</b>: trauma psicológico duradouro.",
      nota: `<b>Reconstrução:</b> a pena-base de 6 anos e 8 meses <b>não consta do acórdão</b>. É o valor que, com as frações descritas, chega exatamente aos 11a 1m 9d da sentença. ${COMP}`
    },
    {
      fase: "2ª fase", nome: "Atenuante", r1: "2ª fase", r2: "atenuante", art: "confissão espontânea", frac: "−1/6", v: C.f2,
      eq: `${milhar(C.base)} ÷ 6 = ${milhar(C.red)} dias (${fmt(C.red)})<br>${milhar(C.base)} − ${milhar(C.red)} = <b>${milhar(C.f2)} dias = ${fmt(C.f2)}</b>`,
      txt: "Só a atenuante da <b>confissão espontânea</b> foi reconhecida: redução de 1/6. O juiz deixou de reconhecer a <b>reincidência</b> (“lamentavelmente”, diz o TJRJ), e o erro “se eterniza”: o recurso era exclusivo da defesa, vedada a <em>reformatio in pejus</em>.",
      nota: ""
    },
    {

        svg.innerHTML = s;

      function renderTexto() {
        const f = FASES[nivel - 1];

      function ir(n, animar) {

      function onClick(ev) {
        const b = ev.target.closest("button");
        if (!b || !el.contains(b)) return;
        if (b.dataset.act === "prox") ir(nivel + 1, true);
        else if (b.dataset.act === "tudo") ir(FASES.length, false);

        else if (b.dataset.q) {

            const m = { "1/6": "1/6 foi a redução da confissão, na 2ª fase.", "1/3": "1/3 para três crimes é ilegal (HC 284.619/RS).", "2/3": "2/3 é a majorante da arma de fogo, na 3ª fase." };
            fb.innerHTML = '<span class="err-text">Não.</span> ' + m[b.dataset.q];
          }
        }
      }
      el.addEventListener("click", onClick);
      ir(1, false);
      return () => { el.removeEventListener("click", onClick); };
    }
  };
})();

(function () {

  const NS_ID = () => "m4u" + Math.random().toString(36).slice(2, 8);

  function nf(x) {
    const r = Math.round(x * 100) / 100;
    return String(r).replace(".", ",");
  }
  const anos = x => nf(x) + (Math.abs(x) === 1 ? " ano" : " anos");
  function num(v) {
    const x = parseFloat(String(v).replace(",", "."));
    return isFinite(x) && x >= 0 ? x : NaN;
  }
  /* Datas em UTC. Término = início + N anos − 1 dia (o dia do começo se inclui no cômputo). */
  function parseData(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null;
  }
  function addAnos(d, a) {
    const meses = Math.round(a * 12);
    const r = new Date(d.getTime());
    const dia = r.getUTCDate();
    r.setUTCDate(1);
    r.setUTCMonth(r.getUTCMonth() + meses);
    const ult = new Date(Date.UTC(r.getUTCFullYear(), r.getUTCMonth() + 1, 0)).getUTCDate();
    r.setUTCDate(Math.min(dia, ult));
    return r;
  }
  const menos1 = d => new Date(d.getTime() - 86400000);

  /* Núcleo do § 2º (sistema de Nucci). */
  function simular(p) {
    const L = p.limite, T = p.total, N = p.nova, U0 = Math.min(T, L);
    const C = Math.min(p.cumprido, U0);
    const r = { L, T, N, U0, C, totalBenef: T + N, tipo: p.tipo };
    if (p.tipo === "anterior") {
      r.marco = 0;                      // limite continua contado do início
      r.U1 = Math.min(T + N, L);
      r.unifica = T + N > L;
      r.fimAnos = r.U1;
      r.efetivo = r.U1;
      r.semMudanca = r.U1 === U0;
    } else {
      r.R = U0 - C;                     // restante da pena unificada; tempo cumprido desprezado
      r.S = r.R + N;
      r.U1 = Math.min(r.S, L);
      r.unifica = r.S > L;
      r.marco = C;
      r.fimAnos = C + r.U1;
      r.efetivo = C + r.U1;
    }
    return r;
  }

  const EX = {
    nucci1: { total: 300, inicio: "1960-03-10", cumprido: 10, nova: 20, tipo: "anterior", limite: 30 },

      const segLimite = grupo => `
        <div class="seg" role="group" aria-label="Limite do art. 75" data-grupo="${grupo}">
          <button type="button" class="chip" data-lim="40" data-g="${grupo}">Fato a partir de 23/01/2020 <span class="n">40 anos</span></button>
          <button type="button" class="chip" data-lim="30" data-g="${grupo}">Fato antes de 23/01/2020 <span class="n">30 anos</span></button>
        </div>
        <p class="muted nota-xs">Lei 13.964/2019 elevou o limite de 30 para 40 anos. Vigência em 23/01/2020 e irretroatividade (lei mais grave) ${COMP}</p>`;

      el.innerHTML = `
        <div class="un-tabs" role="tablist">
          <button type="button" class="chip on" role="tab" data-aba="a" aria-selected="true">Condenação x cumprimento</button>
          <button type="button" class="chip" role="tab" data-aba="b" aria-selected="false">Nova condenação na execução (§ 2º)</button>
        </div>

        <section class="aba-a stack">
          <p>Pode-se ser <b>condenado</b> a qualquer total. O que o <span class="art">art. 75</span> limita é o <b>cumprimento</b>: acima do teto, as penas são <b>unificadas</b> (<span class="art">§ 1º</span>), pelo juízo da execução (<span class="art">art. 66, III, “a”, LEP</span>).</p>
          ${segLimite("a")}
          <div class="presets"><span class="eyebrow">Exemplos</span>
            <button type="button" class="chip" data-pa="nucci">Nucci: 300 anos</button>
            <button type="button" class="chip" data-pa="varias">Várias penas (hipotético)</button>
            <button type="button" class="chip" data-pa="abaixo">Abaixo do teto (hipotético)</button>
          </div>
          <div>
            <label class="lbl">Penas privativas de liberdade (anos)</label>
            <div class="lista"></div>
            <div class="btn-row mt"><button type="button" class="btn" data-act="add">+ Adicionar pena</button></div>
          </div>
          <div class="barra" aria-hidden="true">
            <div class="track"><div class="cump"></div><div class="exc"></div></div>
            <div class="lim"><span></span></div>
            <div class="esc"><span>0</span><span class="esc-max"></span></div>
          </div>
          <div class="leg"><span><i class="c1"></i>cumprimento possível</span><span><i class="c2"></i>condenação acima do teto (não se cumpre)</span></div>
          <div class="nums nums-a" aria-live="polite"></div>
          <div class="msg-a"></div>
        </section>

        <section class="aba-b stack hide">
          <p>Sobrevindo condenação por <b>fato posterior ao início do cumprimento</b>, faz-se nova unificação, <b>desprezando-se</b> o tempo já cumprido (<span class="art">art. 75, § 2º</span>). O critério é a <b>data do fato</b>, não a da condenação.</p>
          <div class="presets"><span class="eyebrow">Exemplos de Nucci</span>
            <button type="button" class="chip" data-pb="nucci1">1 · fato anterior (300 + 20)</button>
            <button type="button" class="chip" data-pb="nucci2">2 · crime no presídio (300 + 25)</button>
          </div>
          ${segLimite("b")}
          <div class="campos">
            <div><label class="lbl" for="${pid}-t">Pena total já imposta (anos)</label><input class="field" id="${pid}-t" data-f="total" type="number" inputmode="decimal" min="0" step="1"></div>
            <div><label class="lbl" for="${pid}-i">Início do cumprimento</label><input class="field" id="${pid}-i" data-f="inicio" type="date"></div>
            <div><label class="lbl" for="${pid}-c">Anos cumpridos ao vir a nova condenação</label><input class="field" id="${pid}-c" data-f="cumprido" type="number" inputmode="decimal" min="0" step="1"></div>
            <div><label class="lbl" for="${pid}-n">Nova pena (anos)</label><input class="field" id="${pid}-n" data-f="nova" type="number" inputmode="decimal" min="0" step="1"></div>
          </div>
          <div>
            <label class="lbl">Data do fato novo</label>
            <div class="seg" role="group" aria-label="Data do fato novo">
              <button type="button" class="chip" data-tipo="anterior">Anterior ao início do cumprimento</button>
              <button type="button" class="chip" data-tipo="posterior">Posterior ao início do cumprimento</button>
            </div>
          </div>
          <div class="erro erro-b" aria-live="polite"></div>
          <div class="tl scroll-x"><svg viewBox="0 0 640 190" role="img" aria-label="Linha do tempo da execução"></svg></div>
          <div class="leg leg-b"></div>
          <div class="nums nums-b" aria-live="polite"></div>
          <ol class="passos"></ol>
          <p class="muted nota-sm">Fora do art. 75: se houve <b>hiato</b> (cumpriu tudo, saiu e voltou a delinquir), as penas anteriores não entram no cálculo (RHC 8.657/PR). Na <b>fuga</b>, o limite conta do início do cumprimento (STF, HC 84.766/SP).</p>
        </section>`;

      const $ = s => el.querySelector(s);
      const listaEl = $(".lista");

      /* ---------- (a) ---------- */
      function renderLista() {
        listaEl.innerHTML = st.a.penas.map((v, i) => `
          <div class="linha">
            <span class="i">${i + 1}.</span>
            <input class="field" type="number" inputmode="decimal" min="0" step="0.5" value="${v}" data-pi="${i}" aria-label="Pena ${i + 1} em anos">
            <span class="u">anos</span>
            <button type="button" class="btn rm" data-rm="${i}" aria-label="Remover pena ${i + 1}" ${st.a.penas.length < 2 ? "disabled" : ""}>×</button>
          </div>`).join("");
      }
      function calcA() {
        const L = st.a.limite;
        const vals = st.a.penas.map(num);
        const invalid = vals.some(v => isNaN(v));
        const soma = vals.reduce((s, v) => s + (isNaN(v) ? 0 : v), 0);
        const cump = Math.min(soma, L), exc = Math.max(0, soma - L);
        const escala = Math.max(soma, L) || 1;
        $(".barra .cump").style.width = (cump / escala * 100) + "%";
        $(".barra .exc").style.width = (exc / escala * 100) + "%";
        const lim = $(".barra .lim");
        const pos = L / escala * 100;
        lim.style.left = pos + "%";
        lim.classList.toggle("dir", pos > 70);
        lim.querySelector("span").textContent = "teto " + L;
        $(".esc-max").textContent = anos(Math.round(escala * 100) / 100);
        $(".nums-a").innerHTML = `
          <div class="nb ac"><span class="v">${anos(soma)}</span><span class="r">condenação (soma)</span></div>
          <div class="nb mk"><span class="v">${anos(cump)}</span><span class="r">cumprimento máximo</span></div>
          <div class="nb ${exc ? "er" : ""}"><span class="v">${anos(exc)}</span><span class="r">acima do teto: não se cumpre</span></div>`;
        let msg = "";
        if (invalid) msg += `<p class="erro">Há valor inválido na lista: use números maiores ou iguais a zero. Ele foi contado como 0.</p>`;
        if (soma > L) {
          const pct = 0.25;
          const reqTot = soma * pct, reqUni = L * pct;
          msg += `<div class="warn-box"><b>Súmula 715/STF.</b> A pena unificada em ${L} anos <b>não</b> serve para os benefícios. Progressão de regime e livramento condicional são calculados sobre a <mark>pena total de ${anos(soma)}</mark>.</div>
            <p class="muted nota-sm">${COMP} Ilustração com uma fração hipotética de 25%: o requisito seria 25% de ${nf(soma)} = <b>${anos(reqTot)}</b>, e não 25% de ${L} = ${anos(reqUni)}.${reqTot >= L ? ` Como ${nf(reqTot)} ≥ ${L}, o condenado chegaria ao teto <b>sem nunca</b> alcançar esse benefício.` : ""}</p>`;
        } else {
          msg += `<div class="ok-box">A soma (${anos(soma)}) não passa do teto de ${L} anos: <b>não há unificação</b> pelo art. 75, § 1º. Cumpre-se a pena total.</div>`;
        }
        $(".msg-a").innerHTML = msg;
      }

      /* ---------- (b) ---------- */
      function preencheB() {
        el.querySelectorAll(".aba-b [data-f]").forEach(inp => { inp.value = st.b[inp.dataset.f]; });
      }
      function marcaSeg() {
        el.querySelectorAll('[data-g="a"]').forEach(b => { const on = +b.dataset.lim === st.a.limite; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
        el.querySelectorAll('[data-g="b"]').forEach(b => { const on = +b.dataset.lim === st.b.limite; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
        el.querySelectorAll("[data-tipo]").forEach(b => { const on = b.dataset.tipo === st.b.tipo; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
      }

      function calcB() {
        const p = {
          total: num(st.b.total), cumprido: num(st.b.cumprido), nova: num(st.b.nova),
          tipo: st.b.tipo, limite: st.b.limite
        };
        const ini = parseData(st.b.inicio);
        const errEl = $(".erro-b");
        const errs = [];
        if (isNaN(p.total) || isNaN(p.cumprido) || isNaN(p.nova)) errs.push("Preencha as penas com números maiores ou iguais a zero.");
        if (!ini) errs.push("Informe a data de início do cumprimento.");
        if (errs.length) { errEl.textContent = errs.join(" "); return; }
        const U0 = Math.min(p.total, p.limite);
        errEl.textContent = p.cumprido > U0 ? `O tempo cumprido não pode passar da pena unificada (${anos(U0)}); usei ${anos(U0)}.` : "";
        const r = simular(p);
        const L = r.L;
        const fimOrig = menos1(addAnos(ini, r.U0));
        const marcoD = addAnos(ini, r.marco);
        const fimNovo = menos1(addAnos(ini, r.fimAnos));
        const novaCond = addAnos(ini, r.C);

        /* números */
        $(".nums-b").innerHTML = `
          <div class="nb ac"><span class="v">${anos(r.totalBenef)}</span><span class="r">pena total, para benefícios (Súm. 715)</span></div>
          <div class="nb"><span class="v">${anos(r.U1)}</span><span class="r">a cumprir a partir de ${fd(marcoD)}</span></div>
          <div class="nb mk"><span class="v">${fd(fimNovo)}</span><span class="r">término previsto</span></div>
          <div class="nb ${r.efetivo > L ? "er" : ""}"><span class="v">${anos(r.efetivo)}</span><span class="r">tempo efetivo total preso</span></div>`;

        /* passo a passo */
        const ps = [];
        ps.push(`Pena unificada original: menor entre ${anos(r.T)} e o teto de ${L} = <b>${anos(r.U0)}</b>, de ${fd(ini)} a ${fd(fimOrig)}.`);
        if (r.tipo === "anterior") {
          ps.push(`Fato <b>anterior</b> ao início do cumprimento: lança-se a nova pena no montante total, ${nf(r.T)} + ${nf(r.N)} = <b>${anos(r.totalBenef)}</b>.`);
          if (r.T >= L) {
            ps.push(`Sem nova unificação: o limite continua contado do início (${fd(ini)}). <mark>“Com ${nf(r.T)} ou ${nf(r.totalBenef)} anos o tempo máximo não se altera.”</mark>`);
          } else if (r.unifica) {
            ps.push(`${COMP} A pena original estava abaixo do teto; somada a nova, passa de ${L}: unifica-se em ${L} anos, ainda contados do início.`);
          } else {
            ps.push(`${COMP} A soma (${anos(r.totalBenef)}) segue abaixo do teto: não há unificação; o término se estende pela nova pena.`);
          }
          ps.push(`Término: <b>${fd(fimNovo)}</b>. O tempo já cumprido (${anos(r.C)}) não interfere nesse cálculo.`);
        } else {
          ps.push(`Fato <b>posterior</b> ao início: despreza-se o tempo já cumprido. Da unificada de ${nf(r.U0)}, cumpriu ${nf(r.C)}: <b>restam ${anos(r.R)}</b>.`);
          ps.push(`Restante + nova pena: ${nf(r.R)} + ${nf(r.N)} = <b>${anos(r.S)}</b>.`);
          ps.push(r.unifica
            ? `${nf(r.S)} &gt; ${L}: <b>nova unificação em ${L} anos</b>, contados de ${fd(marcoD)}.`
            : `${nf(r.S)} ≤ ${L}: <b>sem nova unificação</b>; cumpre os ${anos(r.S)} a partir de ${fd(marcoD)}.`);
          ps.push(`Término: <b>${fd(fimNovo)}</b>. Tempo efetivo preso: ${nf(r.C)} + ${nf(r.U1)} = <b>${anos(r.efetivo)}</b>${r.efetivo > L ? `, acima do teto “nominal” de ${L}, e legítimo pelo § 2º. Sem ele, o preso ficaria “imune” a novas condenações` : ""}.`);
          ps.push(`Para benefícios, a nova pena entra também no montante total: ${nf(r.T)} + ${nf(r.N)} = <b>${anos(r.totalBenef)}</b>.`);
        }
        $(".passos").innerHTML = ps.map(x => `<li>${x}</li>`).join("");

        desenhaTL(r, ini, fimOrig, fimNovo, novaCond);

        if (st.b.tocado) {
          st.vistos[r.tipo] = true;
          if (!st.feito && st.vistos.anterior && st.vistos.posterior) {
            st.feito = true;
            api.award(10, "Simulou fato anterior e posterior (art. 75, § 2º)");
            api.done();
          }
        }
      }

      function desenhaTL(r, ini, fimOrig, fimNovo, novaCond) {
        const svg = $(".tl svg");
        const X0 = 120, X1 = 620, y0 = ini.getUTCFullYear();
        const finalMax = Math.max(r.U0, r.fimAnos);
        const passo = finalMax + 4 <= 60 ? 5 : 10;
        const span = Math.ceil((finalMax + 3) / passo) * passo;
        const x = a => X0 + (Math.min(a, span) / span) * (X1 - X0);
        const s = [];
        s.push(`<defs><pattern id="${pid}-h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch" x1="0" y1="0" x2="0" y2="7"/></pattern></defs>`);
        for (let t = 0; t <= span; t += passo) {
          s.push(`<line class="tk" x1="${x(t)}" y1="22" x2="${x(t)}" y2="150"/>`);
          s.push(`<text class="yr" x="${x(t)}" y="168" text-anchor="middle">${y0 + t}</text>`);
        }
        s.push(`<line class="ax" x1="${X0}" y1="150" x2="${X1}" y2="150"/>`);
        const bar = (cls, a, b, y, h, extra) => b > a ? `<rect class="${cls}" x="${x(a)}" y="${y}" width="${Math.max(0, x(b) - x(a))}" height="${h}" rx="3" ${extra || ""}/>` : "";
        const lbl = (cls, a, b, y, t) => (x(b) - x(a)) > t.length * 7.5 + 8 ? `<text class="${cls}" x="${(x(a) + x(b)) / 2}" y="${y}" text-anchor="middle">${t}</text>` : "";

        /* linha 1: unificação original */
        s.push(`<text class="rt" x="8" y="56">Unificação</text><text class="rt" x="8" y="70">original</text>`);
        if (r.tipo === "posterior") {
          s.push(bar("b-cump", 0, r.C, 44, 30));
          s.push(lbl("bt", 0, r.C, 64, nf(r.C) + " cumpridos"));
          s.push(bar("b-rest", r.C, r.U0, 44, 30));
          s.push(lbl("bt2", r.C, r.U0, 64, "restam " + nf(r.R)));
        } else {
          s.push(bar("b-orig", 0, r.U0, 44, 30));
          s.push(lbl("bt", 0, r.U0, 64, nf(r.U0) + " anos"));
        }
        /* linha 2: após a nova condenação */
        s.push(`<text class="rt" x="8" y="108">${r.tipo === "posterior" ? "Nova" : "Total + nova"}</text><text class="rt" x="8" y="122">${r.tipo === "posterior" ? "unificação" : "(mesmo início)"}</text>`);
        const iniB = r.tipo === "posterior" ? r.C : 0;
        const bruto = r.tipo === "posterior" ? r.S : r.T + r.N;
        s.push(bar("b-nova", iniB, iniB + r.U1, 96, 30));
        s.push(lbl("bt", iniB, iniB + r.U1, 116, r.tipo === "posterior" ? `${nf(r.R)} + ${nf(r.N)} = ${nf(r.S)}${r.unifica ? " → " + nf(r.U1) : ""}` : (r.unifica ? `${nf(bruto)} → ${nf(r.U1)}` : nf(r.U1) + " anos")));
        if (bruto > r.U1) {
          const a = iniB + r.U1, b = iniB + bruto;
          s.push(bar("b-exc", a, b, 96, 30, `fill="url(#${pid}-h)"`));
          const corta = b > span;
          const txt = `+${nf(bruto - r.U1)}${corta ? " →" : ""}`;
          s.push(lbl("bt3", a, b, 91, txt) || `<text class="bt3" x="${Math.min(x(b), X1)}" y="91" text-anchor="end">${txt}</text>`);
        }
        /* marcos */
        s.push(`<line class="mkl" x1="${x(0)}" y1="22" x2="${x(0)}" y2="150"/><text class="mkt" x="${x(0) + 4}" y="16">início ${fd(ini)}</text>`);
        if (r.tipo === "posterior" && r.C > 0) {
          const xc = x(r.C), anc = xc > X1 - 150 ? "end" : "start";
          s.push(`<line class="mkl" x1="${xc}" y1="30" x2="${xc}" y2="150"/><text class="mkt" x="${xc + (anc === "end" ? -4 : 4)}" y="38" text-anchor="${anc}">nova condenação ${novaCond.getUTCFullYear()}</text>`);
        }
        const xf = x(r.fimAnos);
        s.push(`<circle class="fim" cx="${xf}" cy="150" r="6"/>`);
        s.push(`<text class="mkt" x="${Math.min(Math.max(xf, X0 + 40), X1 - 40)}" y="184" text-anchor="middle">sai em ${fd(fimNovo)}</text>`);
        svg.innerHTML = s.join("");

        $(".leg-b").innerHTML = (r.tipo === "posterior"
          ? '<span><i class="c3"></i>cumprido (desprezado na nova conta)</span><span><i class="c4"></i>restante da unificada</span>'
          : "") +
          '<span><i class="c1"></i>pena a cumprir (unificada)</span><span><i class="c2"></i>acima do teto: não se cumpre</span>';
      }

      /* ---------- eventos ---------- */
      function setAba(a) {
        st.aba = a;
        el.querySelectorAll("[data-aba]").forEach(b => { const on = b.dataset.aba === a; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
        $(".aba-a").classList.toggle("hide", a !== "a");
        $(".aba-b").classList.toggle("hide", a !== "b");
      }

      function onClick(ev) {
        const b = ev.target.closest("button");
        if (!b || !el.contains(b)) return;
        const d = b.dataset;
        if (d.aba) { setAba(d.aba); return; }
        if (d.lim) {
          if (d.g === "a") { st.a.limite = +d.lim; marcaSeg(); calcA(); }
          else { st.b.limite = +d.lim; st.b.tocado = true; marcaSeg(); calcB(); }
          return;
        }
        if (d.act === "add") { st.a.penas.push(10); renderLista(); calcA(); const ins = listaEl.querySelectorAll("input"); ins[ins.length - 1].focus(); return; }
        if (d.rm !== undefined) { st.a.penas.splice(+d.rm, 1); renderLista(); calcA(); return; }
        if (d.pa) {
          st.a.penas = d.pa === "nucci" ? [300] : d.pa === "varias" ? [18, 12, 9, 6] : [22, 10];
          renderLista(); calcA(); return;
        }
        if (d.pb) {
          st.b = Object.assign({}, EX[d.pb], { tocado: true });
          preencheB(); marcaSeg(); calcB();
          if (api.toast) api.toast("Exemplo de Nucci carregado com o limite antigo de 30 anos.");
          return;
        }
        if (d.tipo) { st.b.tipo = d.tipo; st.b.tocado = true; marcaSeg(); calcB(); return; }
      }
      function onInput(ev) {
        const t = ev.target;
        if (t.dataset.pi !== undefined) { st.a.penas[+t.dataset.pi] = t.value; calcA(); return; }
        if (t.dataset.f) { st.b[t.dataset.f] = t.value; st.b.tocado = true; calcB(); }
      }
      el.addEventListener("click", onClick);
      el.addEventListener("input", onInput);

      renderLista(); preencheB(); marcaSeg(); calcA(); calcB();
      return () => { el.removeEventListener("click", onClick); el.removeEventListener("input", onInput); };
    }
  };
})();

</script>
<script>/* widgets/m5-especies.js */
window.PENA = window.PENA || { modules: [], questions: [], widgets: {}, css: [] };
(function () {
  var ID = "m5-especies";
  var P = ".w-" + ID;

  PENA.css.push(`
${P} { container-type: inline-size; display: flex; flex-direction: column; gap: 1.2rem; }
${P} .btn.small { min-height: 44px; }
${P} .es-root { display: flex; justify-content: center; }
${P} .es-root-b { font-family: var(--f-display); font-weight: 650; font-size: var(--fs-md); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: .45rem 1.1rem; text-align: center; }
${P} .es-root-b .art { color: var(--accent-ink); }
${P} .es-tree { display: grid; grid-template-columns: 1fr; gap: 1rem; position: relative; }
@container (min-width: 640px) {
  ${P} .es-tree { grid-template-columns: 2fr 3fr; padding-top: 18px; }
  ${P} .es-tree::before { content: ""; position: absolute; top: 0; left: 20%; right: 30%; height: 18px; border: 2px solid var(--accent); border-bottom: 0; border-radius: 8px 8px 0 0; }
  ${P} .es-tree::after { content: ""; position: absolute; top: -14px; left: 50%; height: 14px; border-left: 2px solid var(--accent); }
}
${P} .es-grp { border: 1.5px dashed var(--line); border-radius: var(--r-lg); padding: .8rem; display: flex; flex-direction: column; gap: .6rem; }
${P} .es-grp-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .6rem; }
${P} .es-grp-h h4 { font-family: var(--f-display); font-size: var(--fs-lg); }
${P} .es-grp-h .muted { font-size: var(--fs-xs); }
${P} .es-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: .6rem; }
${P} .es-card { display: flex; flex-direction: column; align-items: flex-start; gap: .3rem; min-height: 96px; text-align: left; padding: .7rem .8rem; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
${P} .es-card:active { transform: scale(.98); }
${P} .es-card.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }

  function toDias(a, m, d) { return (a || 0) * 360 + (m || 0) * 30 + (d || 0); }
  function fmt(dias) {
    var a = Math.floor(dias / 360), r = dias - a * 360, m = Math.floor(r / 30), d = r - m * 30, out = [];

    if (a) out.push(pl(a, "ano", "anos"));
    if (m) out.push(pl(m, "mês", "meses"));
    if (d) out.push(pl(d, "dia", "dias"));
    return out.length ? out.join(", ") : "0 dia";

  // pessoal: saldo = PPL − cumprido, piso 30 dias
  function reconvPessoal(pplDias, cumpridoDias) {
    if (pplDias <= 0) return { erro: "Informe a PPL original." };
    if (cumpridoDias >= pplDias) return { quitada: true, ppl: pplDias, cumprido: cumpridoDias };
    var bruto = pplDias - cumpridoDias;
    return { ppl: pplDias, cumprido: cumpridoDias, bruto: bruto, saldo: Math.max(30, bruto), piso: bruto < 30 };
  }
  // real: saldo = PPL × (1 − pago/total), frações de dia desprezadas, piso 30 dias
  function reconvReal(pplDias, total, pago) {
    if (pplDias <= 0) return { erro: "Informe a PPL original." };
    if (!(total > 0)) return { erro: "Informe o valor total da pena." };
    if (pago < 0) return { erro: "O valor pago não pode ser negativo." };
    if (pago >= total) return { quitada: true, ppl: pplDias };
    var frac = pago / total;
    var bruto = Math.floor(pplDias * (1 - frac) + 1e-9);
    return { ppl: pplDias, frac: frac, bruto: bruto, saldo: Math.max(30, bruto), piso: bruto < 30 };
  }
