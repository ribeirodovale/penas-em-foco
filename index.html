            n.ops.map(function (o, i) { return '<button class="btn fx-op" data-act="op" data-i="' + i + '"><span class="k">' + String.fromCharCode(65 + i) + "</span>" + o.r + "</button>"; }).join("") + "</div></div>";
        }
        return '<div class="fx-q anim-pop"><div class="eyebrow">Passo ' + (trail.length + 1) + ' · <span class="art">' + n.art + '</span></div><div class="fx-qh">' + ICON.losango + "<h4>" + n.pergunta + "</h4></div>" +
          (n.ajuda ? '<p class="fx-ajuda">' + n.ajuda + "</p>" : "") + '<div class="fx-ops">' +
          n.ops.map(function (o, i) { return '<button class="btn fx-op" data-act="op" data-i="' + i + '"><span class="k">' + String.fromCharCode(65 + i) + "</span>" + o.r + "</button>"; }).join("") + "</div></div>";
      }

      function resultadoHTML(st) {
        var r = R[st.cur];
        var h = '<div class="fx-res ' + (r.cabe ? "ok ok-box" : "no err-box") + ' anim-pop"><div class="eyebrow">Resultado</div><div class="fx-res-h">' +
          (r.cabe ? ICON.ok + "Cabe a substituição" : ICON.no + "Não cabe a substituição") + "</div><p>" + r.html + "</p>";
        var notas = (r.extra || []).slice();
        if (r.cabe) {
          var ate1 = st.faixa === "ate1";
          h += '<div class="fx-qtd"><div class="eyebrow">Quantas e quais penas · <span class="art">art. 44, § 2º</span></div><div class="fx-qtd-ops">' +
            (ate1 ? '<span class="fx-qtd-op">multa</span><span class="fx-ou">ou</span><span class="fx-qtd-op">1 PRD</span>'
                  : '<span class="fx-qtd-op">1 PRD + multa</span><span class="fx-ou">ou</span><span class="fx-qtd-op">2 PRDs</span>') +
            '</div><p class="muted fx-qtd-nota">' + (ate1 ? "Pena de até 1 ano (doloso ou culposo, reclusão ou detenção: basta o critério quantitativo)." : "Pena superior a 1 ano.") + "</p></div>";
          if (ate1) notas.push("PSC só se a pena for <b>superior a 6 meses</b> (<span class=\"art\">art. 46</span>).");
          else notas.push("PSC, interdição e limitação duram o mesmo que a PPL (<span class=\"art\">art. 55</span>); como a pena passa de 1 ano, o condenado pode cumprir em menor tempo, nunca abaixo da metade (<span class=\"art\">art. 46, § 4º</span>).");
          notas.push("Quem escolhe a espécie é o juiz, não o réu (STJ, AgRg no HC 582.302/SC).");
          if (st.flags.culposo) notas.push("Se for crime de trânsito (CTB, arts. 302 a 312), a substituição deve ser por PSC em atividades ligadas às vítimas de trânsito (<span class=\"art\">CTB, art. 312-A</span>).");
          if (st.flags.impo) notas.push("Resultado pela doutrina que admite a substituição nas infrações de menor potencial ofensivo.");
          if (st.flags.improp) notas.push("Resultado pela corrente que admite a substituição na violência imprópria; há divergência.");
          if (st.flags.reinc) notas.push("Mesmo na reincidência não específica, maus antecedentes ou circunstâncias negativas podem mostrar insuficiência; a negativa precisa de dados concretos (STJ, AgRg no AREsp 3.087.441/SP, 2026).");
        }
        if (notas.length) h += '<ul class="fx-notas">' + notas.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>";
        if (!r.cabe) h += '<p class="fx-alt">' + ALT + "</p>";
        h += "</div>";
        if (caso >= 0) {
          var c = CASOS[caso];
          h += '<div class="fx-check">';
          if (!conferido) h += '<div class="btn-row"><button class="btn primary" data-act="conferir">Conferir com o gabarito</button></div>';
          else if (conferido.ok) h += '<div class="ok-box anim-pop"><span class="ok-text">Acertou.</span> ' + c.expl + "</div>";
          else h += '<div class="err-box anim-shake"><span class="err-text">Não é esse o resultado.</span> Gabarito: <b>' + rotuloChave(c.gabarito) + "</b>. " + c.expl +
            (conferido.mesmaConclusao ? " (A conclusão \"não cabe\" está certa, mas o fundamento é outro.)" : "") + ' Volte na trilha e refaça.</div>';
          h += "</div>";
        }
        return h;
      }

      function render() {
        var st = estado(trail);
        var info = caso < 0 ? EXEMPLO : CASOS[caso];
        var chips = '<button class="chip' + (caso < 0 ? " on" : "") + '" data-act="caso" data-c="-1" aria-pressed="' + (caso < 0) + '">Exemplo</button>' +
          CASOS.map(function (c, i) {
            return '<button class="chip' + (caso === i ? " on" : "") + '" data-act="caso" data-c="' + i + '" aria-pressed="' + (caso === i) + '">' + c.rotulo +
              (acertos[i] ? ' <span class="fx-okdot" aria-label="resolvido">' + ICON.check + "</span>" : "") + "</button>";
          }).join("");
        el.innerHTML =
          '<div><div class="eyebrow fx-trail-h">Casos-teste: resolva e confira</div><div class="fx-cases">' + chips + "</div></div>" +
          '<div class="fx-case panel soft"><div class="eyebrow">' + (caso < 0 ? "Exemplo carregado" : info.rotulo + " · percorra o fluxo") + "</div><p>" + info.texto + "</p></div>" +
          '<div class="fx-grid"><nav aria-label="Trilha do caminho"><div class="eyebrow fx-trail-h">Trilha</div><ol class="fx-trail">' + trilhaHTML(st) + "</ol></nav>" +
          '<div class="fx-stage" aria-live="polite">' + (R[st.cur] ? resultadoHTML(st) : perguntaHTML(st.cur)) + "</div></div>" +
          '<div class="fx-foot"><button class="btn" data-act="voltar"' + (trail.length ? "" : " disabled") + '>Voltar um passo</button><button class="btn ghost" data-act="reiniciar">Reiniciar</button></div>';
      }

      function onClick(ev) {
        var b = ev.target.closest("[data-act]");
        if (!b || !el.contains(b)) return;
        var act = b.getAttribute("data-act");
        var st = estado(trail);
        if (act === "op") { trail.push({ id: st.cur, i: +b.getAttribute("data-i") }); conferido = null; }
        else if (act === "volta") { trail = trail.slice(0, +b.getAttribute("data-k")); conferido = null; }
        else if (act === "voltar") { trail.pop(); conferido = null; }
        else if (act === "reiniciar") { trail = []; conferido = null; }
        else if (act === "caso") { caso = +b.getAttribute("data-c"); trail = caso < 0 ? EXEMPLO.trail.slice() : []; conferido = null; }
        else if (act === "conferir" && caso >= 0) {
          var k = chave(st), g = CASOS[caso].gabarito;
          conferido = { ok: k === g, mesmaConclusao: k !== g && !R[st.cur].cabe && g.indexOf("cabe") !== 0 };
          if (conferido.ok && !acertos[caso]) {
            acertos[caso] = true;
            if (api.award) api.award(10, "Caso-teste do art. 44 resolvido");
            if (!feito && Object.keys(acertos).length === CASOS.length) { feito = true; if (api.done) api.done(); if (api.toast) api.toast("Todos os casos resolvidos."); }
          }
        } else return;
        render();
        if (act === "op" || act === "volta" || act === "voltar") {
          var stg = el.querySelector(".fx-stage");
          if (stg && stg.getBoundingClientRect().top < 0 && stg.scrollIntoView) stg.scrollIntoView({ block: "start" });
        }
      }

      el.addEventListener("click", onClick);
      render();
      return function () { el.removeEventListener("click", onClick); };
    }
  };
})();

</script>
<script>/* widgets/m5-regua.js */
window.PENA = window.PENA || { modules: [], questions: [], widgets: {}, css: [] };
(function () {
  var ID = "m5-regua";
  var P = ".w-" + ID;
  var MAX = 96; // meses (8 anos)
  var THUMB = 30; // px

  PENA.css.push(`

${P} .rg-ctl { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }

${P} .rg-ctl .sep { flex: 1 1 auto; }
${P} .rg-legend { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: .3rem 1rem; font-size: var(--fs-xs); color: var(--ink-soft); }
${P} .rg-legend b { font-family: var(--f-mono); color: var(--accent); }

${P} .rg-it.sim { border-left: 4px solid var(--ok); }
${P} .rg-it.nao { border-left: 4px solid var(--line); }
${P} .rg-it.nao .rg-it-t, ${P} .rg-it.nao .rg-it-h { color: var(--ink-soft); }

@container (max-width: 480px) { ${P} .rg-it { grid-template-columns: 1fr; } ${P} .rg-st { grid-row: auto; justify-self: start; margin-bottom: .2rem; } ${P} .rg-it-t, ${P} .rg-it-h { grid-column: 1; } }
`);

  // ---------- cálculo (puro) ----------
  function ym(m) { return Math.floor(m / 12) + "a " + (m % 12) + "m"; }
  function plural(n, s, p) { return n + " " + (n === 1 ? s : p); }
  function longo(m) {
    var a = Math.floor(m / 12), r = m % 12, out = [];
    if (a) out.push(plural(a, "ano", "anos"));
    if (r) out.push(plural(r, "mês", "meses"));
    return out.length ? out.join(" e ") : "0 mês";
  }
  // dias (mês = 30 dias) -> "Xa Ym Zd"
  function dur(dias) {
    var frac = dias % 1 !== 0;
    var d = Math.floor(dias), a = Math.floor(d / 360); d -= a * 360;
    var m = Math.floor(d / 30); d -= m * 30;
    var out = [];
    if (a) out.push(plural(a, "ano", "anos"));
    if (m) out.push(plural(m, "mês", "meses"));
    if (d) out.push(plural(d, "dia", "dias"));
    return (frac ? "cerca de " : "") + (out.length ? out.join(", ") : "0 dia");
  }
  function faixa(m) {
    if (m <= 0) return "sem pena";
    if (m <= 6) return "até 6 meses";
    if (m <= 12) return "mais de 6 meses até 1 ano";
    if (m <= 24) return "mais de 1 ano até 2 anos";
    if (m <= 48) return "mais de 2 anos até 4 anos";
    return "mais de 4 anos";
  }
  function faixaIdx(m) { return m <= 6 ? 0 : m <= 12 ? 1 : m <= 24 ? 2 : m <= 48 ? 3 : 4; }

  function analisa(m, culposo, violencia) {
    var it = [];
    var subst;
    if (culposo) {
      subst = true;
      it.push({ k: "subst", st: "sim", t: "Substituição por PRD", art: "art. 44, I",
        h: "Crime culposo: cabe com <b>qualquer pena</b>" + (violencia ? ", mesmo com violência à pessoa" : "") + ", presentes os requisitos dos incisos II e III. Exceção: <span class=\"art\">CTB, art. 312-B</span> (arts. 302, § 3º, e 303, § 2º, sob influência de álcool): vedada seja qual for a pena." +
          (m >= 60 ? " Nesta faixa está a pena do art. 302, § 3º (5 a 8 anos)." : "") });
    } else if (violencia) {
      subst = false;
      it.push({ k: "subst", st: "nao", t: "Substituição por PRD", art: "art. 44, I",
        h: "Doloso com violência ou grave ameaça à pessoa: em regra, <b>não cabe</b>, seja qual for a pena. Desvios: menor potencial ofensivo (doutrina admite, salvo violência doméstica, Súm. 588) e violência imprópria (divergência)." });
    } else if (m <= 48) {
      subst = true;
      it.push({ k: "subst", st: "sim", t: "Substituição por PRD", art: "art. 44, I",
        h: "Doloso sem violência: pena <b>não superior a 4 anos</b> (4 anos inclusive). Faltam ainda os requisitos subjetivos (incisos II e III)." });
    } else {
      subst = false;
      it.push({ k: "subst", st: "nao", t: "Substituição por PRD", art: "art. 44, I",
        h: "Doloso com pena <b>acima de 4 anos</b>: não cabe." });
    }

    if (!culposo && !violencia && m === 48) {
      it.push({ k: "amb", st: "atencao", t: "Pegadinha dos 4 anos", art: "Lei 9.605/98, art. 7º, I",
        h: "Exatamente 4 anos: no CP <b>cabe</b>; em crime ambiental, <b>não</b> (lá a pena deve ser <b>inferior</b> a 4 anos)." });
    }

    var qtd = m <= 12 ? "<b>multa OU 1 PRD</b>" : "<b>1 PRD + multa OU 2 PRDs</b>";
    it.push({ k: "qtd", st: subst ? "sim" : "nao", t: "Quantas penas substitutivas", art: "art. 44, § 2º",
      h: (subst ? "" : "Sem substituição neste cenário. Pela quantidade, seria: ") + (m <= 12 ? "pena de até 1 ano → " : "pena acima de 1 ano → ") + qtd + "." });

    var horas = m * 30;
    if (m > 6) {
      it.push({ k: "psc", st: subst ? "sim" : "nao", t: "Prestação de serviços à comunidade", art: "art. 46",
        h: (subst ? "" : "Pela quantidade caberia, mas não há substituição neste cenário. ") + "Pena superior a 6 meses: PSC possível. Carga: 1 hora de tarefa por dia de condenação, <span class=\"n\">≈ " + horas.toLocaleString("pt-BR") + " h</span> <small class=\"comp\">complemento</small> conta com mês de 30 dias." });
    } else {
      it.push({ k: "psc", st: "nao", t: "Prestação de serviços à comunidade", art: "art. 46",
        h: "Só para pena <b>superior a 6 meses</b>. Com 6 meses exatos, não cabe." });
    }

    if (m > 12) {
      it.push({ k: "menor", st: subst ? "sim" : "nao", t: "Cumprimento em menor tempo", art: "art. 46, § 4º",
        h: "Pena acima de 1 ano: o condenado <b>pode</b> cumprir em menos tempo, nunca menos que a metade: mínimo de <span class=\"n\">" + dur(m * 15) + "</span>. Faculdade do condenado; não vale para penas reais. Divergência: só PSC (Masson) ou todas as pessoais." });
    } else {
      it.push({ k: "menor", st: "nao", t: "Cumprimento em menor tempo", art: "art. 46, § 4º",
        h: "Só se a pena substituída for <b>superior a 1 ano</b>. Aqui, a PRD pessoal dura o mesmo que a PPL (art. 55)." });
    }

    if (subst) {
      it.push({ k: "dur", st: "sim", t: "Duração das penas pessoais", art: "art. 55",
        h: "PSC, interdição temporária e limitação de fim de semana têm a mesma duração da PPL: <span class=\"n\">" + longo(m) + "</span>" + (m > 12 ? ", ressalvado o art. 46, § 4º" : "") + "." });
    }

    if (m <= 6) {
      it.push({ k: "a60", st: violencia && !culposo ? "atencao" : "sim", t: "Multa vicariante do art. 60, § 2º", art: "art. 60, § 2º",
        h: "PPL de até 6 meses pode ser substituída por multa, observados os incisos II e III do art. 44. Para Estefam, é indiferente se houve violência" + (violencia && !culposo ? " (aqui seria a única via)" : "") + "; para Masson, o dispositivo foi revogado pelo art. 44, § 2º." });
    } else {
      it.push({ k: "a60", st: "nao", t: "Multa vicariante do art. 60, § 2º", art: "art. 60, § 2º",
        h: "Só para pena de até 6 meses." });
    }

    if (m <= 24) {
      it.push({ k: "lep", st: "sim", t: "Conversão na execução", art: "LEP, art. 180",
        h: "Se o juiz não substituiu na sentença, a PPL de até 2 anos pode ser convertida na execução: regime <b>aberto</b>, <b>1/4</b> cumprido (aqui, <span class=\"n\">" + dur(m * 7.5) + "</span>) e antecedentes e personalidade favoráveis." });
    } else {
      it.push({ k: "lep", st: "nao", t: "Conversão na execução", art: "LEP, art. 180",
        h: "Só para PPL <b>não superior a 2 anos</b>." });
    }

    it.push({ k: "sursis", st: m <= 24 ? "atencao" : "nao", t: "Se não couber: sursis", art: "marco de 2 anos",
      h: "No roteiro do juiz, se não couber a substituição, analisa-se o sursis ou o livramento condicional. " +
        (m <= 24 ? "Esta pena está no marco de 2 anos do sursis" : "Esta pena passa do marco de 2 anos do sursis") + " <small class=\"comp\">complemento</small> CP, art. 77." });
    return { subst: subst, itens: it };
  }

  PENA.widgets[ID] = {
    titulo: "Régua da pena: o que cabe?",
    descricao: "Arraste a régua da pena privativa de liberdade (0 a 8 anos) e veja, a cada mês, o que a lei permite: substituição, quantas penas, PSC, menor tempo, art. 60, LEP art. 180.",
    _calc: { analisa: analisa, ym: ym, longo: longo, dur: dur, faixa: faixa },
    mount: function (el, api) {
      api = api || {};
      el.classList.add("w-" + ID);
      var m = 10, culposo = false, violencia = false;
      var vistos = {}, feito = false;

      var MARCOS = [{ v: 6, l: "6m", c: "a" }, { v: 12, l: "1a", c: "b" }, { v: 24, l: "2a", c: "a" }, { v: 48, l: "4a", c: "b" }];
      function pct(v) { return (v / MAX * 100) + "%"; }

      el.innerHTML =
        '<div class="rg-sel"><div role="group" aria-label="Natureza do crime"><span class="eyebrow">Crime</span>' +
        '<button class="chip" data-act="nat" data-v="0">Doloso</button><button class="chip" data-act="nat" data-v="1">Culposo</button></div>' +
        '<div role="group" aria-label="Violência"><span class="eyebrow">Violência ou grave ameaça</span>' +
        '<button class="chip" data-act="vio" data-v="0">Sem</button><button class="chip" data-act="vio" data-v="1">Com</button></div></div>' +
        '<div class="rg-val" aria-live="polite"><span class="rg-big"></span><span class="rg-long"></span><span class="rg-faixa"></span></div>' +
        '<div class="rg-wrap"><div class="rg-flags" aria-hidden="true">' +
        MARCOS.map(function (k) { return '<div class="rg-flag ' + k.c + '" data-m="' + k.v + '" style="left:' + pct(k.v) + '"><span>' + k.l + "</span></div>"; }).join("") +
        '</div><div class="rg-ruler" aria-hidden="true"><div class="rg-fill"></div>' +
        MARCOS.map(function (k) { return '<div class="rg-marco" style="left:' + pct(k.v) + '"></div>'; }).join("") +
        '<div class="rg-needle"></div></div><div class="rg-years" aria-hidden="true">' +
        [0, 1, 2, 3, 4, 5, 6, 7, 8].map(function (a) { return '<span style="left:' + pct(a * 12) + '">' + a + "</span>"; }).join("") +
        '</div></div>' +
        '<input class="rg-range" type="range" min="0" max="' + MAX + '" step="1" aria-label="Pena privativa de liberdade, em meses">' +
        '<div class="rg-ctl"><button class="btn" data-act="step" data-v="-1" aria-label="Menos 1 mês">−1 mês</button><button class="btn" data-act="step" data-v="1" aria-label="Mais 1 mês">+1 mês</button><span class="sep"></span>' +
        MARCOS.map(function (k) { return '<button class="btn small" data-act="ir" data-v="' + k.v + '">' + longo(k.v) + "</button>"; }).join("") + "</div>" +
        '<ul class="rg-legend"><li><b>6m</b> PSC só acima (art. 46) · multa do art. 60, § 2º até aqui</li><li><b>1a</b> 1 ou 2 penas (art. 44, § 2º) · menor tempo acima (art. 46, § 4º)</li><li><b>2a</b> conversão na execução (LEP, art. 180) · sursis</li><li><b>4a</b> teto do crime doloso (art. 44, I)</li></ul>' +
        '<div class="panel soft rg-panel"><h4>O que cabe nesta pena</h4><ul class="rg-items"></ul></div>';

      var range = el.querySelector(".rg-range");
      function update() {
        range.value = m;
        el.querySelector(".rg-big").textContent = ym(m);
        el.querySelector(".rg-long").textContent = m ? longo(m) : "arraste a régua";
        el.querySelector(".rg-faixa").textContent = "Faixa: " + faixa(m) + " · " + (culposo ? "culposo" : "doloso") + ", " + (violencia ? "com" : "sem") + " violência ou grave ameaça";
        el.querySelector(".rg-fill").style.width = pct(m);
        el.querySelector(".rg-needle").style.left = pct(m);
        el.querySelectorAll(".rg-flag").forEach(function (f) { f.classList.toggle("hit", +f.getAttribute("data-m") === m); });
        el.querySelectorAll('[data-act="nat"]').forEach(function (b) { var on = (+b.getAttribute("data-v") === 1) === culposo; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
        el.querySelectorAll('[data-act="vio"]').forEach(function (b) { var on = (+b.getAttribute("data-v") === 1) === violencia; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
        var ul = el.querySelector(".rg-items");
        if (m <= 0) { ul.innerHTML = '<li class="rg-it nao"><span class="rg-st">—</span><span class="rg-it-t">Pena zero</span><span class="rg-it-h">Escolha uma pena de pelo menos 1 mês.</span></li>'; return; }
        var r = analisa(m, culposo, violencia);
        var LBL = { sim: "cabe", nao: "não", atencao: "atenção" };
        ul.innerHTML = r.itens.map(function (x) {
          return '<li class="rg-it ' + x.st + '"><span class="rg-st">' + LBL[x.st] + '</span><span class="rg-it-t">' + x.t + ' <span class="art">' + x.art + '</span></span><span class="rg-it-h">' + x.h + "</span></li>";
        }).join("");
        vistos[faixaIdx(m)] = true;
        if (!feito && Object.keys(vistos).length === 5) { feito = true; if (api.award) api.award(5, "Percorreu todas as faixas da régua"); if (api.done) api.done(); }
      }
      function set(v) { m = Math.max(0, Math.min(MAX, v)); update(); }
      function onInput() { set(+range.value); }
      function onClick(ev) {
        var b = ev.target.closest("[data-act]");
        if (!b || !el.contains(b)) return;
        var a = b.getAttribute("data-act"), v = +b.getAttribute("data-v");
        if (a === "nat") culposo = v === 1;
        else if (a === "vio") violencia = v === 1;
        else if (a === "step") { set(m + v); return; }
        else if (a === "ir") { set(v); return; }
        update();
      }
      range.addEventListener("input", onInput);
      el.addEventListener("click", onClick);
      update();
      return function () { range.removeEventListener("input", onInput); el.removeEventListener("click", onClick); };
    }
  };
})();

<script>/* widgets/m6-dias-multa.js */
window.PENA = window.PENA || { modules: [], questions: [], widgets: {}, css: [] };
(function () {

  var P = ".w-" + ID;
  var SM_REF = 1621; // salário mínimo nacional de 2026 (complemento: conferir)

  PENA.css.push(`
${P} { container-type: inline-size; display: flex; flex-direction: column; gap: 1.1rem; }
${P} .btn.small { min-height: 44px; }

${P} .dm-total { font-family: var(--f-display); font-size: var(--fs-2xl); font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
${P} .dm-total .hl { background: linear-gradient(transparent 10%, var(--mark) 10%, var(--mark) 90%, transparent 90%); color: var(--mark-ink); padding: 0 .1em; }

${P} .dm-lim .r { display: block; font-size: var(--fs-xs); color: var(--ink-soft); line-height: 1.3; }
${P} .dm-txt { font-size: var(--fs-sm); }
${P} .dm-tri .dm-txt { flex: 1 1 260px; }
${P} .dm-notes { font-size: var(--fs-sm); display: flex; flex-direction: column; gap: .4rem; }
`);

  // ---------- cálculo (puro) ----------
  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  // k = trigésimos do salário mínimo (1 a 150)
  function fracTxt(k) {
    var g = gcd(k, 30), n = k / g, d = 30 / g;
    return d === 1 ? String(n) : n + "/" + d;
  }
  function calc(dias, k, sm, triplo) {
    var valorDia = sm * k / 30;
    var base = dias * valorDia;
    var total = triplo ? base * 3 : base;
    var emSM = dias * k / 30 * (triplo ? 3 : 1);
    return { valorDia: valorDia, base: base, total: total, emSM: emSM,
      min: sm * 10 / 30, max: sm * 1800, maxTri: sm * 5400 };
  }
  var fBRL = null;
  try { fBRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }); } catch (e) {}
  function BRL(v) { return fBRL ? fBRL.format(v) : "R$ " + v.toFixed(2); }
  function nfmt(v, dec) { return v.toLocaleString("pt-BR", { maximumFractionDigits: dec == null ? 2 : dec }); }

  var FR = [1, 3, 15, 30, 60, 150]; // 1/30, 1/10, 1/2, 1, 2, 5

  PENA.widgets[ID] = {
    titulo: "Calculadora de dias-multa",
    descricao: "Escolha o número de dias-multa e o valor de cada dia; veja o total, a conta e os limites legais (art. 49), com a opção do triplo (art. 60, § 1º).",
    _calc: { calc: calc, fracTxt: fracTxt },
    mount: function (el, api) {
      api = api || {};
      el.classList.add("w-" + ID);
      var s = { dias: 60, k: 1, sm: SM_REF, tri: false };
      var mexeu = { dias: false, k: false }, feito = false;

      el.innerHTML =
        '<div class="dm-fases">' +
        '<div class="dm-fase"><div class="eyebrow">1ª fase <small class="comp">complemento</small></div><h4>Quantos dias-multa?</h4><p>De <b>10 a 360</b> (<span class="art">art. 49</span>). A quantidade segue as circunstâncias do crime e o critério trifásico (art. 68).</p></div>' +
        '<div class="dm-fase"><div class="eyebrow">2ª fase <small class="comp">complemento</small></div><h4>Quanto vale cada dia?</h4><p>De <b>1/30 a 5 salários mínimos</b> (<span class="art">art. 49, § 1º</span>). O valor segue a <b>situação econômica do réu</b> (art. 60, caput).</p></div>' +
        "</div>" +
        '<div class="dm-in">' +
        '<div class="dm-box"><div class="dm-box-h"><label class="lbl" for="' + ID + '-d">Número de dias-multa</label><span class="dm-v" data-o="dias"></span></div>' +
        '<input type="range" id="' + ID + '-d" data-f="dr" min="10" max="360" step="1" aria-label="Número de dias-multa">' +
        '<div class="dm-scale"><span>10</span><span>360</span></div>' +
        '<div class="dm-step"><button class="btn" data-act="d" data-v="-1" aria-label="Menos 1 dia-multa">−</button><input class="field" type="number" inputmode="numeric" min="10" max="360" data-f="dn" aria-label="Dias-multa (número)"><button class="btn" data-act="d" data-v="1" aria-label="Mais 1 dia-multa">+</button></div></div>' +
        '<div class="dm-box"><div class="dm-box-h"><label class="lbl" for="' + ID + '-k">Valor do dia-multa (× salário mínimo)</label><span class="dm-v" data-o="k"></span></div>' +
        '<input type="range" id="' + ID + '-k" data-f="kr" min="1" max="150" step="1" aria-label="Valor do dia-multa em trigésimos do salário mínimo">' +
        '<div class="dm-scale"><span>1/30</span><span>5</span></div>' +
        '<div class="dm-fr" role="group" aria-label="Frações comuns">' + FR.map(function (k) { return '<button class="chip" data-act="k" data-v="' + k + '">' + fracTxt(k) + "</button>"; }).join("") + "</div></div>" +
        "</div>" +
        '<div class="dm-box"><div class="dm-sm"><div><label class="lbl" for="' + ID + '-sm">Salário mínimo (R$)</label><input class="field" id="' + ID + '-sm" type="number" inputmode="decimal" min="1" step="0.01" data-f="sm"></div>' +
        '<button class="btn small" data-act="smref">Voltar ao valor de referência</button></div>' +
        '<p class="muted dm-txt">Referência pré-preenchida: R$ 1.621,00, salário mínimo nacional de 2026 <small class="comp">complemento</small> confira. Use o <b>maior salário mínimo mensal vigente ao tempo do fato</b> (<span class="art">art. 49, § 1º</span>); na execução, o valor é <b>atualizado</b> pelos índices de correção monetária (<span class="art">art. 49, § 2º</span>).</p></div>' +
        '<div class="dm-tri"><button class="btn" data-act="tri" aria-pressed="false">Aplicar o triplo</button><span class="muted dm-txt"><span class="art">art. 60, § 1º</span> <small class="comp">complemento</small> se, pela situação econômica do réu, a multa for ineficaz mesmo aplicada no máximo, pode ser aumentada <b>até</b> o triplo (aqui, o teto: × 3).</span></div>' +
        '<div class="panel dm-res" aria-live="polite"></div>' +
        '<div class="dm-lims"></div>' +
        '<div class="dm-notes"><p><b>Pagamento</b>: em regra, em <b>10 dias</b> depois do trânsito em julgado; admite parcelamento conforme as circunstâncias (<span class="art">art. 50</span>). O desconto em salário não pode atingir o sustento do condenado e da família.</p>' +
        '<p><b>Não paga</b>: é executada no juízo da execução penal como dívida de valor, sem perder a natureza de sanção criminal, e <b>não se converte em prisão</b> (<span class="art">art. 51</span>).</p>' +
        '<p class="muted">Exemplo hipotético pré-preenchido. Valores arredondados ao centavo.</p></div>';

      var $ = function (q) { return el.querySelector(q); };
      function pos(v, max) { var mn = s.sm * 10 / 30; return Math.max(0, Math.min(100, Math.log(v / mn) / Math.log(max / mn) * 100)); }

      function update(skip) {
        var r = calc(s.dias, s.k, s.sm, s.tri);
        if (skip !== "dr") $('[data-f="dr"]').value = s.dias;
        if (skip !== "dn") $('[data-f="dn"]').value = s.dias;
        if (skip !== "kr") $('[data-f="kr"]').value = s.k;
        if (skip !== "sm") $('[data-f="sm"]').value = s.sm;
        $('[data-o="dias"]').textContent = s.dias;
        $('[data-o="k"]').textContent = fracTxt(s.k) + " SM";
        el.querySelectorAll('[data-act="k"]').forEach(function (b) { var on = +b.getAttribute("data-v") === s.k; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
        $('[data-act="tri"]').setAttribute("aria-pressed", s.tri);
        $('[data-act="tri"]').textContent = s.tri ? "Triplo aplicado (toque para tirar)" : "Aplicar o triplo";

        var maxG = s.tri ? r.maxTri : r.max;
        var h = '<div class="eyebrow">Multa resultante' + (s.tri ? " (com o triplo)" : "") + '</div><p class="dm-total"><span class="hl">' + BRL(r.total) + '</span></p><p class="dm-sm-eq">= ' + nfmt(r.emSM, 3) + " salários mínimos</p>" +
          '<ul class="dm-conta"><li>valor do dia = ' + fracTxt(s.k) + " × " + BRL(s.sm) + " = <b>" + BRL(r.valorDia) + "</b></li>" +
          "<li>" + s.dias + " dias × " + BRL(r.valorDia) + " = <b>" + BRL(r.base) + "</b></li>" +
          (s.tri ? "<li>" + BRL(r.base) + " × 3 = <b>" + BRL(r.total) + "</b> (art. 60, § 1º)</li>" : "") + "</ul>";
        if (s.tri && !(s.dias === 360 && s.k === 150)) h += '<p class="warn-box dm-txt">O triplo pensa na multa que seria ineficaz <b>mesmo no máximo</b>. Aqui a multa ainda não está no máximo (360 dias × 5 SM).</p>';
        h += '<div class="dm-gauge" aria-hidden="true"><div class="bar"></div>' +
          (s.tri ? '<div class="tri" style="left:' + pos(r.max, maxG) + '%"></div>' : "") +
          '<div class="tk" style="left:0"></div><div class="tk" style="left:' + pos(r.max, maxG) + '%"></div>' +
          '<div class="pin" data-l="aqui" style="left:' + pos(r.total, maxG) + '%"></div></div>' +
          '<div class="dm-scale"><span>mín. 1/3 SM</span><span>' + (s.tri ? "1.800 SM · 5.400 SM" : "máx. 1.800 SM") + "</span></div>" +
          '<p class="muted dm-txt">Escala logarítmica entre o mínimo e o máximo legais.</p>';
        $(".dm-res").innerHTML = h;
        $(".dm-lims").innerHTML =
          '<div class="dm-lim"><span class="v">' + BRL(r.min) + '</span><span class="r">mínimo absoluto: 10 × 1/30 SM = 1/3 SM</span></div>' +
          '<div class="dm-lim"><span class="v">' + BRL(r.max) + '</span><span class="r">máximo absoluto: 360 × 5 SM = 1.800 SM</span></div>' +
          '<div class="dm-lim"><span class="v">' + BRL(r.maxTri) + '</span><span class="r">com o triplo: 5.400 SM <small class="comp">complemento</small></span></div>';
        if (!feito && mexeu.dias && mexeu.k) { feito = true; if (api.award) api.award(5, "Calculou uma multa"); if (api.done) api.done(); }
      }
      function clampD(v) { return Math.max(10, Math.min(360, Math.round(v))); }
      function onInput(ev) {
        var f = ev.target.getAttribute && ev.target.getAttribute("data-f");
        if (!f) return;
        var v = parseFloat(String(ev.target.value).replace(",", "."));
        if (f === "dr") { s.dias = clampD(v); mexeu.dias = true; }
        else if (f === "dn") { if (!isFinite(v)) return; s.dias = clampD(v); mexeu.dias = true; }
        else if (f === "kr") { s.k = Math.max(1, Math.min(150, Math.round(v))); mexeu.k = true; }
        else if (f === "sm") { if (!(v > 0)) return; s.sm = v; }
        update(f);
      }
      function onChange(ev) { // normaliza o campo numérico ao sair
        var f = ev.target.getAttribute && ev.target.getAttribute("data-f");
        if (f === "dn" || f === "sm") update();
      }
      function onClick(ev) {
        var b = ev.target.closest("[data-act]");
        if (!b || !el.contains(b)) return;
        var a = b.getAttribute("data-act"), v = +b.getAttribute("data-v");
        if (a === "d") { s.dias = clampD(s.dias + v); mexeu.dias = true; }
        else if (a === "k") { s.k = v; mexeu.k = true; }
        else if (a === "tri") s.tri = !s.tri;
        else if (a === "smref") s.sm = SM_REF;
        else return;
        update();
      }
      el.addEventListener("input", onInput);
      el.addEventListener("change", onChange);
      el.addEventListener("click", onClick);
      update();
      return function () { el.removeEventListener("input", onInput); el.removeEventListener("change", onChange); el.removeEventListener("click", onClick); };
    }
  };
})();

</script>

(function () {

  var P = ".w-" + ID;

  PENA.css.push(`

  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) { /* sem armazenamento: segue em memória */ }
  S.cnt = Object.assign(blank().cnt, S.cnt || {});
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); };
  function touchStreak() {
    const t = today();
    if (S.lastDay === t) return;

    S.lastDay = t; save();
  }

  /* ---------- Níveis, XP e conquistas ---------- */
  const LEVELS = [
    { n: "Estagiário", xp: 0 }, { n: "Bacharel", xp: 150 }, { n: "Advogado", xp: 400 }, { n: "Promotor", xp: 800 },
    { n: "Juiz", xp: 1400 }, { n: "Desembargador", xp: 2200 }, { n: "Ministro do STJ", xp: 3200 },
  ];
  const levelOf = (xp) => { let i = 0; LEVELS.forEach((l, k) => { if (xp >= l.xp) i = k; }); return i; };

  const ACH = [
    { id: "inicio", n: "Primeira página", d: "Concluir a primeira seção de um módulo.", ok: () => Object.keys(S.secs).length >= 1 },
    { id: "modulo", n: "Módulo fechado", d: "Concluir todas as seções de um módulo.", ok: () => P.modules.some((m) => m.secoes.every((s) => S.secs[m.id + ":" + s.id])) },
    { id: "todos", n: "Matéria vista", d: "Concluir todas as seções dos seis módulos.", ok: () => P.modules.length > 0 && P.modules.every((m) => m.secoes.every((s) => S.secs[m.id + ":" + s.id])) },
    { id: "tres", n: "Três estrelas", d: "Gabaritar o mini-quiz de um módulo.", ok: () => Object.values(S.stars).some((v) => v >= 3) },

    { id: "prova", n: "Aprovado", d: "Tirar 80% ou mais na Prova.", ok: () => (S.best.prova || 0) >= 80 },
    { id: "flash", n: "Memória de elefante", d: "Revisar 60 flashcards.", ok: () => S.cnt.fc >= 60 },
    { id: "pegas", n: "Caçador de pegadinhas", d: "Revelar 20 pegadinhas.", ok: () => S.cnt.pegas >= 20 },

  function checkAch() {
    ACH.forEach((a) => { if (!S.ach[a.id] && a.ok()) { S.ach[a.id] = Date.now(); save(); toast(`<b>${esc(a.n)}</b>Conquista desbloqueada`, "ach", 3800); } });
  }
  function award(xp, motivo) {
    xp = Math.max(0, Math.round(xp || 0));
    if (!xp) return;
    const before = levelOf(S.xp);
    S.xp += xp; touchStreak(); save();
    toast(`+${xp} XP${motivo ? " · " + esc(motivo) : ""}`, "xp", 1600);
    const after = levelOf(S.xp);
    if (after > before) toast(`<b>Você agora é ${esc(LEVELS[after].n)}</b>Subiu de nível`, "ach", 4200);

  }

  /* ---------- Toasts ---------- */
  function toast(html, kind = "", ms = 2200) {

    const t = document.createElement("div");

    box.appendChild(t);

  }

  /* ---------- Leitura em voz (Web Speech API) ---------- */
  const TTS = {
    queue: [], idx: 0, title: "", playing: false, paused: false, voice: null,
    ok: () => "speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
    pickVoice() {
      if (!this.ok()) return null;
      const vs = speechSynthesis.getVoices();
      this.voice = vs.find((v) => /pt[-_]BR/i.test(v.lang) && /google|natural|online/i.test(v.name)) || vs.find((v) => /pt[-_]BR/i.test(v.lang)) || vs.find((v) => /^pt/i.test(v.lang)) || null;
      return this.voice;
    },
    split(text) {
      const parts = String(text).replace(/\s+/g, " ").match(/[^.!?;:]+[.!?;:]*\s*/g) || [text];
      const out = []; let cur = "";
      parts.forEach((p) => { if ((cur + p).length > 220 && cur) { out.push(cur.trim()); cur = p; } else cur += p; });
      if (cur.trim()) out.push(cur.trim());
      return out;
    },
    play(title, text) {
      if (!this.ok()) { toast("Este navegador não tem leitura em voz alta. No Android, use o Chrome com a voz do Google instalada."); return; }
      speechSynthesis.cancel();
      this.queue = this.split(text); this.idx = 0; this.title = title; this.playing = true; this.paused = false;
      this.pickVoice(); this.next(); renderPlayer();
    },
    next() {
      if (!this.playing) return;
      if (this.idx >= this.queue.length) { this.stop(); return; }
      const u = new SpeechSynthesisUtterance(this.queue[this.idx]);
      u.lang = "pt-BR"; if (this.voice) u.voice = this.voice; u.rate = S.rate || 1;
      u.onend = () => { if (!this.playing || this.paused) return; this.idx++; renderPlayer(); this.next(); };
      u.onerror = () => { if (!this.playing) return; this.idx++; this.next(); };
      speechSynthesis.speak(u);
    },
    toggle() {
      if (!this.playing) return;
      if (this.paused) { this.paused = false; speechSynthesis.cancel(); this.next(); }
      else { this.paused = true; speechSynthesis.cancel(); }
      renderPlayer();
    },
    stop() { this.playing = false; this.paused = false; if (this.ok()) speechSynthesis.cancel(); renderPlayer(); },
  };
  if (TTS.ok()) { TTS.pickVoice(); speechSynthesis.onvoiceschanged = () => TTS.pickVoice(); }
  function speakModule(m) {
    const txt = m.audio || [m.titulo, ...m.em30s.map(strip)].join(". ");

  }

      <div class="p-txt"><div class="p-title">${esc(TTS.title)}</div><div class="p-prog"><i style="width:${pct}%"></i></div></div>
      <button id="p-rate" aria-label="Velocidade">${(S.rate || 1).toFixed(2).replace(/0$/, "")}x</button>

  }

  /* ---------- Tema ---------- */
  function applyTheme() {

  }

  /* ---------- Progresso por módulo ---------- */
  const modById = (id) => P.modules.find((m) => m.id === id);

    const secs = m.secoes.length, ws = widgetIds(m);

    const qz = S.stars[m.id] ? 1 : 0;

      <span class="lvl-meta"><span class="lvl-name">${esc(cur.n)}</span><span class="xpbar"><i style="width:${pct}%"></i></span></span>`;

  /* ---------- Roteador ---------- */
  let cleanups = [];

  const ROUTES = { inicio: viewHome, memorizar: viewMemorize, simulado: viewSimulado, progresso: viewProgress };

  }
  const go = (h) => { if (location.hash === "#" + h) route(); else location.hash = h; };

  /* ---------- Início ---------- */
  function fcDue() { const t = today(); return allCards().filter((c) => { const s = S.fc[c.id]; return !s || s.due <= t; }).length; }
  function viewHome(main) {

    const acc = (() => { let a = 0, c = 0; Object.values(S.q).forEach((v) => { a += v.a; c += v.c; }); return a ? Math.round((c / a) * 100) : null; })();
    main.innerHTML = `
      <section class="hero">
        <div class="hero-main">
          <span class="eyebrow">Direito Penal · Teoria da Pena</span>
          <h1>Concurso de crimes, <mark>limites</mark> e penas alternativas</h1>

          <div class="btn-row">

          </div>
        </div>
        <aside class="panel today" aria-label="Hoje">
          <span class="eyebrow">Hoje</span>

          <a class="btn" href="#memorizar">Revisar flashcards</a>

          <div class="row"><span>Taxa de acerto</span><span class="big num">${acc == null ? "—" : acc + "%"}</span></div>
          <a class="btn" href="#simulado">Abrir simulado</a>
        </aside>
      </section>
      <section>
        <div class="sec-head"><h2>Mapa da matéria</h2><span class="muted">${P.modules.length} módulos</span></div>
        <div class="mods">${P.modules.map((m) => { const p = modProgress(m); return `
          <a class="mod-card" href="#${m.id}">
            <span class="mod-num">${m.num}</span>
            <h3>${esc(m.titulo)}</h3>
            <span class="sub">${esc(m.subtitulo || "")}</span>
            <span class="mod-foot"><span class="pbar"><i style="width:${p.pct}%"></i></span><span class="num muted" style="font-size:var(--fs-xs)">${p.pct}%</span>${starsHtml(p.stars)}</span>
          </a>`; }).join("")}</div>
      </section>
      <section>
        <div class="sec-head"><h2>Régua das frações</h2><span class="muted">Todas começam em 1/6</span></div>
        <div class="regua">${reguaSvg()}</div>
      </section>`;
    const b = $("#h-audio"); if (b) b.onclick = () => speakModule(cont);
  }
  function reguaSvg() {
    const W = 760, L = 150, R = 40, scale = (v) => L + (v / 3) * (W - L - R);
    const rows = [
      { n: "Concurso formal próprio", a: 1 / 6, b: 1 / 2, v: "1/6 até 1/2", f: "art. 70" },
      { n: "Continuado simples", a: 1 / 6, b: 2 / 3, v: "1/6 até 2/3", f: "art. 71" },
      { n: "Continuado específico", a: 1 / 6, b: 3, v: "1/6 até o triplo", f: "art. 71, p. ú." },
    ];
    const ticks = [[1 / 6, "1/6"], [1 / 2, "1/2"], [2 / 3, "2/3"], [1, "1x"], [2, "2x"], [3, "3x"]];
    let y = 34;
    const body = rows.map((r) => {
      const x1 = scale(r.a), x2 = scale(r.b), yy = y; y += 54;
      const lblX = r.b > 2 ? x2 - 6 : x2 + 8, anchor = r.b > 2 ? "end" : "start";
      return `<text class="rg-name" x="0" y="${yy + 15}">${r.n}</text>

    }).join("");

  }

  /* ---------- Módulo ---------- */
  function renderBlock(b) {

  }

    })].filter(Boolean).join(". ").replace(/\bart\.\s*/gi, "artigo ").replace(/§/g, "parágrafo ").replace(/\bSúm\.\s*/gi, "Súmula ");
  }
  function viewModule(main, m) {

    const chips = [["em30", "Em 30 segundos"], ...m.secoes.map((s) => ["s-" + s.id, strip(s.titulo)]), ["macetes", "Macetes"], ["pegadinhas", "Pegadinhas"], ["numeros", "Números"], ...(m.atencao && m.atencao.length ? [["atencao", "Atenção"]] : []), ["quiz", "Mini-quiz"]];
    main.innerHTML = `
      <header class="mod-head">

        <section class="block-sec" id="s-${esc(s.id)}">

      <section class="block-sec" id="macetes">

          const st = r.correct >= 5 ? 3 : r.correct >= 4 ? 2 : r.correct >= 3 ? 1 : 0;

    start();
  }

  /* ---------- Motor de questões ---------- */
  function pickQuestions(pool, n) {

  }
  const canShuffle = (q) => !(q.opcoes || []).some((o) => /\b(todas|nenhuma) (as|das) (anteriores|alternativas)|\b[A-E]\b\s*(e|,)\s*\b[A-E]\b|apenas [IVX]+|somente [IVX]+|\b[IVX]+ e [IVX]+\b/i.test(strip(o)));
  function prepare(q) {
    if (q.tipo === "vf" || q.tipo === "classificar" || !canShuffle(q)) return { q, order: (q.opcoes || []).map((_, i) => i) };

  function runQuiz(el, opt) {

  const correctText = (q) => q.tipo === "vf" ? (q.correta ? "Certo" : "Errado") : q.tipo === "classificar" ? q.itens.map((it) => `${strip(it.texto).slice(0, 40)} → ${q.categorias[it.cat]}`).join("; ") : strip(q.opcoes[q.correta]);

  /* ---------- Simulado ---------- */
  const simState = { mods: null, pending: null };

        { id: "treino", ic: I.target, t: "Treino", d: "10 questões com correção comentada na hora.", meta: `${pool.length} questões no banco`, n: pool.length },

    const back = () => { run.innerHTML = ""; $("#modes").hidden = false; paintModes(); main.scrollIntoView({ behavior: "smooth" }); };
    function start(mode) {

  function provaMix(pool, n) {

  }

  /* ---------- Memorizar ---------- */
  function allCards() { return P.modules.flatMap((m) => (m.flashcards || []).map((c, i) => ({ id: `${m.id}-fc${i}`, mod: m.id, ...c }))); }
  const memState = { tab: "flash", deck: "todos" };
  function viewMemorize(main) {
    main.innerHTML = `
      <header class="stack" style="gap:.6rem"><span class="eyebrow">Memorizar</span><h1>Fixar a matéria</h1>
      <p class="muted read">Flashcards com repetição espaçada: o que você acerta volta cada vez mais tarde; o que erra volta logo.</p></header>
      <nav class="subtabs" id="mt">${[["flash", "Flashcards"], ["numeros", "Jogo dos números"], ["macetes", "Todos os macetes"], ["pegas", "Todas as pegadinhas"], ["atencao", "Erros do material"]].map(([id, t]) => `<button class="chip ${memState.tab === id ? "on" : ""}" data-t="${id}">${t}</button>`).join("")}</nav>
      <section id="mbody"></section>`;
    $$("#mt .chip", main).forEach((c) => c.onclick = () => { memState.tab = c.dataset.t; runCleanups(); viewMemorize(main); });
    const body = $("#mbody", main);
    ({ flash: memFlash, numeros: memNums, macetes: memMacetes, pegas: memPegas, atencao: memAtencao }[memState.tab])(body);
  }
  function memFlash(body) {
    const cards = allCards().filter((c) => memState.deck === "todos" || c.mod === memState.deck);
    const t = today();
    const boxCount = [0, 0, 0, 0, 0, 0]; cards.forEach((c) => boxCount[(S.fc[c.id] || { box: 0 }).box]++);
    const due = cards.filter((c) => { const s = S.fc[c.id]; return s && s.box > 0 && s.due <= t; });
    const fresh = cards.filter((c) => !S.fc[c.id] || S.fc[c.id].box === 0);
    body.innerHTML = `<div class="stack">
      <div class="picker">${[["todos", "Todos"], ...P.modules.map((m) => [m.id, m.num + ". " + m.titulo])].map(([id, tt]) => `<button class="chip ${memState.deck === id ? "on" : ""}" data-d="${id}">${esc(tt)}</button>`).join("")}</div>
      <div class="boxes" aria-label="Caixas de repetição">${["Novos", "Caixa 1", "Caixa 2", "Caixa 3", "Caixa 4", "Dominados"].map((n, k) => `<div><b class="num">${boxCount[k]}</b>${n}</div>`).join("")}</div>
      <div class="panel soft" style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap"><div><b>${due.length} para revisar hoje</b> · ${fresh.length} novos</div><div class="btn-row"><button class="btn primary" id="fc-go" ${due.length + fresh.length ? "" : "disabled"}>Estudar agora</button><button class="btn" id="fc-all">Treino livre</button></div></div>
      <div id="fc-area"></div></div>`;
    $$("[data-d]", body).forEach((c) => c.onclick = () => { memState.deck = c.dataset.d; memFlash(body); });
    $("#fc-go", body).onclick = () => { const d = shuffle(due).slice(0, 20); session(d.concat(shuffle(fresh).slice(0, Math.max(0, Math.min(10, 20 - d.length))))); };
    $("#fc-all", body).onclick = () => session(shuffle(cards).slice(0, 15), true);
    function session(list, free) {
      if (!list.length) { toast("Nada para revisar agora."); return; }
      const area = $("#fc-area", body); let k = 0, ok = 0;
      const INT = [0, 1, 2, 4, 8, 16];
      const show = () => {
        if (k >= list.length) { area.innerHTML = `<div class="ok-box">Sessão concluída: ${ok} de ${list.length} lembrados. Volte amanhã para as próximas revisões.</div>`; award(Math.min(ok * 2, 30), "flashcards"); setTimeout(() => memFlash(body), 2500); return; }
        const c = list[k];
        area.innerHTML = `<div class="fc-wrap"><span class="muted num">${k + 1} / ${list.length}</span>
          <button class="fc" id="fc" aria-label="Virar cartão"><div class="fc-in"><div class="fc-face"><span class="tag">${esc(modTitle(c.mod))}</span><div class="t">${c.frente}</div><span class="tap">Toque para virar</span></div><div class="fc-face fc-back"><span class="tag">Resposta</span><div class="t">${c.verso}</div></div></div></button>
          <div class="fc-grade" id="gr" hidden><button class="btn b-err" data-g="0">Errei<small>volta hoje</small></button><button class="btn b-mid" data-g="1">Difícil<small>amanhã</small></button><button class="btn b-ok" data-g="2">Acertei<small>sobe de caixa</small></button></div></div>`;
        $("#fc", area).onclick = (e) => { e.currentTarget.classList.toggle("flip"); $("#gr", area).hidden = false; };
        $$("[data-g]", area).forEach((b) => b.onclick = () => {
          const g = +b.dataset.g, s = S.fc[c.id] || { box: 0, due: t };
          if (!free) {
            if (g === 0) { s.box = 1; s.due = t; list.push(c); }
            else if (g === 1) { s.box = Math.max(1, s.box); s.due = t + 1; }
            else { s.box = Math.min(5, s.box + 1); s.due = t + INT[s.box]; }
            S.fc[c.id] = s;
          }
          if (g > 0) ok++;
          S.cnt.fc++; touchStreak(); save(); checkAch();
          k++; show();
        });
      };
      show();
      area.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }
  function memNums(body) {
    const all = P.modules.flatMap((m) => (m.numeros || []).map((n) => ({ ...n, mod: m.id })));
    if (all.length < 4) { body.innerHTML = `<p class="muted">Poucos números cadastrados.</p>`; return; }
    let round = 0, hits = 0; const N = 10; const deck = shuffle(all).slice(0, N);
    const show = () => {
      if (round >= deck.length) { body.innerHTML = `<div class="panel stack"><h3>${hits} de ${deck.length}</h3><p class="muted">Os números são o que mais derruba na prova. Repita até acertar todos.</p><div class="btn-row"><button class="btn primary" id="nn">Jogar de novo</button></div></div>`; award(hits * 3, "jogo dos números"); $("#nn", body).onclick = () => memNums(body); return; }
      const c = deck[round];
      const others = shuffle([...new Set(all.filter((x) => strip(x.valor) !== strip(c.valor)).map((x) => strip(x.valor)))]).slice(0, 3);
      const opts = shuffle([strip(c.valor), ...others]);
      body.innerHTML = `<div class="quiz"><div class="qhead"><span class="qn num">Rodada ${round + 1} de ${deck.length}</span><span class="grow"></span><span class="chip" style="min-height:30px;cursor:default">${esc(modTitle(c.mod))}</span></div>
        <div class="qcard"><span class="eyebrow">Qual é o número?</span><div class="qtext">${c.rotulo}</div>
        <div class="opts">${opts.map((o, k) => `<button class="opt" data-v="${esc(o)}"><span class="let">${LET[k]}</span><span class="num">${esc(o)}</span></button>`).join("")}</div>
        <div class="feedback" id="fb" hidden></div><div class="qfoot"><button class="btn primary" id="nx" hidden>Próxima</button></div></div></div>`;
      $$(".opt", body).forEach((b) => b.onclick = () => {
        const ok = b.dataset.v === strip(c.valor); if (ok) hits++;
        $$(".opt", body).forEach((x) => { x.disabled = true; if (x.dataset.v === strip(c.valor)) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); });
        const fb = $("#fb", body); fb.hidden = false; fb.innerHTML = `<div class="${ok ? "ok-box" : "err-box"}"><b>${esc(strip(c.valor))}</b>${c.fonte ? ` · <span class="fonte">${esc(strip(c.fonte))}</span>` : ""}</div>`;
        const nx = $("#nx", body); nx.hidden = false; nx.onclick = () => { round++; show(); };
      });
    };
    show();
  }
  function memMacetes(body) {
    body.innerHTML = P.modules.map((m) => `<section class="block-sec"><header><h2>${m.num}. ${esc(m.titulo)}</h2></header><div class="macetes">${(m.macetes || []).map((x) => `<article class="macete"><h4>${I.bulb}${x.titulo}</h4><p>${x.texto}</p></article>`).join("")}</div></section>`).join("");
    body.className = "stack"; body.style.gap = "2rem";
  }
  function memPegas(body) {
    body.innerHTML = P.modules.map((m) => `<section class="block-sec"><header><h2>${m.num}. ${esc(m.titulo)}</h2></header><div class="pegas">${(m.pegadinhas || []).map((x) => `<button class="pega"><span class="lbl2 err-text">Parece verdade</span><span class="q">${x.parece}</span><span class="a">${x.real}</span><span class="hint">Ver a resposta</span></button>`).join("")}</div></section>`).join("");
    body.className = "stack"; body.style.gap = "2rem";
    $$(".pega", body).forEach((b) => b.onclick = () => { if (!b.classList.contains("open")) { b.classList.add("open"); S.cnt.pegas++; save(); checkAch(); } else b.classList.remove("open"); });
  }
  function memAtencao(body) {
    const list = P.modules.filter((m) => (m.atencao || []).length);
    body.innerHTML = `<p class="muted read" style="margin-bottom:1rem">Pontos em que o material da aula tem erro, contradição ou algo a confirmar com o professor.</p>` + list.map((m) => `<section class="block-sec"><header><h2>${m.num}. ${esc(m.titulo)}</h2></header><div class="atencao">${m.atencao.map((a) => `<div class="warn-box">${a}</div>`).join("")}</div></section>`).join("");
    body.className = "stack"; body.style.gap = "1.5rem";
  }

  /* ---------- Progresso ---------- */
  let resetArm = false;
  function viewProgress(main) {
    const li = levelOf(S.xp), cur = LEVELS[li], nxt = LEVELS[li + 1];
    const temas = {};
    P.questions.forEach((q) => { const s = S.q[q.id]; if (!s) return; const k = modTitle(q.modulo) + " · " + temaOf(q); temas[k] = temas[k] || { a: 0, c: 0 }; temas[k].a += s.a; temas[k].c += s.c; });
    const tl = Object.entries(temas).sort((a, b) => a[1].c / a[1].a - b[1].c / b[1].a);
    main.innerHTML = `
      <header class="stack" style="gap:.6rem"><span class="eyebrow">Progresso</span><h1>${esc(cur.n)}</h1>
        <p class="muted">${S.xp} XP${nxt ? ` · faltam ${nxt.xp - S.xp} para ${esc(nxt.n)}` : " · topo da carreira"} · sequência de ${S.streak} ${S.streak === 1 ? "dia" : "dias"}</p></header>
      <section class="stack"><h2>Módulos</h2><div class="b-tbl"><table class="tbl"><thead><tr><th>Módulo</th><th>Seções</th><th>Interativos</th><th>Mini-quiz</th><th>Total</th></tr></thead><tbody>
        ${P.modules.map((m) => { const p = modProgress(m); return `<tr><td><a href="#${m.id}">${m.num}. ${esc(m.titulo)}</a></td><td class="num">${p.sd}/${p.secs}</td><td class="num">${p.wd}/${p.ws}</td><td>${starsHtml(p.stars)}</td><td class="num">${p.pct}%</td></tr>`; }).join("")}
      </tbody></table></div></section>
      <section class="stack"><h2>Pontos fracos e fortes</h2>${tl.length ? `<div class="temas">${tl.map(([t, v]) => `<div class="tema-row"><span>${esc(t)}</span><span class="pbar"><i style="width:${(v.c / v.a) * 100}%"></i></span><span class="pct num">${Math.round((v.c / v.a) * 100)}%</span></div>`).join("")}</div>` : `<p class="muted">Responda algumas questões no simulado para ver seu desempenho por tema.</p>`}</section>
      <section class="stack"><h2>Conquistas <span class="muted num" style="font-size:var(--fs-md)">${Object.keys(S.ach).length}/${ACH.length}</span></h2>
        <div class="achs">${ACH.map((a) => `<div class="ach ${S.ach[a.id] ? "on" : ""}"><span class="medal">${S.ach[a.id] ? I.medal : I.lock}</span><div><b>${esc(a.n)}</b><span>${esc(a.d)}</span></div></div>`).join("")}</div></section>
      <section class="stack"><h2>Ajustes</h2><div class="settings">
        <div><label class="lbl" for="set-theme">Tema</label><select class="field" id="set-theme"><option value="auto">Seguir o sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select></div>
        <div><label class="lbl" for="set-rate">Velocidade da voz: <span id="rate-v" class="num">${S.rate}x</span></label><input type="range" id="set-rate" min="0.8" max="1.6" step="0.05" value="${S.rate}"></div>
        <div class="btn-row"><button class="btn" id="test-voice">${I.head} Testar voz</button></div>
        <div class="confirm-row" id="reset-row"><button class="btn" id="reset">Apagar meu progresso</button></div>
        <p class="muted" style="font-size:var(--fs-xs)">O progresso fica salvo apenas neste aparelho e neste navegador.</p>
      </div></section>`;
    $("#set-theme").value = S.theme;
    $("#set-theme").onchange = (e) => { S.theme = e.target.value; save(); applyTheme(); renderTop(); };
    $("#set-rate").oninput = (e) => { S.rate = +e.target.value; $("#rate-v").textContent = S.rate + "x"; save(); };
    $("#test-voice").onclick = () => TTS.play("Teste de voz", "Concurso formal próprio: aplica-se a pena mais grave, aumentada de um sexto até a metade.");
    $("#reset").onclick = () => {
      const row = $("#reset-row");
      row.innerHTML = `<span>Apagar XP, estrelas, flashcards e conquistas?</span><button class="btn" id="r-no">Cancelar</button><button class="btn" id="r-yes" style="border-color:var(--err);color:var(--err)">Apagar tudo</button>`;
      $("#r-no").onclick = () => viewProgress(main);
      $("#r-yes").onclick = () => { const th = S.theme, rt = S.rate; S = blank(); S.theme = th; S.rate = rt; save(); renderTop(); toast("Progresso apagado."); viewProgress(main); };
    };
  }

  /* ---------- Inicialização ---------- */
  function boot() {
    const st = document.createElement("style"); st.textContent = (P.css || []).join("\n"); document.head.appendChild(st);
    P.modules.sort((a, b) => a.num - b.num);
    const app = document.getElementById("app");
    app.innerHTML = `
      <header class="topbar"><div class="topbar-in">
        <a class="brand" href="#inicio">Penas em <span>Foco</span></a>
        <span class="spacer"></span>
        <span class="streak" id="streak" title="Dias seguidos de estudo"></span>
        <a class="lvl" id="lvl" href="#progresso" aria-label="Seu nível"></a>
        <button class="btn small primary" id="install" hidden>Instalar</button>
        <button class="icon-btn" id="theme"></button>
      </div></header>
      <main class="view" id="view"></main>
      <div class="player" id="player" hidden></div>
      <div class="toasts" id="toasts" aria-live="polite"></div>
      <nav class="tabbar" aria-label="Navegação principal"><div class="tabbar-in">
        <a class="tab" data-tab="inicio" href="#inicio">${I.home}<span>Estudar</span></a>
        <a class="tab" data-tab="memorizar" href="#memorizar">${I.cards}<span>Memorizar</span></a>
        <a class="tab" data-tab="simulado" href="#simulado">${I.target}<span>Simulado</span></a>
        <a class="tab" data-tab="progresso" href="#progresso">${I.trophy}<span>Progresso</span></a>
      </div></nav>`;
    $("#theme").onclick = () => { S.theme = { auto: "light", light: "dark", dark: "auto" }[S.theme]; save(); applyTheme(); renderTop(); toast("Tema: " + ({ auto: "do sistema", light: "claro", dark: "escuro" }[S.theme])); };
    applyTheme(); touchStreak(); renderTop();
    // PWA: botão "Instalar" quando o navegador oferece a instalação
    let deferred = null;
    window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; $("#install").hidden = false; });
    $("#install").onclick = async () => {
      if (!deferred) return;
      deferred.prompt();
      try { await deferred.userChoice; } catch (err) {}
      deferred = null; $("#install").hidden = true;
    };
    window.addEventListener("appinstalled", () => { $("#install").hidden = true; toast("App instalado. Abra pelo ícone Penas em Foco."); });
    window.addEventListener("hashchange", route);
    route(); checkAch();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
<script>if ("serviceWorker" in navigator && location.protocol !== "file:") {window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));}</script>
</body>
</html>
