<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3fbf">
<title>Penas em Foco</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Literata:opsz,wght@7..72,500;7..72,650;7..72,700&display=swap">
<style>
/* Layout: app de uma coluna para tablet, com barra superior fixa e conteúdo de leitura (~68ch); estética de Vade Mecum anotado: caneta azul + marca-texto. */
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #eceff7;
  --ink: #161a2e;
  --ink-soft: #4d5470;
  --line: #d6dbea;
  --accent: #1f3fbf;          /* azul caneta */
  --accent-soft: #e3e8fb;
  --accent-ink: #ffffff;
  --mark: #ffe75a;            /* marca-texto */
  --mark-ink: #161a2e;
  --ok: #157a4a;
  --ok-bg: #e2f5ea;
  --err: #b42335;
  --err-bg: #fbe6e9;
  --warn: #9a5b00;
  --warn-bg: #fff2d6;
  --shadow: 0 1px 2px rgba(22, 26, 46, .06), 0 4px 16px rgba(22, 26, 46, .06);

  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --fs-xs: .8125rem;
  --fs-sm: .9375rem;
  --fs-md: 1.0625rem;
  --fs-lg: 1.3125rem;
  --fs-xl: 1.75rem;
  --fs-2xl: 2.375rem;

  --r: 10px;
  --r-lg: 16px;
  --tap: 48px;
  --read: 68ch;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131f; --surface: #181c2c; --surface-2: #21263a; --ink: #e9ecf7; --ink-soft: #a3abc6;
    --line: #2f3550; --accent: #8fa6ff; --accent-soft: #252d52; --accent-ink: #0d1020;
    --mark: #e8cf3a; --mark-ink: #10131f; --ok: #5fd39a; --ok-bg: #12301f; --err: #ff7d8c; --err-bg: #3a1720;
    --warn: #f3b855; --warn-bg: #352710; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131f; --surface: #181c2c; --surface-2: #21263a; --ink: #e9ecf7; --ink-soft: #a3abc6;
  --line: #2f3550; --accent: #8fa6ff; --accent-soft: #252d52; --accent-ink: #0d1020;
  --mark: #e8cf3a; --mark-ink: #10131f; --ok: #5fd39a; --ok-bg: #12301f; --err: #ff7d8c; --err-bg: #3a1720;
  --warn: #f3b855; --warn-bg: #352710; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--fs-md);
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }

h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; font-weight: 650; }
h1 { font-size: var(--fs-2xl); letter-spacing: -.01em; }
h2 { font-size: var(--fs-xl); }
h3 { font-size: var(--fs-lg); }
h4 { font-size: var(--fs-md); }
p { margin: 0; }
a { color: var(--accent); }
mark { background: linear-gradient(transparent 12%, var(--mark) 12%, var(--mark) 88%, transparent 88%); color: var(--mark-ink); padding: 0 .15em; border-radius: 2px; }
b, strong { font-weight: 700; }
small.comp { font-family: var(--f-mono); font-size: .72em; color: var(--warn); background: var(--warn-bg); padding: .05em .4em; border-radius: 4px; white-space: nowrap; vertical-align: .1em; }
.art { font-family: var(--f-mono); font-size: .88em; color: var(--accent); white-space: nowrap; }
.muted { color: var(--ink-soft); }
.eyebrow { font-family: var(--f-mono); font-size: var(--fs-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.num { font-variant-numeric: tabular-nums; }

/* Controles compartilhados (widgets usam estes) */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: var(--tap); padding: .5em 1.1em; border-radius: var(--r);
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 var(--fs-sm)/1.2 var(--f-body); cursor: pointer; text-align: center; text-decoration: none;
  transition: transform .08s ease, background .15s ease, border-color .15s ease;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(.97); }
.btn:focus-visible, .chip:focus-visible, .field:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.small { min-height: 38px; padding: .35em .8em; font-size: var(--fs-xs); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: .6rem; }

.chip {
  display: inline-flex; align-items: center; gap: .35em; min-height: 40px; padding: .35em .9em;
  border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 var(--fs-xs)/1.2 var(--f-body); cursor: pointer;
}
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.1rem 1.2rem; }
.panel.soft { background: var(--surface-2); border-color: transparent; }
.ok-box { background: var(--ok-bg); color: var(--ink); border-left: 4px solid var(--ok); border-radius: var(--r); padding: .8rem 1rem; }
.err-box { background: var(--err-bg); color: var(--ink); border-left: 4px solid var(--err); border-radius: var(--r); padding: .8rem 1rem; }
.warn-box { background: var(--warn-bg); color: var(--ink); border-left: 4px solid var(--warn); border-radius: var(--r); padding: .8rem 1rem; }
.ok-text { color: var(--ok); font-weight: 700; }
.err-text { color: var(--err); font-weight: 700; }

.field {
  min-height: var(--tap); width: 100%; padding: .5em .8em; border-radius: var(--r);
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: var(--fs-md) var(--f-body);
}
input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 36px; }
label.lbl { display: block; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-soft); margin-bottom: .3rem; letter-spacing: .02em; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 1rem; }
.stack { display: flex; flex-direction: column; gap: 1rem; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

table.tbl { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
table.tbl th, table.tbl td { text-align: left; padding: .55rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
table.tbl th { font-family: var(--f-mono); font-size: var(--fs-xs); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); background: var(--surface-2); }

@keyframes pop { 0% { transform: scale(.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.anim-pop { animation: pop .25s ease-out; }
.anim-shake { animation: shake .3s ease-in-out; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* Estrutura do app: barra superior, conteúdo central, barra de abas inferior, player de áudio. */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { max-width: 1040px; margin: 0 auto; min-height: 60px; display: flex; align-items: center; gap: .9rem; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; color: var(--ink); text-decoration: none; white-space: nowrap; letter-spacing: -.01em; }
.brand span { color: var(--mark-ink); background:linear-gradient(transparent 55%, var(--mark) 55%, var(--mark) 92%, transparent 92%); padding: 0 .1em; }
.topbar .spacer { flex: 1; }
.lvl { display: flex; align-items: center; gap: .6rem; min-width: 0; text-decoration: none; color: var(--ink); }
.lvl-badge { font-family: var(--f-mono); font-size: var(--fs-xs); font-weight: 600; background: var(--accent-soft); color: var(--accent); padding: .3em .65em; border-radius: 999px; white-space: nowrap; }
.lvl-meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lvl-name { font-size: var(--fs-xs); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xpbar { width: 120px; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.xpbar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.streak { font-family: var(--f-mono); font-size: var(--fs-xs); color: var(--ink-soft); white-space: nowrap; display: flex; align-items: center; gap: .3em; }
.streak svg { color: var(--warn); }
.icon-btn { width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }
@media (max-width: 560px) { .lvl-meta, .streak-txt { display: none; } .brand { font-size: 1.1rem; } }

main.view {
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1.5rem calc(120px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 2rem;
}
.read { max-width: var(--read); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-soft); text-decoration: none; font-size: var(--fs-xs); font-weight: 700; border-radius: var(--r); }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--accent); }
.tab.on svg { background: var(--accent-soft); border-radius: 999px; padding: 2px 14px; width: 52px; box-sizing: content-box; height: 24px; }

/* Player de áudio */
.player {
  position: fixed; z-index: 29; left: 50%; transform: translateX(-50%);
  bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  width: min(560px, calc(100% - 32px)); background: var(--ink); color: var(--bg);
  border-radius: var(--r-lg); box-shadow: var(--shadow); padding: .6rem .7rem .6rem 1rem;
  display: flex; align-items: center; gap: .6rem;
}
.player .p-txt { flex: 1; min-width: 0; font-size: var(--fs-xs); }
.player .p-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .p-prog { height: 3px; background: color-mix(in srgb, var(--bg) 25%, transparent); border-radius: 9px; margin-top: 5px; overflow: hidden; }
.player .p-prog i { display: block; height: 100%; background: var(--mark); width: 0; transition: width .3s; }
.player button { width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--bg); display: grid; place-items: center; cursor: pointer; font: 700 var(--fs-xs) var(--f-mono); }
.player button:hover { background: color-mix(in srgb, var(--bg) 14%, transparent); }

/* Toasts */
.toasts { position: fixed; z-index: 40; top: calc(70px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: .5rem; align-items: flex-end; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: .65rem 1rem; border-radius: var(--r); font-size: var(--fs-sm); font-weight: 600; box-shadow: var(--shadow); max-width: 320px; animation: pop .25s ease-out; }
.toast.xp { background: var(--accent); color: var(--accent-ink); font-family: var(--f-mono); }
.toast.ach { background: var(--mark); color: var(--mark-ink); }
.toast.ach b { display: block; font-family: var(--f-display); font-size: var(--fs-md); }

/* Início */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1.5rem; align-items: stretch; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
.hero-main { display: flex; flex-direction: column; gap: 1rem; justify-content: center; }
.hero-main h1 { font-size: clamp(2rem, 5vw, 3rem); }
.hero-main h1 mark { padding: 0 .1em; }
.hero-main .lead { font-size: var(--fs-lg); color: var(--ink-soft); max-width: 36ch; line-height: 1.45; }
.today { display: flex; flex-direction: column; gap: .9rem; }
.today .row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.today .big { font-family: var(--f-mono); font-size: var(--fs-xl); font-weight: 600; }
.today .btn { width: 100%; }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 1rem; }
.mod-card {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .3rem 1rem; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.1rem 1.2rem;
  text-decoration: none; color: var(--ink); transition: border-color .15s, transform .1s;
}
.mod-card:hover { border-color: var(--accent); }
.mod-card:active { transform: scale(.99); }
.mod-num { grid-row: span 3; font-family: var(--f-display); font-size: 2.6rem; line-height: 1; color: var(--accent); font-weight: 700; width: 1.4em; }
.mod-card h3 { font-size: 1.15rem; }
.mod-card .sub { font-size: var(--fs-sm); color: var(--ink-soft); line-height: 1.4; }
.mod-foot { display: flex; align-items: center; gap: .7rem; margin-top: .5rem; }
.pbar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
.stars { font-family: var(--f-mono); font-size: var(--fs-xs); color: var(--ink-soft); white-space: nowrap; display: inline-flex; gap: 2px; align-items: center; }
.stars svg { width: 15px; height: 15px; }
.stars .on { color: var(--warn); }

/* Régua das frações */
.regua { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.2rem 1.2rem 1rem; }
.regua svg { display: block; width: 100%; height: auto; overflow: visible; }
.regua .rg-tick { stroke: var(--line); stroke-width: 1; }
.regua .rg-tick-lbl { fill: var(--ink-soft); font: 600 12px var(--f-mono); }
.regua .rg-bar { fill: var(--mark); }
.regua .rg-bar-edge { fill: var(--accent); }
.regua .rg-name { fill: var(--ink); font: 700 13px var(--f-body); }
.regua .rg-val { fill: var(--accent); font: 600 13px var(--f-mono); }
.regua .rg-axis { stroke: var(--ink-soft); stroke-width: 1.5; }

/* Módulo */
.mod-head { display: flex; flex-direction: column; gap: .7rem; }
.mod-head .arts { display: flex; flex-wrap: wrap; gap: .4rem; }
.mod-head .arts span { font-family: var(--f-mono); font-size: var(--fs-xs); color: var(--accent); border: 1px solid var(--accent-soft); background: var(--accent-soft); padding: .2em .6em; border-radius: 6px; }
.jump { position: sticky; top: calc(60px + env(safe-area-inset-top, 0px)); z-index: 15; background: var(--bg); padding-block: .6rem; margin-inline: -4px; display: flex; gap: .45rem; overflow-x: auto; scrollbar-width: none; }
.jump::-webkit-scrollbar { display: none; }
.jump .chip { flex: none; }
.em30 { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.2rem 1.3rem; display: flex; flex-direction: column; gap: .8rem; }
.em30 ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: .5rem; font-size: var(--fs-md); }
.em30 li::marker { color: var(--accent); }
.block-sec { display: flex; flex-direction: column; gap: 1rem; scroll-margin-top: 130px; }
.block-sec > header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: .5rem; }
.block-sec > header h2 { font-size: var(--fs-xl); }
.blocks { display: flex; flex-direction: column; gap: 1rem; }
.blocks > p, .blocks > ul, .blocks > ol { max-width: var(--read); }
.blocks ul, .blocks ol { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: .4rem; }
.b-lei { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: .9rem 1.1rem; border-radius: 0 var(--r) var(--r) 0; max-width: var(--read); font-family: var(--f-display); font-size: var(--fs-md); line-height: 1.55; }
.b-lei .ref { display: block; font-family: var(--f-mono); font-size: var(--fs-xs); color: var(--accent); font-weight: 600; margin-bottom: .3rem; letter-spacing: .03em; }
.b-ex { border: 1.5px dashed var(--line); border-radius: var(--r); padding: .9rem 1.1rem; max-width: var(--read); }
.b-ex h4 { font-family: var(--f-body); font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); margin-bottom: .35rem; }
.b-dest { background: var(--mark); color: var(--mark-ink); border-radius: var(--r); padding: .9rem 1.1rem; font-weight: 600; max-width: var(--read); }
.b-dest mark { background: none; padding: 0; text-decoration: underline; text-decoration-thickness: 2px; }
.b-juris { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .45rem; max-width: var(--read); }
.b-juris .ref { font-family: var(--f-mono); font-size: var(--fs-xs); font-weight: 600; color: var(--ink-soft); display: flex; gap: .5em; align-items: center; }
.b-juris .ref::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--accent); flex: none; }
.b-juris .tese { font-family: var(--f-display); font-size: var(--fs-md); font-weight: 600; }
.b-cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: .8rem; }
.b-cmp > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .9rem 1rem; min-width: 0; }
.b-cmp h4 { font-size: var(--fs-md); margin-bottom: .5rem; color: var(--accent); }
.b-cmp ul { font-size: var(--fs-sm); }
.b-tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.b-tbl table.tbl td:first-child { font-weight: 600; }
.w-card { background: var(--surface); border: 1.5px solid var(--accent); border-radius: var(--r-lg); overflow: hidden; }
.w-card > header { background: var(--accent-soft); padding: .9rem 1.2rem; display: flex; gap: .9rem; align-items: center; }
.w-card > header svg { color: var(--accent); flex: none; }
.w-card > header h3 { font-size: var(--fs-lg); }
.w-card > header p { font-size: var(--fs-sm); color: var(--ink-soft); }
.w-card > header .done { margin-left: auto; font-size: var(--fs-xs); font-weight: 700; color: var(--ok); white-space: nowrap; }
.w-body { padding: 1.1rem 1.2rem 1.3rem; min-width: 0; }
.sec-done { align-self: flex-start; }
.sec-done.is-done { border-color: var(--ok); color: var(--ok); }

.macetes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 1rem; }
.macete { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .4rem; }
.macete h4 { display: flex; gap: .5rem; align-items: center; font-size: var(--fs-md); }
.macete h4 svg { color: var(--warn); flex: none; }
.macete p { font-size: var(--fs-sm); }

        { t: "lei", ref: "CP, art. 69, caput", html: `Quando o agente, mediante <b>mais de uma ação ou omissão</b>, pratica dois ou mais crimes, idênticos ou não, aplicam-se <b>cumulativamente</b> as penas privativas de liberdade em que haja incorrido. <small class="comp">complemento</small>` },

  audio: `Vamos conversar sobre concurso de crimes. A ideia é simples: há concurso quando uma ou mais condutas produzem dois ou mais crimes. Antes de tudo, separe isso do conflito aparente de normas. No conflito aparente existe um fato só, e várias normas parecem se aplicar a ele. Quem invade uma casa e furta um objeto comete um crime só, porque o furto absorve a violação de domicílio.

Guarde também a diferença entre conduta e ato. A conduta é o filme; o ato é a cena. Quem desfere vários golpes na vítima até matá-la praticou vários atos, mas uma só conduta. É um homicídio, e não vários.

O Código Penal tem três espécies. A primeira é o concurso material, do artigo 69: várias condutas, vários crimes, e as penas são somadas. Tanto faz se os crimes são iguais ou diferentes, sempre se soma. Se houver reclusão e detenção, elas não se misturam na sentença: cumpre-se primeiro a mais grave, pelo artigo 76 do Código Penal, e o juiz da execução soma tudo para definir o regime, conforme o artigo 111 da Lei de Execução Penal.

A segunda é o concurso formal, do artigo 70: uma só conduta e vários crimes. Pense no motorista de ônibus imprudente que mata dez pessoas. No formal próprio, aplica-se uma pena só, aumentada de um sexto até a metade, conforme o número de crimes. No formal impróprio, quando os crimes são dolosos e nascem de desígnios autônomos, as penas são somadas. Crime culposo nunca é formal impróprio. E, para o professor André Estefam, o dolo eventual também não gera desígnios autônomos.

Atenção à regra de ouro: a exasperação existe para beneficiar o réu. Se ela ficar pior que a soma, aplica-se a soma. É o cúmulo material benéfico. No exemplo do livro, homicídio qualificado com lesão culposa daria catorze anos pela exasperação, mas a soma dá doze anos de reclusão e dois meses de detenção. Fica a soma.

A terceira espécie é o crime continuado, do artigo 71. Lembre da empregada que furta uma peça do faqueiro por dia. Seriam cento e vinte anos de pena; com a continuidade, um ano aumentado de dois terços. O continuado simples aumenta de um sexto a dois terços. O específico, para crimes dolosos, com violência ou grave ameaça, contra vítimas diferentes, vai até o triplo. Uma imagem ajuda: todos começam no um sexto; o formal para na metade, o continuado simples em dois terços e o específico no triplo.

Os requisitos da continuidade são os cinco M: mesma espécie, ou seja, o mesmo tipo penal; mesmo mês, com intervalo de até uns trinta dias; mesmo município ou cidades próximas; mesma maneira de execução; e mesma mente, que é a unidade de desígnio. Os tribunais adotam a teoria objetivo-subjetiva, que exige o plano comum. E quem faz do crime um hábito ou profissão não tem direito ao benefício.

Sobre a natureza jurídica, o Código adotou a ficção jurídica: existem vários crimes, mas punidos com uma só pena. Tanto que a prescrição corre separada para cada crime, pelo artigo 119. Por fim, o vínculo processual: o concurso formal gera continência, do artigo 77 do Código de Processo Penal; os outros dois, conexão, do artigo 76. E não confie no organograma do livro: no formal próprio, o aumento vai até a metade, e não até o triplo.`

  audio: `Agora vamos ver como o Superior Tribunal de Justiça aplica o crime continuado, a partir de três acórdãos da Quinta Turma. A primeira lição vale para todos: o tribunal adota a teoria objetivo-subjetiva. Não basta que os crimes sejam da mesma espécie e tenham tempo, lugar e modo de execução semelhantes. É preciso também a unidade de desígnios, um plano que ligue um crime ao outro. Basta faltar uma peça para cair no concurso material, com a soma das penas.

O primeiro caso é o das enteadas. Um padrasto abusou de duas irmãs que moravam na mesma casa e às vezes dormiam no mesmo quarto, sempre do mesmo jeito: aproveitando a autoridade de padrasto e o sono das meninas. As instâncias de origem reconheceram a continuidade dentro de cada vítima, mas somaram as duas séries. Deu trinta e quatro anos. O Superior Tribunal de Justiça disse que a pluralidade de vítimas, sozinha, não impõe o concurso material. Havia o mesmo núcleo familiar, a mesma relação de autoridade e o mesmo modo de agir. Reconheceu a continuidade global, aplicou cinco sextos sobre doze anos e chegou a vinte e dois anos. Fez isso de ofício, por revaloração jurídica dos fatos, sem reexaminar provas. Guarde uma dúvida para a aula: cinco sextos passa do teto de dois terços do artigo 71, e o acórdão não explica o fundamento.

O segundo caso é o dos furtos. Dois furtos qualificados, com três dias de diferença, na mesma cidade de Santa Catarina. Parece continuidade, mas não é. No primeiro furto o réu agiu com um comparsa; no segundo, sozinho, arrombou um carro. O modo de execução era completamente distinto, então houve reiteração delitiva, e não continuidade. O Ministério Público ainda apontou que o réu fazia do crime uma profissão, e a habitualidade também afasta o benefício. Lembre a frase de Rogério Greco: o criminoso de ocasião não pode ser confundido com o criminoso contumaz.

O terceiro caso é a briga de bar. Um homem já armado com uma faca golpeou cinco pessoas de forma indiscriminada, inclusive quem tentava sair. Um morreu e quatro sobreviveram. Mesmo dia, mesma hora, mesmo lugar, mesmo modo: o requisito objetivo estava presente. Mas faltou o subjetivo, porque houve desígnios autônomos, a vontade de matar cada vítima. Resultado: concurso material e dezessete anos. E há uma conta que fecha a questão. Com cinco crimes, o continuado específico chegaria ao triplo da maior pena, que era de seis anos. Isso daria dezoito anos, mais do que os dezessete da soma. Como o parágrafo único do artigo 71 manda respeitar o cúmulo material benéfico, a continuidade nunca pode piorar a situação do réu.

Para fechar, uma imagem: casa, carro e copo. Na casa, tudo unido, há continuidade. No carro arrombado, o modo mudou, não há. No copo do bar, cada golpe teve seu próprio desígnio, também não há. E lembre que a Súmula 605 do Supremo Tribunal Federal, que proibia continuidade em crimes contra a vida, está superada.`

xiste fração matemática obrigatória na pena-base. Um sexto do mínimo, ou um oitavo do intervalo, são só referências. A escada ficou assim: pena-base acima do mínimo, menos um sexto pela confissão, mais dois terços pela arma de fogo, mais um quinto pelo concurso formal. Resultado: onze anos, um mês e nove dias, em regime fechado. A pena-base não aparece no acórdão; fazendo a conta de trás para a frente, ela fecha em seis anos e oito meses. Para terminar, dois pontos processuais. O réu se defende dos fatos, não do artigo de lei, então não houve violação da correlação: é a emendatio libelli, do artigo 383 do Código de Processo Penal. E o juiz esqueceu a reincidência e não somou a multa, mas, como só a defesa recorreu, esses erros a favor do réu ficaram para sempre. É a proibição da reforma para pior."

o é legítimo. Com o teto de hoje, a mesma conta dá 50 anos efetivos. A finalidade é não deixar o preso imune a novos crimes. Dois detalhes finais. Primeiro, o hiato: se a pessoa cumpriu tudo, saiu e voltou a delinquir, as penas antigas não entram na conta; a nova pena é cumprida por inteiro. Segundo, a fuga: segundo o Supremo, ela não interrompe a execução, só a suspende. Então o teto conta do início do cumprimento, e não da recaptura. E um aviso de complemento: como o teto de 40 é mais grave, ele não retroage. Crimes cometidos antes de 23 de janeiro de 2020 continuam com o limite de 30 anos."

  audio: 'Vamos falar das penas restritivas de direitos, as chamadas penas alternativas. A ideia é simples: a prisão curta funciona mal, então o Código Penal permite trocá-la por algo mais útil quando o crime é de menor gravidade e o condenado tem condições pessoais favoráveis. Repare na ordem que o juiz segue na sentença: primeiro ele fixa a pena de prisão, depois o regime, e só então verifica se cabe a substituição. Se couber, não é favor: é direito público subjetivo do réu. O Superior Tribunal de Justiça, em 2025, disse com todas as letras que a substituição deixa de ser mera faculdade quando os requisitos estão presentes. Agora, atenção: o réu tem direito à substituição, mas não escolhe a espécie. Quem escolhe é o juiz. E as espécies são cinco, previstas no artigo 43: prestação pecuniária, perda de bens e valores, prestação de serviços à comunidade, interdição temporária de direitos e limitação de fim de semana. O inciso terceiro foi vetado, então não caia na conversa de seis espécies. Para gravar os requisitos do artigo 44, use a frase: quero ver réu solto. Quantum de até quatro anos, ou qualquer pena se o crime for culposo. Sem violência nem grave ameaça à pessoa, no crime doloso. Sem reincidência em crime doloso, com a exceção do parágrafo terceiro, que admite a substituição quando ela for socialmente recomendável e a reincidência não for no mesmo crime. E suficiência, quer dizer, as circunstâncias judiciais precisam mostrar que a pena alternativa basta. Cuidado com duas armadilhas de número. No Código Penal, quatro anos exatos cabem. Na lei dos crimes ambientais, a pena precisa ser inferior a quatro anos. E no crime culposo de trânsito com embriaguez, o artigo 312-B do Código de Trânsito proíbe a substituição, seja qual for a pena. Na violência doméstica contra a mulher, a Súmula 588 do Superior Tribunal de Justiça veda a substituição, inclusive em contravenção penal, como as vias de fato. Já no tráfico privilegiado, sem circunstâncias negativas, a Súmula Vinculante 59 torna obrigatórios o regime aberto e a substituição. Quantas penas o juiz aplica? Até um ano de prisão, multa ou uma restritiva. Acima de um ano, uma restritiva mais multa, ou duas restritivas. Algumas regras das espécies: a prestação pecuniária vai de um a trezentos e sessenta salários mínimos e beneficia primeiro a vítima. A perda de bens atinge o patrimônio lícito e tem como teto o maior valor entre o prejuízo e o proveito. A prestação de serviços só cabe para pena superior a seis meses, e cada hora de tarefa equivale a um dia de pena. A limitação de fim de semana é de cinco horas no sábado e no domingo, e, sem casa de albergado, o condenado não vai para presídio. Por fim, a conversão. Se o condenado descumpre sem justificativa, a conversão em prisão é obrigatória, descontando o que já cumpriu, mas com saldo mínimo de trinta dias, e sempre com direito de defesa. Se sobrevém nova condenação por outro crime, a conversão é facultativa: o juiz pode manter a pena alternativa se ela ainda puder ser cumprida. Guarde a frase: quatro quebrou, cinco condenou. E lembre que o juiz da execução ajusta a forma de cumprimento, mas não troca a espécie de pena.'

  audio: 'Agora, a pena de multa. O Código Penal usa o sistema de dias-multa, e ele funciona em duas contas. Primeiro, o juiz decide quantos dias-multa aplicar, entre dez e trezentos e sessenta. Depois, decide quanto vale cada dia, entre um trinta avos e cinco vezes o maior salário mínimo vigente na data do fato. Repare: na data do fato, e não na data da sentença. Na execução, esse valor recebe correção monetária. Um truque para não confundir: o número trezentos e sessenta aparece duas vezes na matéria. Trezentos e sessenta dias-multa é o máximo da multa. Trezentos e sessenta salários mínimos é o máximo da prestação pecuniária, que é uma pena restritiva de direitos. Mesmo número, unidades diferentes, naturezas diferentes. O pagamento deve ser feito em dez dias depois do trânsito em julgado, e o juiz pode admitir o parcelamento. Se o condenado não paga, a multa não se transforma em prisão. Ela é tratada como dívida de valor, aplicando-se as regras da dívida ativa, inclusive quanto à prescrição, mas continua sendo uma sanção penal. Quem promove a execução é o Ministério Público, perante o juízo da execução penal. O material fala em legitimidade exclusiva do Ministério Público, mas o Supremo Tribunal Federal, na ação direta de inconstitucionalidade 3.150, falou em legitimidade prioritária, com a Fazenda Pública podendo agir se o Ministério Público ficar inerte. Agora, um ponto que cai muito: a multa substitutiva. Quando a pena de prisão é de até um ano, o juiz pode trocá-la por multa ou por uma restritiva. Acima de um ano, pode aplicar uma restritiva mais multa. O Superior Tribunal de Justiça decidiu que essa multa substitutiva não é restritiva de direitos e não se confunde com a prestação pecuniária. Por isso, se não for paga, também não vira prisão. Já a prestação pecuniária não paga pelo condenado que tem dinheiro é reconvertida em prisão. Grave: prestação vira cela, multa vira cobrança. Existe ainda a discussão entre o artigo 60, parágrafo segundo, que fala em mult     fonte: "CP, art. 70; Estefam, p. 9" },

  { id: "m1-11", modulo: "m1", tema: "Concurso formal", tipo: "vf", nivel: 3,
    enunciado: "Para André Estefam, se o agente, com uma só conduta, age com dolo eventual em relação aos dois resultados, há concurso formal impróprio, com soma das penas.",
    correta: false,
    explicacao: "Falso para o autor: o Código exige desígnios autônomos, que ele não vê no dolo eventual. Há formal próprio, com uma pena aumentada de 1/6 até a metade. (Complemento: há julgados do STJ que admitem formal impróprio com dolo eventual, posição contrária à do autor.)",
    fonte: "Estefam, p. 9" },

  { id: "m1-12", modulo: "m1", tema: "Cúmulo material benéfico", tipo: "calc", nivel: 2,
    enunciado: "Em concurso formal próprio, o agente comete homicídio qualificado (pena mínima de 12 anos de reclusão) e lesão corporal culposa (pena mínima de 2 meses de detenção). Com as penas no mínimo, qual é a pena final?",
    opcoes: [
      "14 anos de reclusão",
      "18 anos de reclusão",
      "12 anos e 2 meses de reclusão",
      "12 anos de reclusão e 2 meses de detenção"
    ], correta: 3,
    explicacao: "Exasperação: 12 anos + 1/6 (2 anos) = 14 anos. Soma: 12 anos + 2 meses. A soma é menor, então prevalece pelo art. 70, parágrafo único (cúmulo material benéfico). E as espécies não se misturam: 12 anos de reclusão e 2 meses de detenção, não 12 anos e 2 meses de reclusão. 18 anos seria a exasperação máxima (metade).",
    fonte: "CP, art. 70, parágrafo único; Estefam, p. 10" },

  { id: "m1-13", modulo: "m1", tema: "Concurso formal", tipo: "calc", nivel: 2,
    enunciado: "Com uma só conduta imprudente, o motorista mata 4 pessoas. O juiz fixou a pena de cada homicídio culposo em 2 anos. Usando a escala jurisprudencial pelo número de crimes, qual é a pena final?",
    opcoes: [
      "2 anos e 4 meses",
      "2 anos e 6 meses",
      "2 anos e 8 meses",
      "3 anos"
    ], correta: 1,
    explicacao: "Formal próprio: uma pena (2 anos = 24 meses) aumentada pelo número de crimes. Com 4 crimes, 1/4: 24 + 6 = 30 meses = 2 anos e 6 meses. 1/6 daria 2a4m (2 crimes); 1/3 daria 2a8m (5 crimes); 1/2 daria 3 anos (6 ou mais). A escala (2 = 1/6, 3 = 1/5, 4 = 1/4, 5 = 1/3, 6+ = 1/2) é complemento; o material diz apenas que o critério é o número de crimes.",
    fonte: "CP, art. 70; Estefam, p. 9 (escala: complemento)" },

  { id: "m1-14", modulo: "m1", tema: "Crime continuado", tipo: "calc", nivel: 1,
    enunciado: "No exemplo do faqueiro, a empregada pratica 120 furtos simples (pena mínima de 1 ano cada) em continuidade delitiva. Com a pena no mínimo e o aumento máximo do art. 71, caput, qual é a pena?",
    opcoes: [
      "120 anos",
      "1 ano e 2 meses",
      "1 ano e 8 meses",
      "3 anos"
    ], correta: 2,
    explicacao: "Continuado simples: pena de um só crime + até 2/3. 12 meses + 8 meses = 1 ano e 8 meses. Sem o art. 71, seriam 120 anos (120 x 1). 1 ano e 2 meses seria a fração mínima (1/6), inadequada para 120 crimes. O triplo (3 anos) é do continuado específico, que exige violência ou grave ameaça.",
    fonte: "CP, art. 71; Estefam, p. 10" },

  { id: "m1-15", modulo: "m1", tema: "Crime continuado", tipo: "mc", nivel: 1,
    enunciado: "No crime continuado específico (art. 71, parágrafo único), o aumento da pena pode chegar:",
    opcoes: [
      "a 2/3.",
      "à metade.",
      "ao dobro.",
      "ao triplo."
    ], correta: 3,
    explicacao: "Escada do 1/6: formal próprio para na metade, continuado simples em 2/3, continuado específico no triplo. 2/3 é o teto do caput; a metade, do art. 70.",
    fonte: "CP, art. 71, parágrafo único; Estefam, p. 10" },

  { id: "m1-16", modulo: "m1", tema: "Crime continuado", tipo: "mc", nivel: 2,
    enunciado: "Qual destes NÃO é requisito específico do crime continuado qualificado (art. 71, parágrafo único)?",
    opcoes: [
      "Crimes cometidos no mesmo dia.",
      "Crimes dolosos.",
      "Violência ou grave ameaça à pessoa.",
      "Vítimas diferentes."
    ], correta: 0,
    explicacao: "O específico soma aos requisitos gerais três outros: crimes dolosos, violência ou grave ameaça à pessoa e vítimas diferentes (DVD). Não se exige o mesmo dia; o tempo segue o parâmetro geral de cerca de 30 dias entre os fatos.",
    fonte: "CP, art. 71, parágrafo único; Estefam, p. 10" },

  { id: "m1-17", modulo: "m1", tema: "Crime continuado", tipo: "caso", nivel: 2,
    enunciado: "Caio, com o mesmo plano, a mesma arma e o mesmo modo, roubou três vezes o mesmo comerciante, no mesmo bairro, com intervalo de uma semana entre cada roubo. Qual é o enquadramento correto?",
    opcoes: [
      "Continuado específico, com aumento até o triplo, porque houve grave ameaça.",
      "Continuado simples (art. 71, caput), porque falta o requisito de vítimas diferentes.",
      "Concurso formal impróprio, por haver desígnios autônomos.",
      "Concurso material obrigatório, porque roubo não admite continuidade."
    ], correta: 1,
    explicacao: "O específico exige, cumulativamente, crimes dolosos, violência ou grave ameaça e vítimas diferentes. Com a mesma vítima, falta um requisito e volta-se ao continuado simples (1/6 a 2/3), presentes os requisitos gerais. Não há concurso formal porque houve três condutas.",
    fonte: "CP, art. 71; Estefam, p. 10 e pontos de prova" },

  { id: "m1-18", modulo: "m1", tema: "Natureza jurídica", tipo: "mc", nivel: 2,
    enunciado: "Quanto à natureza jurídica do crime continuado, o Código Penal adotou a teoria:",
    opcoes: [
      "da unidade real, pois a continuidade transforma os fatos em crime único.",
      "mista, pois o continuado é modalidade própria de delito.",
      "da ficção jurídica, pois há vários crimes com punição unitária.",
      "puramente objetiva, pois bastam as condições de tempo, lugar e modo."
    ], correta: 2,
    explicacao: "Ficção jurídica: o art. 71 fala em dois ou mais crimes, e na prescrição cada crime é considerado isoladamente (art. 119). A alternativa D mistura outra discussão (a da unidade de desígnios); a B é a teoria mista da natureza jurídica, que não se confunde com a teoria mista dos desígnios.",
    fonte: "CP, arts. 71 e 119; Estefam, p. 11" },

  { id: "m1-19", modulo: "m1", tema: "Natureza jurídica", tipo: "vf", nivel: 2,
    enunciado: "No crime continuado, a prescrição da pretensão punitiva é calculada sobre a pena total, já com o aumento da continuidade, e corre de forma única para todos os crimes.",
    correta: false,
    explicacao: "Falso. Pelo art. 119 do CP, cada delito é considerado individualmente e tem prazo prescricional autônomo, um dos argumentos da ficção jurídica. (Complemento: a Súmula 497 do STF diz que a prescrição se regula pela pena imposta, sem o acréscimo da continuação.)",
    fonte: "CP, art. 119; Estefam, p. 11" },

  { id: "m1-20", modulo: "m1", tema: "Requisitos", tipo: "vf", nivel: 1,
    enunciado: "Segundo o STJ e o STF, citados no material, quem faz da prática criminosa uma habitualidade não tem direito ao reconhecimento da continuidade delitiva.",
    correta: true,
    explicacao: "Verdadeiro. A habitualidade (crime como modo de vida ou profissão) é simples reiteração e afasta o art. 71 (STJ, AgRg no HC 441.147/SC, 6ª T., 2019; STF no mesmo sentido).",
    fonte: "STJ, AgRg no HC 441.147/SC; Estefam, p. 12" },

  { id: "m1-21", modulo: "m1", tema: "Requisitos", tipo: "caso", nivel: 3,
    enunciado: "Em 2008, o réu praticou, contra a mesma vítima e em contextos fáticos distintos, um estupro e um atentado violento ao pudor, com condições semelhantes. O processo ainda estava em curso em 2010. Quanto à continuidade, o que é correto?",
    opcoes: [
      "Não cabe continuidade, porque à época eram tipos penais diferentes.",
      "Cabe continuidade só para fatos posteriores à Lei 12.015/2009.",
      "Cabe concurso formal, porque a lei nova fundiu os tipos.",
      "Cabe continuidade: a Lei 12.015/2009 fundiu as condutas no art. 213, e a inovação benéfica retroage (CF, art. 5º, XL)."
    ], correta: 3,
    explicacao: "Antes da Lei 12.015/2009 não havia continuidade entre estupro e atentado violento ao pudor (STJ, REsp 674.459), pois não eram da mesma espécie. Com a fusão no art. 213, passou a ser admitida, inclusive para fatos anteriores, porque é benéfica. Não há concurso formal, pois houve condutas distintas.",
    fonte: "Lei 12.015/2009; CF, art. 5º, XL; Estefam, p. 12-13" },

  { id: "m1-22", modulo: "m1", tema: "Vínculo processual", tipo: "mc", nivel: 2,
    enunciado: "Assinale a correspondência correta entre modalidade de concurso e vínculo processual.",
    opcoes: [
      "Concurso formal: continência (CPP, art. 77).",
      "Concurso formal: conexão (CPP, art. 76).",
      "Concurso material: continência (CPP, art. 77).",
      "Crime continuado: continência (CPP, art. 77)."
    ], correta: 0,
    explicacao: "Uma só conduta contém vários crimes: o formal gera continência (art. 77). Material e continuado geram conexão (art. 76).",
    fonte: "Estefam, tabela da p. 14" },

  { id: "m1-23", modulo: "m1", tema: "Requisitos", tipo: "caso", nivel: 2,
    enunciado: "Lúcio furtou uma loja em Porto Alegre e, dois meses depois, sem ligação com o primeiro fato, furtou outra loja em Recife, desta vez com um comparsa e usando chave falsa. A defesa pede o art. 71. Qual é a solução?",
    opcoes: [
      "Continuado simples, porque os crimes são da mesma espécie.",
      "Concurso material: o intervalo passa de cerca de 30 dias, as cidades não são próximas, o modo mudou e não há unidade de desígnio.",
      "Concurso formal próprio, porque os bens são do mesmo ramo.",
      "Continuado específico, porque as vítimas são diferentes."
    ], correta: 1,
    explicacao: "Mesma espécie não basta. Os tribunais exigem intervalo de até cerca de 30 dias, mesma cidade ou cidades próximas, modo semelhante (instrumento, modus operandi, sozinho ou acompanhado) e unidade de desígnio. Nada disso está presente. O específico exige ainda violência ou grave ameaça.",
    fonte: "CP, art. 71; Estefam, p. 13-14" },

  { id: "m1-24", modulo: "m1", tema: "Frações", tipo: "calc", nivel: 3,
    enunciado: "Em continuidade delitiva simples, o réu praticou 5 furtos. A pena de cada um ficou em 1 ano e 6 meses. Aplicando a escala da Súmula 659 do STJ, qual é a pena final?",
    opcoes: [
      "1 ano e 9 meses",
      "1 ano, 10 meses e 15 dias",
      "2 anos",
      "2 anos e 6 meses"
    ], correta: 2,
    explicacao: "5 crimes = 1/3. 18 meses + 6 meses = 24 meses = 2 anos. 1/6 daria 1a9m (2 crimes); 1/4 daria 1a10m15d (4 crimes); 2/3 daria 2a6m (7 ou mais). Truque: de 2 a 5 crimes, nº de crimes + denominador = 8. A Súmula 659 é complemento ao material.",
    fonte: "CP, art. 71, caput; Súmula 659 do STJ (complemento)" },

  { id: "m1-25", modulo: "m1", tema: "Frações", tipo: "classificar", nivel: 2,
    enunciado: "Ligue cada situação à regra de pena aplicável.",
    categorias: ["Soma das penas", "+1/6 até a metade", "+1/6 a 2/3", "+1/6 até o triplo"],
    itens: [
      { texto: "Concurso material heterogêneo.", cat: 0 },
      { texto: "Concurso formal impróprio (dolo e desígnios autônomos).", cat: 0 },
      { texto: "Concurso formal próprio.", cat: 1 },
      { texto: "Crime continuado simples.", cat: 2 },
      { texto: "Crime continuado específico.", cat: 3 },
      { texto: "Formal próprio em que a exasperação ficaria maior que a soma (cúmulo material benéfico).", cat: 0 }
    ],
    explicacao: "Material e formal impróprio: cúmulo material. Formal próprio: 1/6 até a metade (o organograma do livro diz 1/6 a 3x por erro). Continuado simples: 1/6 a 2/3. Específico: até o triplo. Se a exasperação passar da soma, aplica-se a soma (art. 70, parágrafo único).",
    fonte: "CP, arts. 69, 70 e 71; Estefam, p. 6-11 e 14" }
);

<script>/* questions/m2.js */
window.PENA = window.PENA || { modules: [], questions: [], widgets: {}, css: [] };
PENA.questions.push(
  { id: "m2-01", modulo: "m2", tema: "Teoria adotada", tipo: "mc", nivel: 1,
    enunciado: "Segundo a jurisprudência do STJ refletida nos acórdãos estudados, a caracterização do crime continuado exige:",
    opcoes: [
      "apenas os requisitos objetivos de tempo, lugar e modo de execução.",
      "apenas a unidade de desígnios entre os crimes.",
      "requisitos objetivos e o requisito subjetivo (unidade de desígnios), cumulativamente.",
      "apenas a identidade de vítimas entre os crimes."
    ], correta: 2,
    explicacao: "É a teoria mista ou objetivo-subjetiva, dita expressamente no Ac. 3 (o CP adotou a teoria mista) e no Ac. 2 (condições de tempo, lugar e modo, além de um liame a indicar a unidade de desígnios). A A é a teoria objetiva pura; a B, a subjetiva; a D contraria o Ac. 1, que admite vítimas diferentes.",
    fonte: "AgRg no HC 789.716/SC; AgRg nos EDcl no HC 959.996/MT; AgRg no AREsp 2.799.301/RN" },

  { id: "m2-02", modulo: "m2", tema: "Casos do STJ", tipo: "caso", nivel: 2,
    enunciado: "Em 19/02/2019, J. furta bens com a ajuda de um comparsa. Em 22/02/2019, na mesma cidade, J., sozinho, arromba um veículo e subtrai objetos. Condenado por dois furtos qualificados em concurso material, pede o art. 71, alegando que as diferenças de execução são meras nuances. Há continuidade?",
    opcoes: [
      "Não: espécie, tempo e lugar estão presentes, mas o modo de execução é distinto e não há liame subjetivo; há reiteração delitiva.",
      "Sim: mesma espécie, três dias de intervalo e mesmo município bastam.",
      "Sim, na forma específica, com aumento até o triplo.",
      "Não, porque furtos com qualificadoras diferentes não são da mesma espécie."
    ], correta: 0,
    explicacao: "É o Ac. 2. O STJ aceitou espécie, tempo e lugar, mas o modo foi completamente distinto (com comparsa x sozinho com arrombamento). A D erra: são da mesma espécie (furto); o que difere é o modo. A C erra porque o específico exige violência ou grave ameaça.",
    fonte: "STJ, AgRg no HC 789.716/SC, 5ª T., 2023" },

  { id: "m2-03", modulo: "m2", tema: "Casos do STJ", tipo: "caso", nivel: 3,
    enunciado: "Um padrasto abusa de duas enteadas, irmãs que moram com ele e às vezes dormem no mesmo quarto, sempre aproveitando a autoridade familiar e o sono das vítimas. A sentença reconhece continuidade dentro de cada vítima e concurso material entre as duas séries, chegando a 34 anos. Para o STJ, essa solução está correta?",
    opcoes: [
      "Sim: vítimas diferentes impõem concurso material entre as séries.",
      "Sim: estupro de vulnerável não admite continuidade entre vítimas distintas.",
      "Não: deveria ser concurso formal, pois houve um só contexto.",
      "Não: há continuidade global entre as séries, pois a pluralidade de vítimas, por si só, não impõe concurso material."
    ], correta: 3,
    explicacao: "No Ac. 1 o STJ afastou o concurso material: mesmo núcleo familiar, mesma autoridade, mesma proximidade espacial e mesmo modo. Os episódios não eram isolados. A pena caiu para 12 anos + 5/6 = 22 anos. Não há concurso formal porque houve muitas condutas.",
    fonte: "STJ, AgRg no HC 1.093.762/SC, 5ª T., 2026" },

  { id: "m2-04", modulo: "m2", tema: "Casos do STJ", tipo: "caso", nivel: 2,
    enunciado: "Numa briga generalizada em um bar, R., que já estava armado com uma faca, golpeia de forma indiscriminada cinco pessoas, inclusive quem só tentava sair. Uma morre; quatro sobrevivem. Mesmo dia, hora, local e modo. A defesa pede o continuado específico com aumento de 1/3. Qual foi a solução do STJ?",
    opcoes: [
      "Continuado específico, com aumento de 1/3, porque as circunstâncias do art. 59 eram neutras.",
      "Concurso material: o requisito objetivo estava presente, mas faltou a unidade de desígnios (houve desígnios autônomos).",
      "Concurso formal próprio, porque tudo ocorreu num único contexto.",
      "Concurso material, porque a Súmula 605 do STF veda continuidade em crimes contra a vida."
    ], correta: 1,
    explicacao: "É o Ac. 3. Pela teoria mista, os requisitos são cumulativos; os desígnios autônomos (vontade de matar cada vítima) afastaram o subjetivo. A D erra: a Súmula 605 está superada (REsp 1.588.037/GO). A C erra porque houve vários golpes, isto é, várias ações.",
    fonte: "STJ, AgRg nos EDcl no HC 959.996/MT, 5ª T., 2025" },

  { id: "m2-05", modulo: "m2", tema: "Cúmulo material benéfico", tipo: "calc", nivel: 2,
    enunciado: "Suponha que, no caso do bar (5 crimes dolosos com violência contra vítimas diferentes), todos os requisitos da continuidade estivessem presentes. A maior pena isolada é de 6 anos e a soma de todas é de 17 anos. Se o juiz quisesse aplicar o aumento máximo do art. 71, parágrafo único, qual pena prevaleceria?",
    opcoes: [
      "18 anos",
      "17 anos",
      "8 anos",
      "12 anos"
    ], correta: 1,
    explicacao: "Triplo de 6 = 18 anos, que supera a soma de 17. O parágrafo único do art. 71 manda observar o art. 70, parágrafo único: a pena não pode exceder a do concurso material. Logo, 17 anos. 8 anos seria 6 + 1/3 (pedido da defesa); 12 anos seria o dobro.",
    fonte: "CP, arts. 70, parágrafo único, e 71, parágrafo único; AgRg nos EDcl no HC 959.996/MT" },

  { id: "m2-06", modulo: "m2", tema: "Fração", tipo: "calc", nivel: 2,
    enunciado: "No Ac. 1, a pena de cada estupro de vulnerável ficou em 12 anos (base de 8 anos + 1/2 do art. 226, II). Reconhecida a continuidade global entre as duas vítimas, o STJ aplicou a fração de 5/6. Qual foi a pena final?",
    opcoes: [
      "14 anos",
      "20 anos",
      "34 anos",
      "22 anos"
    ], correta: 3,
    explicacao: "12 x (1 + 5/6) = 12 x 11/6 = 22 anos (12 + 10). 14 anos seria 12 + 1/6 (série da vítima G. P.); 20 anos, 12 + 2/3 (série da vítima C.); 34 anos, a soma das duas séries nas instâncias ordinárias.",
    fonte: "STJ, AgRg no HC 1.093.762/SC" },

  { id: "m2-07", modulo: "m2", tema: "Pluralidade de vítimas", tipo: "vf", nivel: 1,
    enunciado: "A existência de vítimas distintas impõe, necessariamente, o concurso material entre crimes sexuais.",
    correta: false,
    explicacao: "Falso. A pluralidade de vítimas, isoladamente, não impede a continuidade quando há homogeneidade objetiva e subjetiva (Ac. 1; HC 471.069/SP). Cada vítima tem bem jurídico próprio, mas isso não basta para afastar o art. 71 quando o contexto é comum.",
    fonte: "STJ, AgRg no HC 1.093.762/SC; HC 471.069/SP" },

  { id: "m2-08", modulo: "m2", tema: "Continuado específico", tipo: "mc", nivel: 2,
    enunciado: "Sobre a Súmula 605 do STF (não se admite continuidade delitiva nos crimes contra a vida), é correto afirmar que:",
    opcoes: [
      "foi superada, por incompatível com o art. 71, parágrafo único, na redação da Lei 7.209/1984.",
      "continua plenamente aplicável e foi o fundamento do Ac. 3.",
      "aplica-se apenas aos homicídios qualificados.",
      "aplica-se apenas aos homicídios tentados."
    ], correta: 0,
    explicacao: "O REsp 1.588.037/GO, citado no Ac. 3, afirma que a súmula não é mais aplicada. O parágrafo único do art. 71 justamente prevê continuidade em crimes dolosos com violência contra vítimas diferentes. O Ac. 3 negou a continuidade por falta de unidade de desígnios, não pela súmula.",
    fonte: "STJ, REsp 1.588.037/GO, citado no AgRg nos EDcl no HC 959.996/MT" },

  { id: "m2-09", modulo: "m2", tema: "Há continuidade?", tipo: "caso", nivel: 2,
    enunciado: "Caso hipotético. P., vendedor de uma loja de ferramentas, decide montar em casa um kit completo. Durante seis semanas seguidas, toda sexta-feira, ao fechar a loja, esconde uma ferramenta na mochila e sai. Sempre sozinho, sempre do mesmo jeito. Qual é o enquadramento?",
    opcoes: [
      "Concurso material: seis furtos, penas somadas.",
      "Concurso formal próprio, pois a vítima é a mesma.",
      "Continuado simples (art. 71, caput): pena de um furto aumentada; com 6 crimes, 1/2 pela escala da Súmula 659 do STJ.",
      "Continuado específico, com aumento até o triplo."
    ], correta: 2,
    explicacao: "Todas as luzes verdes: mesma espécie, intervalo de 7 dias, mesmo local, mesmo modo e um plano inicial (o kit), como no faqueiro. Não é específico (não há violência nem vítimas diferentes) nem formal (são seis condutas). A escala da Súmula 659 é complemento ao material.",
    fonte: "CP, art. 71, caput; Súmula 659 do STJ (complemento)" },

  { id: "m2-10", modulo: "m2", tema: "Há continuidade?", tipo: "caso", nivel: 3,
    enunciado: "Caso hipotético. Para pagar uma dívida de valor certo, A. planeja três assaltos. Em dez dias, no mesmo bairro, aborda três motoristas diferentes num semáforo, sempre com o mesmo revólver e a mesma abordagem. Admitidos todos os requisitos gerais, qual é a regra aplicável?",
    opcoes: [
      "Continuado simples, com aumento de 1/6 a 2/3.",
      "Concurso material obrigatório, porque houve grave ameaça.",
      "Concurso formal impróprio, por haver desígnios autônomos.",
      "Continuado específico: pena de um só roubo aumentada até o triplo, considerando o art. 59, sem exceder a soma das penas."
    ], correta: 3,
    explicacao: "Crimes dolosos, com grave ameaça, contra vítimas diferentes: art. 71, parágrafo único. O aumento não é automático (pesa o art. 59) e tem o teto do cúmulo material benéfico e do art. 75. A violência não impede a continuidade; só muda a espécie. Não há formal porque houve três ações.",
    fonte: "CP, art. 71, parágrafo único; AgRg nos EDcl no HC 959.996/MT" },

  { id: "m2-11", modulo: "m2", tema: "Há continuidade?", tipo: "caso", nivel: 2,
    enunciado: "Caso hipotético. B. tem extensa ficha criminal por furtos e vive disso. Em três semanas, na mesma cidade, pratica quatro furtos a residências, todos com arrombamento, escolhendo previamente cada alvo. Os requisitos objetivos parecem preenchidos. Há continuidade?",
    opcoes: [
      "Não: a habitualidade ou profissionalismo criminoso afasta a continuidade, mesmo com os requisitos objetivos preenchidos.",
      "Sim: preenchidos os requisitos objetivos, a continuidade é obrigatória.",
      "Sim, mas só entre os furtos praticados na mesma semana.",
      "Não, porque furtos a residências diferentes têm vítimas diferentes."
    ], correta: 0,
    explicacao: "O HC 445.214/SC, citado no Ac. 2, afastou a continuidade de quem fazia da atividade criminosa sua profissão, mesmo com os requisitos objetivos presentes. O criminoso contumaz não se confunde com o de ocasião. A D erra: vítimas diferentes não impedem a continuidade (Ac. 1).",
    fonte: "HC 445.214/SC, citado no AgRg no HC 789.716/SC" },

  { id: "m2-12", modulo: "m2", tema: "Fração", tipo: "vf", nivel: 2,
    enunciado: "No Ac. 1, para a vítima G. P., cujos abusos foram comprovados apenas como ocorridos mais de uma vez, sem número preciso, a sentença aplicou a fração mínima de 1/6 da continuidade.",
    correta: true,
    explicacao: "Verdadeiro. Em razão da imprecisão sobre o número de ocorrências, o juiz usou 1/6 (12 + 2 = 14 anos), com apoio do TJSC. Para a vítima C., abusada quase todas as noites por cerca de 2 anos, usou 2/3 (20 anos).",
    fonte: "Sentença transcrita no AgRg no HC 1.093.762/SC" },

  { id: "m2-13", modulo: "m2", tema: "Via do habeas corpus", tipo: "mc", nivel: 3,
    enunciado: "Considerando os três acórdãos, em que situação o STJ reconhece a continuidade em habeas corpus?",
    opcoes: [
      "Quando é preciso reexaminar provas para verificar o modo de execução.",
      "Quando os fatos fixados pelo tribunal de origem já mostram os requisitos e basta a revaloração jurídica.",
      "Quando a defesa alega que as diferenças de modus operandi são meras nuances.",
      "Nunca, por vedação absoluta da Súmula 7."
    ], correta: 1,
    explicacao: "No Ac. 1, a ordem foi concedida de ofício por revaloração jurídica, sem ofensa à Súmula 7. Nos Ac. 2 e 3, rever a conclusão do TJ exigiria imersão na prova ou dilação probatória, o que é vedado em HC.",
    fonte: "AgRg no HC 1.093.762/SC; AgRg no HC 789.716/SC; AgRg nos EDcl no HC 959.996/MT" },

  { id: "m2-14", modulo: "m2", tema: "Há continuidade?", tipo: "classificar", nivel: 2,
    enunciado: "Classifique cada situação conforme a solução dada (ou que seria dada) pelo STJ.",
    categorias: ["Continuidade (art. 71)", "Concurso material (art. 69)"],
    itens: [
      { texto: "Padrasto abusa de duas enteadas na mesma casa, com o mesmo modo e a mesma autoridade (Ac. 1).", cat: 0 },
      { texto: "Furto com comparsa e, três dias depois, furto sozinho com arrombamento de veículo (Ac. 2).", cat: 1 },
      { texto: "Facadas indiscriminadas contra cinco pessoas numa briga de bar, com desígnios autônomos (Ac. 3).", cat: 1 },
      { texto: "Atropelamento de uma vítima e, depois, facadas contra outra (REsp 1.588.037/GO).", cat: 1 },
      { texto: "Exemplo do livro (Estefam): empregada furta uma peça do faqueiro por dia, com o plano de completar o conjunto.", cat: 0 },
      { texto: "Réu que faz do furto sua profissão, com vários furtos no mesmo mês (HC 445.214/SC).", cat: 1 }
    ],
    explicacao: "Continuidade só com todas as peças: mesma espécie, tempo, lugar, modo e unidade de desígnios. Modo distinto (Ac. 2; atropelamento x facadas), desígnios autônomos (Ac. 3) ou habitualidade (HC 445.214/SC) levam ao concurso material. Vítimas diferentes, sozinhas, não impedem (Ac. 1).",
    fonte: "Acórdãos 1 a 3 e precedentes citados" }
);

</script>
<script>/* questions/m3.js */
window.PENA = window.PENA || { modules: [], questions: [], widgets: {}, css: [] };
PENA.questions.push(
  { id: "m3-01", modulo: "m3", tema: "Crime único x concurso formal", tipo: "caso", nivel: 1,
    enunciado: `Numa van lotada, o agente, com arma de fogo, anuncia o assalto e manda uma passageira recolher os bens de três passageiros: dois cordões, uma pulseira e um celular, de vítimas diferentes. A defesa alega crime único: mesmo local, mesmo tempo e “unidade de desígnio”. Segundo o STJ (AgRg no HC 990.859/RJ), há:`,
    opcoes: [
      `Crime único, pois houve uma só grave ameaça, dirigida a todos.`,
      `Crime continuado, pela identidade de tempo, lugar e modo de execução.`,
      `Concurso formal, pois uma só ação atingiu patrimônios distintos.`,
      `Concurso material, pois foram três vítimas.`
    ],
    correta: 2,
    explicacao: `Tese 2 do julgado: subtrair bens de vítimas distintas no mesmo contexto caracteriza concurso formal (art. 70), não crime único. O critério é o número de patrimônios atingidos. Não é continuidade nem concurso material, porque ambos exigem mais de uma ação; aqui houve uma só.`,
    fonte: "STJ, AgRg no HC 990.859/RJ, 5ª T., 2025; CP, art. 70" },

  { id: "m3-02", modulo: "m3", tema: "Dosimetria do caso", tipo: "calc", nivel: 2,
    enunciado: `No caso da van, após a 2ª fase (confissão, −1/6), a pena do roubo mais grave ficou em 5 anos, 6 meses e 20 dias (valor reconstruído). Aplicando a majorante da arma de fogo do art. 157, § 2º-A, I, do CP, a pena passa a ser:`,
    opcoes: [`6 anos e 8 meses`, `7 anos, 4 meses e 26 dias`, `8 anos e 4 meses`, `9 anos, 3 meses e 3 dias`],
    correta: 3,
    explicacao: `A majorante da arma de fogo é de 2/3. Conta: 5a 6m 20d = 66 meses e 20 dias. 2/3 disso = 44 meses e 13 dias (desprezada a fração de dia). Soma: 110 meses e 33 dias = 111 meses e 3 dias = 9a 3m 3d. Os distratores aplicam 1/5 (6a 8m), 1/3 (7a 4m 26d) e 1/2 (8a 4m). Atenção: a pena-base e as etapas intermediárias são reconstrução aritmética; o acórdão informa só as frações e a pena final.`,
    fonte: "CP, art. 157, § 2º-A, I; AgRg no HC 990.859/RJ (reconstrução)" },

  { id: "m3-03", modulo: "m3", tema: "Pena-base", tipo: "mc", nivel: 2,
    enunciado: `Sobre a 1ª fase da dosimetria no AgRg no HC 990.859/RJ, é correto afirmar que o STJ:`,
    opcoes: [
      `Exigiu a fração de 1/6 por circunstância judicial negativa, sob pena de nulidade.`,
      `Entendeu que o roubo em transporte coletivo justifica exasperar a pena-base e que o trauma psicológico duradouro da vítima permite valorar negativamente as consequências do crime.`,
      `Afastou a valoração negativa, por considerar o transporte coletivo elementar do roubo majorado.`,
      `Reconheceu de ofício a reincidência omitida pelo juiz de 1º grau.`
    ],
    correta: 1,
    explicacao: `O STJ manteve as duas valorações: transporte coletivo (circunstâncias) e trauma que não se confunde com mero abalo passageiro (consequências, AgRg no HC 785.572/SP). Não há direito a fração fixa (A errada). Transporte coletivo não é elementar do roubo (C errada). A reincidência não pôde ser reconhecida em recurso exclusivo da defesa (D errada).`,
    fonte: "AgRg no HC 990.859/RJ; AgRg no HC 785.572/SP" },

  { id: "m3-04", modulo: "m3", tema: "Pena-base", tipo: "vf", nivel: 1,
    enunciado: `No AgRg no HC 990.859/RJ, o STJ afirmou que não há direito subjetivo do réu a uma fração específica de aumento da pena-base, sendo admissível critério mais gravoso que 1/6 do mínimo ou 1/8 do intervalo, desde que fundamentado.`,
    correta: true,
    explicacao: `Verdadeiro. 1/6 sobre a pena mínima e 1/8 sobre o intervalo entre mínimo e máximo são referências aceitas, não regras obrigatórias. Critério mais gravoso é possível se fundamentado, como no caso (AgRg no AREsp 2.820.175/RJ; AgRg no AREsp 2.826.532/ES; AgRg no HC 718.681/SP).`,
    fonte: "AgRg no HC 990.859/RJ" },

  { id: "m3-05", modulo: "m3", tema: "Non reformatio in pejus", tipo: "caso", nivel: 2,
    enunciado: `No caso da van, o juiz deixou de reconhecer a reincidência do réu e, ao aplicar o concurso formal, não totalizou os dias-multa, apenas mencionando o art. 72 do CP. Só a defesa apelou. O tribunal:`,
    opcoes: [
      `Deve manter os dois erros, pois corrigi-los agravaria a situação do réu em recurso exclusivo da defesa.`,
      `Deve corrigir os dois erros, por serem matéria de ordem pública.`,
      `Deve anular a sentença, por violação ao princípio da correlação.`,
      `Pode corrigir a multa, por ser mero erro material, mas não a reincidência.`
    ],
    correta: 0,
    explicacao: `O TJRJ registrou que os dois equívocos “se eternizam”: em recurso exclusivo da defesa, vale a proibição de reformatio in pejus. A multa não é exceção: completá-la também pioraria a situação do réu.`,
    fonte: "AgRg no HC 990.859/RJ (relatório, acórdão do TJRJ)" },

  { id: "m3-06", modulo: "m3", tema: "Correlação", tipo: "caso", nivel: 2,
    enunciado: `A denúncia narrou a subtração de bens de três passageiros da van. Condenado por três roubos em concurso formal, o réu alega violação ao princípio da correlação, sustentando que a sentença deu aos fatos enquadramento jurídico diferente do que ele esperava. A alegação:`,
    opcoes: [
      `Procede: há nulidade absoluta, que dispensa prova de prejuízo.`,
      `Procede: o juiz deveria ter aberto vista ao Ministério Público para aditar a denúncia.`,
      `Procede em parte: a sentença vale só para uma das vítimas.`,
      `Não procede: o réu se defende dos fatos narrados, não da capitulação, e o juiz pode dar ao fato definição jurídica diversa.`
    ],
    correta: 3,
    explicacao: `O acórdão afastou a nulidade: a denúncia descreveu roubos contra as três vítimas, e o réu se defende dos fatos. O juiz pode atribuir ao fato outra classificação (emendatio libelli, CPP, art. 383). O aditamento é próprio da mutatio libelli, quando surge fato novo não narrado, o que não ocorreu (complemento).`,
    fonte: "AgRg no HC 990.859/RJ; CPP, art. 383" },

  { id: "m3-07", modulo: "m3", tema: "Crime único x concurso formal", tipo: "classificar", nivel: 2,
    enunciado: `Classifique cada situação, segundo o critério do número de patrimônios atingidos.`,
    categorias: ["Crime único", "Concurso formal"],
    itens: [
      { texto: `Em uma van lotada, com uma só ameaça a todos, o agente leva bens de três passageiros diferentes.`, cat: 1 },
      { texto: `Uma única conduta lesa o patrimônio de duas pessoas jurídicas distintas (Correios e uma empresa de segurança).`, cat: 1 },
      { texto: `O agente ameaça três funcionários de uma loja, mas leva apenas o dinheiro do caixa da empresa.`, cat: 0 },
      { texto: `Num ônibus, anuncia o assalto e recolhe os celulares de quatro passageiros.`, cat: 1 },
      { texto: `Aborda pai e filho com arma, mas subtrai só o carro, que pertence ao pai.`, cat: 0 }
    ],
    explicacao: `Vários patrimônios atingidos por uma só ação: concurso formal (AgRg no HC 990.859/RJ; AgRg no AREsp 1.826.160/PB, sobre as duas pessoas jurídicas). Grave ameaça a várias pessoas, mas um só patrimônio subtraído: crime único; as demais pessoas são vítimas da ameaça (complemento: contraponto doutrinário e jurisprudencial, não tratado no acórdão).`,
    fonte: "AgRg no HC 990.859/RJ; AgRg no AREsp 1.826.160/PB" },

  { id: "m3-08", modulo: "m3", tema: "Concurso formal próprio", tipo: "mc", nivel: 3,
    enunciado: `A Defensoria sustentou que os roubos na van revelavam “unidade de desígnio” e pediu o reconhecimento de crime único. Tecnicamente, a expressão “unidade de desígnio”:`,
    opcoes: [
      `É o traço que caracteriza o crime único e afasta a pluralidade de delitos.`,
      `É a marca do concurso formal próprio e não afasta a pluralidade de crimes quando vários patrimônios são atingidos.`,
      `É a marca do concurso formal impróprio, o que levaria à soma das penas.`,
      `É requisito do crime continuado, o que imporia a aplicação do art. 71 ao caso.`
    ],
    correta: 1,
    explicacao: `Unidade de desígnio caracteriza o concurso formal próprio (exasperação: pena mais grave + 1/6 a 1/2). Desígnios autônomos levam ao impróprio (soma). Continuidade não cabe, porque houve uma só ação. A alegação da defesa, na verdade, descreve o próprio regime aplicado: concurso formal próprio com aumento de 1/5.`,
    fonte: "CP, art. 70; AgRg no HC 990.859/RJ" },

  { id: "m3-09", modulo: "m3", tema: "Transporte coletivo", tipo: "caso", nivel: 3,
    enunciado: `O juiz aumentou a pena-base de um roubo apenas porque foi praticado dentro de um ônibus. Consta dos autos que o ônibus estava vazio e que o agente usou um simulacro de arma. À luz do precedente citado no AgRg no HC 990.859/RJ (AgRg no HC 693.887/ES), o aumento:`,
    opcoes: [
      `Deve ser decotado, pois a ação não desbordou da periculosidade própria do tipo.`,
      `Deve ser mantido, pois o transporte coletivo sempre agrava a pena-base.`,
      `Deve migrar para a 3ª fase, como majorante do roubo.`,
      `Só se mantém se a vítima for o motorista ou o cobrador.`
    ],
    correta: 0,
    explicacao: `O fundamento “transporte coletivo” é idôneo “via de regra”. No AgRg no HC 693.887/ES, com ônibus vazio e simulacro, o aumento foi decotado. No caso da van, ao contrário, o veículo estava lotado e a arma era de fogo. Transporte coletivo não é majorante do roubo (C errada).`,
    fonte: "AgRg no HC 693.887/ES, citado no AgRg no HC 990.859/RJ" },

  { id: "m3-10", modulo: "m3", tema: "Fração do concurso formal", tipo: "calc", nivel: 2,
    enunciado: `No caso da van, após a 3ª fase, a pena do roubo mais grave ficou em 9 anos, 3 meses e 3 dias (valor reconstruído). Foram três roubos em concurso formal próprio. Aplicando a fração que o STJ considerou proporcional, a pena final é:`,
    opcoes: [`10 anos, 9 meses e 18 dias`, `12 anos, 4 meses e 4 dias`, `11 anos, 1 mês e 9 dias`, `13 anos, 10 meses e 19 dias`],
    correta: 2,
    explicacao: `Três crimes: 1/5 (HC 284.619/RS: 1/3 para três crimes é ilegal). Conta: 9a 3m 3d = 111 meses e 3 dias; 1/5 = 22 meses e 6 dias (desprezada a fração de dia) = 1a 10m 6d. Soma: 11a 1m 9d, a pena do caso. Distratores: 1/6 (10a 9m 18d), 1/3 (12a 4m 4d) e 1/2 (13a 10m 19d).`,
    fonte: "CP, art. 70; AgRg no HC 990.859/RJ; HC 284.619/RS" }
);

</script>
<script>/* questions/m4.js */
window.PENA = window.PENA || { modules: [], questions: [], widgets: {}, css: [] };
PENA.questions.push(
  { id: "m4-01", modulo: "m4", tema: "Art. 75", tipo: "mc", nivel: 1,
    enunciado: `Sobre o art. 75 do Código Penal, com a redação da Lei 13.964/2019, é correto afirmar:`,
    opcoes: [
      `Ninguém pode ser condenado a penas que, somadas, ultrapassem 40 anos.`,
      `O tempo de cumprimento das penas privativas de liberdade não pode passar de 40 anos, o que não impede condenações cuja soma exceda esse limite.`,
      `O limite de 40 anos aplica-se também à prisão simples das contravenções.`,
      `A unificação das penas é feita pelo juiz da sentença condenatória.`
    ],
    correta: 1,
    explicacao: `O limite é de cumprimento, não de condenação (A errada). Contravenções têm teto de 5 anos (LCP, art. 10) (C errada). A unificação compete ao juízo da execução (LEP, art. 66, III, a) (D errada).`,
    fonte: "CP, art. 75; LCP, art. 10; LEP, art. 66, III, a" },

  { id: "m4-02", modulo: "m4", tema: "Direito intertemporal", tipo: "vf", nivel: 2,
    enunciado: `Para um crime praticado em 2018, aplica-se o teto de 40 anos do art. 75 do CP, porque a norma trata da execução da pena e tem aplicação imediata.`,
    correta: false,
    explicacao: `Falso (complemento). A elevação de 30 para 40 anos é lei penal mais grave (novatio legis in pejus), logo irretroativa (CF, art. 5º, XL; CP, art. 2º). A Lei 13.964/2019 vigora desde 23/01/2020; para crimes anteriores, o teto continua de 30 anos.`,
    fonte: "CF, art. 5º, XL; CP, art. 2º (complemento)" },

  { id: "m4-03", modulo: "m4", tema: "Contravenções", tipo: "mc", nivel: 1,
    enunciado: `Um réu foi condenado por várias contravenções penais, e as penas de prisão simples somam 12 anos. O tempo máximo de cumprimento é de:`,
    opcoes: [`40 anos`, `30 anos`, `5 anos`, `12 anos, pois o limite só vale para crimes`],
    correta: 2,
    explicacao: `LCP (Decreto-lei 3.688/1941), art. 10: a prisão simples não pode, em caso algum, passar de 5 anos. O teto de 40 anos do art. 75 do CP é para penas privativas de liberdade de crimes; 30 anos era o teto antigo.`,
    fonte: "LCP, art. 10" },

  { id: "m4-04", modulo: "m4", tema: "Súmula 715", tipo: "calc", nivel: 2,
    enunciado: `João foi condenado a penas que somam 150 anos, unificadas em 40 pelo juízo da execução. Suponha, só para o exercício, que o requisito objetivo de um benefício seja cumprir 25% da pena. Segundo a Súmula 715 do STF, João atinge esse requisito após cumprir:`,
    opcoes: [`10 anos`, `30 anos`, `40 anos`, `37 anos e 6 meses`],
    correta: 3,
    explicacao: `A pena unificada não é considerada para benefícios; usa-se a pena total. Conta: 25% de 150 anos = 37,5 anos = 37 anos e 6 meses. Calcular sobre a unificada (25% de 40 = 10 anos) é o erro que a súmula proíbe. O percentual de 25% é hipotético (complemento).`,
    fonte: "STF, Súmula 715" },

  { id: "m4-05", modulo: "m4", tema: "Nova condenação", tipo: "classificar", nivel: 2,
    enunciado: `Um condenado cumpre pena já unificada no teto. Classifique o que acontece com cada nova condenação (no item do hiato, ele já havia cumprido tudo).`,
    categorias: ["Soma ao total, sem nova unificação", "Nova unificação, desprezando o cumprido", "Fora do art. 75 (hiato)"],
    itens: [
      { texto: `Chega condenação por roubo praticado dois anos antes da prisão.`, cat: 0 },
      { texto: `Mata outro detento no pavilhão e é condenado por homicídio.`, cat: 1 },
      { texto: `Cumpriu integralmente as penas, foi solto e, três anos depois, comete estelionato.`, cat: 2 },
      { texto: `Sentença por tráfico cometido antes do início do cumprimento só sai cinco anos depois que ele começou a cumprir pena.`, cat: 0 },
      { texto: `No décimo ano de cumprimento, agride um agente penitenciário e é condenado por lesão corporal grave.`, cat: 1 }
    ],
    explicacao: `O critério é a data do fato. Fato anterior ao início do cumprimento, mesmo julgado depois: soma ao total, sem nova unificação. Fato posterior (crime na prisão): nova unificação, desprezando o tempo cumprido (art. 75, § 2º). Novo crime depois de cumprida toda a pena: hiato; as penas anteriores ficam fora da conta (RHC 8.657/PR).`,
    fonte: "CP, art. 75, § 2º; Nucci; RHC 8.657/PR" },

  { id: "m4-06", modulo: "m4", tema: "Nova condenação: fato anterior", tipo: "calc", nivel: 2,
    enunciado: `(Teto antigo de 30 anos.) Réu condenado a 300 anos começa a cumprir pena em 10/03/1960. Depois, recebe nova condenação de 20 anos por crime cometido antes de 10/03/1960. A data prevista de saída passa a ser:`,
    opcoes: [`09/03/1990`, `09/03/1980`, `09/03/2000`, `09/03/2010`],
    correta: 0,
    explicacao: `Fato anterior ao início do cumprimento: a pena entra no montante total (300 + 20 = 320 anos), sem nova unificação e sem mudar o termo final. Conta: 10/03/1960 + 30 anos = 09/03/1990 (o dia do começo entra no cômputo). Nas palavras do material: “com 300 ou 320 anos o tempo máximo não se altera”. 2010 seria o erro de somar os 20 anos ao teto.`,
    fonte: "CP, art. 75; Nucci (exemplo 1)" },

  { id: "m4-07", modulo: "m4", tema: "Nova condenação: fato posterior", tipo: "calc", nivel: 3,
    enunciado: `(Teto antigo de 30 anos.) Réu condenado a 300 anos, pena unificada em 30, começa a cumprir em 10/03/1960. Em 1970, depois de cumprir 10 anos, comete crime no presídio e é condenado a 25 anos. A previsão de saída passa a ser:`,
    opcoes: [`1990`, `1995`, `2000`, `2015`],
    correta: 2,
    explicacao: `Fato posterior ao início: despreza-se o tempo cumprido. Restante da unificada: 30 − 10 = 20. Com a nova pena: 20 + 25 = 45, acima de 30, então nova unificação em 30, contados de 1970: saída em 2000. Tempo efetivo preso: 10 + 30 = 40 anos. 1995 soma só os 25 a partir de 1970; 2015 esquece de unificar os 45.`,
    fonte: "CP, art. 75, § 2º; Nucci (exemplo 2)" },

  { id: "m4-08", modulo: "m4", tema: "Nova condenação: fato posterior", tipo: "calc", nivel: 3,
    enunciado: `Refaça o caso de Nucci com o teto atual: pena unificada em 40 anos; após cumprir 10, o réu comete crime no presídio e é condenado a 25 anos. O tempo efetivo total de prisão será de:`,
    opcoes: [`40 anos`, `50 anos`, `55 anos`, `65 anos`],
    correta: 1,
    explicacao: `Conta: 40 − 10 = 30 restantes; 30 + 25 = 55, acima de 40, então nova unificação em 40. Efetivo: 10 já cumpridos + 40 = 50 anos. O exemplo com 40 anos é adaptação (complemento); o material usa o teto antigo de 30.`,
    fonte: "CP, art. 75, § 2º (complemento: adaptação para 40 anos)" },

  { id: "m4-09", modulo: "m4", tema: "Nova condenação: fato posterior", tipo: "calc", nivel: 3,
    enunciado: `Pena unificada em 40 anos. Depois de cumprir 30, o condenado pratica crime dentro do presídio e recebe nova pena de 15 anos. Quanto tempo ainda vai cumprir e qual o tempo efetivo total?`,
    opcoes: [`Mais 10 anos; efetivo de 40`, `Mais 15 anos; efetivo de 45`, `Mais 40 anos; efetivo de 70`, `Mais 25 anos; efetivo de 55`],
    correta: 3,
    explicacao: `Despreza-se o cumprido: 40 − 30 = 10 restantes; 10 + 15 = 25. Como 25 não passa de 40, não há corte: cumpre mais 25 anos. Efetivo: 30 + 25 = 55 anos. Erro comum: achar que toda nova condenação reinicia 40 anos (70). Exemplo de complemento.`,
    fonte: "CP, art. 75, § 2º (complemento)" },

  { id: "m4-10", modulo: "m4", tema: "Hiato", tipo: "caso", nivel: 2,
    enunciado: `Maria cumpriu integralmente penas que totalizavam 30 anos e foi libertada. Dois anos depois, praticou novo crime e foi condenada a 15 anos. A defesa pede a unificação com as penas anteriores, alegando que ela já cumpriu o limite legal. O pedido:`,
    opcoes: [
      `Deve ser deferido, pois o art. 75 veda cumprir mais que o teto em qualquer hipótese.`,
      `Deve ser indeferido, pois, havendo hiato entre o fim das penas anteriores e o começo das novas, não se aplica o art. 75.`,
      `Deve ser deferido em parte, abatendo-se metade da nova pena.`,
      `Deve ser indeferido apenas se o novo crime for hediondo.`
    ],
    correta: 1,
    explicacao: `O art. 75 alcança penas aplicadas antes e durante a execução. As penas já cumpridas são estranhas ao cálculo, sobretudo se o novo crime foi praticado em liberdade (RHC 8.657/PR, citando o STF, Rel. Moreira Alves, RT 488/414). Maria cumpre os 15 anos por inteiro.`,
    fonte: "RHC 8.657/PR" },

  { id: "m4-11", modulo: "m4", tema: "Fuga", tipo: "caso", nivel: 2,
    enunciado: `Um condenado foge do presídio e é recapturado três anos depois. Quanto ao limite do art. 75:`,
    opcoes: [
      `A contagem dos 40 anos reinicia a partir da recaptura.`,
      `A fuga interrompe a execução, e deve ser feita nova unificação.`,
      `O limite conta a partir do início do cumprimento, pois a fuga apenas suspende a execução.`,
      `Os três anos de fuga contam como pena cumprida.`
    ],
    correta: 2,
    explicacao: `STF, HC 84.766/SP: a fuga não interrompe a execução, só a suspende. Por isso o teto conta do início do cumprimento, não da recaptura. D errada: com a execução suspensa, o período foragido não é pena cumprida (complemento).`,
    fonte: "STF, HC 84.766/SP" },

  { id: "m4-12", modulo: "m4", tema: "Unificação", tipo: "mc", nivel: 1,
    enunciado: `Segundo o material, são razões para a unificação de penas:`,
    opcoes: [
      `Política criminal (evitar pena de caráter perpétuo) e adequação de tipicidade (crime continuado não reconhecido pelo juiz da ação penal).`,
      `Reincidência e maus antecedentes.`,
      `Apenas a política criminal.`,
      `Adequação de tipicidade em caso de concurso material.`
    ],
    correta: 0,
    explicacao: `São duas: política criminal, que é a unificação do art. 75, § 1º, para evitar pena perpétua; e adequação de tipicidade, quando havia crime continuado que não pôde ser reconhecido no processo de conhecimento (ex.: processos diferentes), tarefa que fica para a execução. Concurso material é justamente o caso de somar, não de unificar por tipicidade.`,
    fonte: "Material de aula (Limite das penas); CP, art. 75, § 1º" }
);
